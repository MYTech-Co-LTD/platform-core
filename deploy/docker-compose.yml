# deploy/docker-compose.yml — 平台底座单机编排（**全仓两份 compose 之一，部署单元 A**，约束 B7
# 白名单；另一份是 deploy/data-compose.yml 部署单元 B/数据面，P1 起放行）
#
# 两个用法，语义完全一致，不是两份编排：
#   ① 只起 PG（本地冒烟/开发最常用）：
#        docker compose -f deploy/docker-compose.yml up -d postgres
#        # scripts/smoke-load.mjs 的本地前置就是这一条：宿主直连 127.0.0.1:5432
#   ② 单机整体起（本任务 Step 1 的验收入口）：
#        docker compose -f deploy/docker-compose.yml up --build -d
#        curl -i http://127.0.0.1:13000/healthz        # ← 期望 200
#
# 生产（OpenShip services 模式）怎么接这份文件、哪些项要改，见 deploy/openship-adopt.md。
# 这里只放「单机跑起来所需的最小面」，不放生产差异项——两份事实源会漂移，差异全部写在 runbook 里。
#
# ⚠️ 顶层 name 是【必需】的，不是装饰：compose 的默认项目名取自 compose 文件所在的**目录名**，
# 而本文件在 deploy/ 下 —— 任何同样把 compose 放在 deploy/ 的仓库都会得到同一个项目名 `deploy`，
# 于是 `docker compose up` 会去**接管甚至重建别人的容器**；卷名同样撞（别人的 `deploy_pgdata`
# 会与本仓的 `deploy_pgdata` 是同一个卷，双方的数据目录互相污染）。这不是理论风险：Task 22
# 第一次 `up -d postgres` 就把另一个项目（compose 也在 deploy/ 下）的存活容器就地 Recreate 了。
# 写死项目名后网络/卷前缀稳定为 platform-core_*，与别人的 deploy_* 隔离。
name: platform-core

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 绑回环（M1 闭债 R5）：本地冒烟/排障照旧走 127.0.0.1:5432 即可（文件头用法①、
      # docs/m0-smoke-checklist.md、scripts/dev-stack.mjs 走的都是它，收窄零影响），
      # 同时**不给宿主公网面留暴露**——生产本也不该把库暴露出去，绑回环让这一点
      # **不依赖人工动作**（先前的口径是"adopt 时删掉这条"，那要靠人记得做）。
      - '127.0.0.1:5432:5432'
    healthcheck:
      # 没有它 server 会在 PG 就绪前连库（迁移直接失败）——与 CI 里 postgres service 的
      # health-cmd 是同一条理由
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      # context 必须是【仓根】：Dockerfile 要 COPY packages/ apps/ modules/ scripts/，
      # context 设成 deploy/ 会让整份镜像构建失败
      context: ..
      dockerfile: deploy/Dockerfile.server
    # 运行时 env 来自根 .env（gitignore；模板是根 .env.example，B9 门禁保证键齐全）。
    # required:false —— 缺 .env 时不报错（纯 `up -d postgres` 的用法不该被它卡住）
    # 注意：`required` 字段需 **Compose ≥ 2.24**；更早版本会以 **schema 报错**拒解析整份文件
    # （`env_file.0 must be a string`）——不是静默忽略，CLI 旗标也绕不过去。低于该版本的
    # 环境需升级 compose，或临时改回短形式（`- ../.env`，代价见上一行：变成无条件必有 .env）。
    env_file:
      - path: ../.env
        required: false
    environment:
      # .env.example 里的 DATABASE_URL 是【宿主视角】（127.0.0.1）；容器内必须走服务名。
      # environment 优先级高于 env_file，故这里是权威值。
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      # 容器监听端口。**端口在 compose 里就这两处**：这里定容器内监听，下面 ports 的左端
      # 定宿主映射（右端必须跟这里一致）。.env 里的同名键会被本项覆盖，别去改 .env 的 PORT。
      PORT: '13000'
      # 沙箱交换卷在 server 侧的挂载点（与下面 volumes 一致）。`DATA_SANDBOX_URL` /
      # `DATA_SANDBOX_TOKEN` **不写在这里**：compose 的 ${} 插值读的是 deploy/.env 或 shell，
      # 不是 env_file 指的 ../.env（同 openclaw 的 OPENCLAW_GATEWAY_TOKEN 一类的坑）⇒
      # 写了反而可能用空值覆盖掉真值。它们由根 .env / openship 服务行 env 注入。
      DATA_SANDBOX_DIR: /run/duckle-sandbox
    depends_on:
      postgres:
        # service_healthy 而非 service_started：迁移在启动期跑，PG 未就绪即失败
        condition: service_healthy
    ports:
      # HOST_PORT 只是给「本机 13000 被别的进程占着」这种情况留的逃生口（Task 22 实测踩到：
      # 另一工作树遗留的 dev mock 长占 13000）。**默认值就是 13000，生产不需要设它**。
      # 注意 compose 的 ${} 插值只读「本 compose 文件所在目录的 .env」与 shell 环境，
      # 不读上面 env_file 指的 ../.env —— 所以用法是 `HOST_PORT=13001 docker compose ... up`。
      # 容器侧端口恒为 13000（下面 environment.PORT），宿主映射由它决定。
      # 绑回环（M1 闭债 R5）：生产上本服务只经 openship edge 访问，edge 在宿主上反代
      # 127.0.0.1:<port> ⇒ 绑 0.0.0.0 会让任何能访问宿主该端口的人**绕过 edge**
      # （丢掉证书、限速与访问控制）。
      # 生产照搬本文件（openship-adopt.md「生产差异」只列了三处必改项），所以这条映射
      # 是生产入口面的一部分：**不绑回环就必须在生产手工加差异项**，绑了则本地冒烟/开发
      # 不受影响（它们走 127.0.0.1，见文件头用法①）。
      # 注：上面 postgres 的那条映射（R5 修复轮必须改 3）**同样已绑回环** —— 两条映射
      # 现在口径一致，不再"server 绑了、DB 靠生产侧手工删"。`scripts/check-compose.mjs`
      # 的 B7 规则二守着**文件里所有** ports 条目（必须 `127.0.0.1:` 起头；R5-2 建议改 3 把
      # 覆盖面从这两个服务名扩到全文；白名单两份**各自适用**），外加「受管服务还在这份文件里、
      # 却一条条目都没有」要报（受管名按文件给：本份是 postgres/server，数据面那份不设）。
      # 反过来：**整份删掉 postgres service 不报**（adopt 文档「生产差异」选项 2 就是这条路
      # ——那不是绕过，是把宿主暴露面整个去掉）；留个空 ports 块则报。
      # 另：`network_mode: host` 不在这条覆盖内（该模式下 compose 忽略 ports，真实绑定取决于
      # 进程自己的 listen 地址，守卫读文本读不出来）——本仓不用该模式。
      - '127.0.0.1:${HOST_PORT:-13000}:13000'
    volumes:
      # 沙箱交换卷（#1002）：写草案（sandbox/）、读回执（runs/receipts/）。**不 readonly**——
      # 草案由 server 写。与 sandbox-console 共用同一命名卷。
      - sandbox-workspace:/run/duckle-sandbox
    # 启动期故障（如 Casdoor 不可达 → upsertPermission 抛错）不该让容器一停不起；
    # 反复重启会把失败暴露在 docker compose ps 的 Restarting 上，而不是静默躺着
    restart: unless-stopped

  # 通知投递 worker（2026-10-27 通知基础设施 §7.4）：同镜像、换 command、**无端口**。
  # 轮询 outbox（租约 + SKIP LOCKED）；与 server 共用 DATABASE_URL 与项目 env。
  notify-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
    # 运行镜像已含 tsx（node_modules 全量 COPY，未 prune）；不要用裸 node 跑 .ts import
    command: ['pnpm', 'exec', 'tsx', 'scripts/notify-worker.mjs']
    depends_on:
      postgres:
        condition: service_healthy
    # ⚠️ **必须覆盖镜像的 HEALTHCHECK**：Dockerfile.server 的探活打 `127.0.0.1:${PORT}/healthz`，
    #    而 worker 是**无 HTTP 端口的常驻进程** ⇒ 继承下来恒 unhealthy（2026-10-27 生产实测：
    #    `Up 26 minutes (unhealthy)`，进程实际正常跑、日志每 2s 一轮）。
    #    这里改用 worker 自己的事实源：心跳表新鲜度（worker 每轮 upsert `notify.worker_heartbeat`）。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const{Client}=require('/app/apps/server/node_modules/pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"select 1 from notify.worker_heartbeat where beat_at > now()-interval '2 minutes'\")).then(r=>{process.exit(r.rowCount?0:1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # 报表编辑页专用入口（spec §3⑦）：反代会话。与 server 同镜像、换 command。
  # 对外由 edge 路由到一个每客户专用 host（部署 SOP 见 deploy/data-plane-deploy-sop.md）。
  mb-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: platform-core-mb-proxy:local
    # ⚠️ **必须覆盖 command**：Dockerfile.server 的 CMD 是跑 @platform/server（`Dockerfile.server:118`），
    #    不覆盖的话这个容器会把**平台宿主**再起一遍（同镜像、错入口）。
    command: ['pnpm', '--filter', '@platform/mb-proxy', 'start']
    # ⚠️ **`profiles` 只是本机 `docker compose` 的默认启停语义，不是部署闸门**（2026-09-29 生产实测，issue #369）：
    #    openship **按自己的服务清单逐服务显式启停**，`profiles` 对它**无效** ⇒ 合并当天这台机器上该服务
    #    照样被拉起，而它启动需要 `MB_PROXY_CONSOLE_ORIGIN`（+ 复用的 `PLATFORM_SESSION_SECRET`/
    #    `DATA_METABASE_URL`/`DATA_METABASE_API_KEY`，这些都是**每客户**才备的）⇒ 启动期抛 ⇒ crash loop + 开事故。
    #    **真正的闸门 = openship 服务级 `enabled` 开关**（默认 false；启用某客户时先备 env 再置 true）。
    #    详见 `deploy/mb-edit-proxy-runbook.md` §E2 与其后的实测注记。
    profiles: ['edit-proxy']
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: '13010'
    ports:
      - '127.0.0.1:13010:13010'
    restart: unless-stopped

  # 问数 bot（通道 C，spec 2026-10-10）：企微智能机器人 WebSocket 长连接 → 平台问数 API。
  # **profiles 只是本机 docker compose 的默认启停语义，不是部署闸门**（同 mb-proxy 的教训）：
  # openship 按自己的服务清单逐服务显式启停 ⇒「仅 shanhai 启用」的闸门 = openship 服务级
  # enabled：platform-core-shanhai 项目置 true（先备 env），mytech platform-core 项目保持 false。
  # 插件源码**构建期 COPY 进自建镜像**（部署即插件更新）；state（openclaw.json/workspace）走命名卷跨部署持久。
  # 版本钉死见 spec §3（GitHub releases 为事实源；digest 绝不手改——现在钉在 Dockerfile.openclaw 的 FROM 上）。
  #
  # ⚠️ **不能用相对 bind 挂载把插件送进来**（2026-10-11 实测，从 `image:` 改回 `build:`）：
  #    openship services 模式按 **Docker API 逐服务建容器、不解析相对路径** ⇒
  #    `./openclaw/data-query-plugin:/opt/plugins/data-query-plugin:ro` 被当**命名卷名**，
  #    建容器即 400 `includes invalid characters for a local volume name … use absolute path`。
  #    同一根因的成例与替代解法见 `deploy/data-plane-deploy-sop.md` 坑 9。**别再把这条改回 bind。**
  openclaw:
    build:
      # context 与 server 同：仓根（openship 相对 `rootDirectory=deploy` 解析 `..`，见 openship-adopt.md §2）
      context: ..
      dockerfile: deploy/Dockerfile.openclaw
    profiles: ['openclaw']
    env_file:
      - path: ../.env
        required: false
    environment:
      # 平台问数 API 基址：同 compose 网络走服务名（本地与生产一致，不出公网）。
      DATA_API_BASE: http://server:13000/api/modules/data
      # ── 状态/工作目录与网关：照 data-analysis 生产先例显式钉死，不依赖镜像默认值 ──
      # 镜像 Env 里既无 HOME 也无 OPENCLAW_*，状态目录只靠 os.homedir() 兜底（未验证）；
      # 而 Task 4 要按 OPENCLAW_CONFIG_PATH 去 seed openclaw.json，是压秤的假设 ⇒ 显式写死。
      # ⚠️ 不在此列 OPENCLAW_GATEWAY_TOKEN：`${VAR:-}` 取的是 shell/项目 .env，取不到会**以空值
      # 覆盖 env_file** 注入；token 一律由 env_file(../.env) 或 openship env 注入，不经这里。
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: '18789'
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_MODE: local
    volumes:
      # 只有 state 卷（命名卷，openship 认）。插件源码不走挂载——已 COPY 进镜像（见文件头与该服务注释）。
      - openclaw_state:/home/node/.openclaw
    ports:
      # Gateway Control UI（运维用），只回环（B7 规则二）。
      - '127.0.0.1:18789:18789'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── 数据 MCP 的沙箱执行面（#1002；决策与全部口径 = docs/architecture.md §2.8）────────────
  # · 为什么在单元 A 而不是数据面：`server` 要调它，而单元 A ↔ 单元 B 是**两个 compose 网络**
  #   （实测 172.18 / 172.19，互不可达），打通要么加外部网络、要么把回环绑改成私网发布——
  #   后者破 §1.3 的「只绑回环」口径。同网络 + 服务名最省事。
  # · 为什么不塞进 server 容器：沙箱跑的是**草案作者写的管线**，而 server 容器里有 Casdoor
  #   管理员口令 / 库密码 / LLM key ⇒ 等于把它们放到不可信代码同一个进程空间里。
  # · **无 ports**：只被同网络的 `server` 用服务名访问，宿主面为零。
  # · `DUCKLE_TOKEN` 为空时 entrypoint 会**拒起**（serve 属非离线动词，见 entrypoint 的台账）——
  #   真值在 openship 服务行 env / 根 .env，不进本文件。不需要沙箱的项目把本服务置 `enabled: false`。
  # · `--duckdb` 必给（不给则每次触发都记 "DuckDB engine isn't installed yet."，实测见 console README）。
  sandbox-console:
    build:
      context: ..
      dockerfile: deploy/duckle/Dockerfile
    image: platform-core-duckle-sandbox:local
    restart: unless-stopped
    environment:
      DUCKLE_TOKEN: ${DUCKLE_TOKEN:-}
      # 共享卷里 `sandbox/`（草案）由 `server` 写 ⇒ 必须由**以 root 起的本服务**预建并交权：
      # 命名卷根目录归 root:root，`server` 是 `USER node`（uid 1000），不交权就 EACCES
      # （2026-10-23 生产实测，见 deploy/data-plane-deploy-sop.md §G.1）。
      # uid/gid 与 `deploy/Dockerfile.server` 的 `USER node` 对齐；换基础镜像时同步改这里。
      DUCKLE_SHARE_DIR: /workspace/sandbox
      DUCKLE_SHARE_UID: '1000'
      DUCKLE_SHARE_GID: '1000'
      # 资源上限（2026-10-24 定案；出处：duckle 引擎源码——`serve` 不接 --memory-limit/--threads，
      # 引擎按**进程环境变量**取值，见 docs/architecture.md §2.8「已销账」）。
      # DUCKLE_MEMORY_LIMIT 决定 DuckDB **何时落盘**（超了 spill 到 DUCKLE_TEMP_DIR），不是容器硬上限；
      # 容器级硬上限在 openship 服务行 advanced.resources（mem 1536MB / cpu 1.0，超了 OOM）——两者都要设。
      # 值必须与生产服务行保持一致，改就一起改（compose env 对「已有服务行」不自动生效，见 SOP §G.1 坑四）。
      DUCKLE_MEMORY_LIMIT: '1152MB'
      DUCKLE_THREADS: '2'
      DUCKLE_MAX_TEMP_DIR_SIZE: '1GB'
    volumes:
      # 同一个卷同时挂给 server（`/run/duckle-sandbox`）：草案进、回执出，都靠它交换。
      - sandbox-workspace:/workspace
    command: ["serve", "--host", "0.0.0.0", "--port", "18090",
              "--workspace", "/workspace", "--duckdb", "/usr/local/bin/duckdb"]
    # 无 ports：见本节标题下的理由

volumes:
  pgdata:
  openclaw_state:
  # 沙箱交换卷：草案（sandbox/<runId>.json）与引擎回执（runs/receipts/）都在这里
  sandbox-workspace:
