# deploy/data-compose.yml — 数据面部署单元 B（issue #150；spec 2026-09-20 §1/§11.1）。
# 全内网：不进 openship edge、不绑公网；所有 ports 一律回环（B7 规则二对两份 compose 都生效）。
# 拆缝用法（同仓同分支、独立 project）见 deploy/customer-onboarding.md §0/阶段 5。
# ⚠️ 顶层 name 必需——与主 compose 同一条理由（项目名/卷名撞车，docker-compose.yml 头注的实测事故）。
name: platform-core-data

services:
  # ── 湖上查询引擎 + 物化落点（2026-09-23 订正：**官方镜像**，非自建——官方镜像上游自陈配对
  #    = DuckDB v1.4.3；自建路径 `deploy/pg-duckdb/` 与 `.github/workflows/pg-duckdb-image.yml`
  #    保留为「未启用（备件）」，理由是 ossie 本轮出局 + 自选配对实测编译失败（8 处 API 断裂）──
  pg_duckdb:
    image: pgduckdb/pgduckdb:18-v1.1.1
    # 来源：Docker Hub（上游构建）。目标机 dockerd 已配 HTTPS Proxy，`docker pull` 实测可达 Docker Hub
    # ⇒ 无需 GHCR 凭据、无需本地构建（代理地址口径见公司基建速查，此处不写值）。
    # 备件路径（GHCR 拉取 / 目标机本地构建）见 deploy/pg-duckdb/README.md。
    environment:
      POSTGRES_USER: ${PGDUCK_USER:-platform}
      POSTGRES_PASSWORD: ${PGDUCK_PASSWORD:-platform}     # 真值走 project env（openship），不进 git
      POSTGRES_DB: ${PGDUCK_DB:-warehouse}
    # shared_preload_libraries 是 pg_duckdb 硬要求（spec §9.4 方案 2）
    # 新增：duckdb.memory_limit 默认 4096MB/连接，而本服务 mem_limit 默认 2g（2048MB）
    #   ⇒ DuckDB 以为自己有 4GB，重查询会被 cgroup OOM kill（无错误、容器重启）。
    #   收到 1536MB 留出 PG 自身与连接开销的余量。
    # 🔴 2026-11-06（issue #1515）：`duckdb.threads=1` 是**崩溃止血**，不是性能调优。
    #   pg_duckdb 1.1.1 的 postgres scan 有线程安全 race（上游 duckdb/pg_duckdb#1084，open）：
    #   DuckDB worker 线程读 `CurrentMemoryContext` 时未持 GlobalProcessLock ⇒ 新建的 scan
    #   memory context 可能挂到短命父上下文、随父释放 ⇒ 下一次 MemoryContextReset 操作已释放
    #   内存 ⇒ backend SIGSEGV、postmaster recovery、整轮物化报废。
    #   触发条件 = **并发会话 + 多表扫描**（物化模型 CREATE TABLE AS 读多张 staging 表正是）。
    #   2026-11-04~06 生产崩 5 次；隔离容器同镜像复现：默认 threads=-1（4 线程）4×10 轮必崩，
    #   threads=1 跑 40 轮 0 崩。**上游修复前不要撤这一项**（代价：DuckDB 并行度降到 1）。
    command: ["postgres", "-c", "shared_preload_libraries=pg_duckdb", "-c", "duckdb.memory_limit=1536MB", "-c", "duckdb.threads=1"]
    volumes:
      # ⚠️ 挂**父目录**，不是 `<父>/data`：PG18 起官方把 PGDATA 挪进版本子目录——目标机实测
      #    `PGDATA=/var/lib/postgresql/18/docker`，且 `/var/lib/postgresql/` 下只有 `18/`、**没有 `data/`**。
      #    挂 `.../data` ⇒ 卷是空的、**真集群落在容器可写层** ⇒ 容器一重建（部署/迁移/换机）集群即消失，
      #    postgres 会重新 initdb 出空库，现象是「数据面空了」而报错面完全不指向真因。issue #765。
      - pgduckdata:/var/lib/postgresql
    ports:
      # 平台侧的接线点（DATA_WAREHOUSE_URL 指这里）。**别把它读成「谁都能连」**：回环 ⇒ 够得到的
      # 是**宿主进程**（宿主上的 edge、宿主上跑的 `docker compose run` job）。
      # **容器**消费方（单元 A 的 server）另说：容器里的 127.0.0.1 是自己的 netns，不是宿主回环；
      # 两份 compose 各一个 default 网络、无共享 external 网络/extra_hosts ⇒ **按现值不可达**。
      # 接线方式待 T6 裁决（计划 Task 6 Step 1 的 Gate-B）。
      - '${DATA_BIND_ADDR:-127.0.0.1}:15432:5432'   # 默认回环；跨机拆分时设为本机私网 IP（B7 唯一例外，须配安全组白名单）
    mem_limit: ${PGDUCK_MEM_LIMIT:-4g}    # 每连接一个 DuckDB 实例（max_memory 默认 4096MB/连接，
                                          # spec §9.4）——连接数 × 内存必须显式收口，见 pg-duckdb/README §3
                                          # 实测语境：Compose v5.3.0 下解析进规范模型（2g → 2147483648）；
                                          # `mem_limit` 属**非 deploy 面**旧键，按 deploy-spec/swarm 模型
                                          # 解析的消费方可能不读 ⇒ 被静默忽略 = 本行唯一目的落空（spec §9.4）
                                          # 🔴 **2026-10-28 由 2g 抬到 4g（issue #1157）**：实测物化期间
                                          # postmaster 反复 `terminating … reinitializing`（与 dbt test 阶段
                                          # 严格同步、空闲期零重启，全天 46 次）。2g 与
                                          # `duckdb.memory_limit=1536MB`/连接 的组合在多连接下无余量。
                                          # 宿主 7G/峰值用 2G，抬到 4g 仍有余量；同时 materialize.sh
                                          # 已加 `--threads 1` 把连接数压到 1（双管齐下）。
    restart: unless-stopped

  # ── 业务调度器（#2504）：从应用单元的 notify-worker 拆出来，只跑调度 loop ──────────
  # 为什么在数据单元：应用单元每次发版都会**重建容器** ⇒ 正在跑的采集/物化子进程被连坐收掉
  # （2026-11-18 定量：3 天 40 次部署、13 次 dbt 作业被收成 timeout；table mart 因此陈旧，
  # 审计假红）。数据单元不随应用发版重建，调度放这里才不被打断。
  # 同一个镜像、同一个入口（scripts/notify-worker.mjs），靠 role env 决定跑哪个 loop：
  #   本服务     = SCHEDULER_ENABLED=1 + NOTIFY_DELIVERY_ENABLED=0（只调度）
  #   应用单元侧 = SCHEDULER_ENABLED=0                        （只投递，见 deploy/docker-compose.yml）
  # ⚠️ **两个单元各跑一个调度器，按域分工**（#2511 之后的口径，别按旧文「只留一个」操作）：
  #    本服务 `SCHEDULER_JOB_GROUPS=data`     ⇒ 只 claim `data.*`（dbt/采集/监控 tick）；
  #    应用单元 `SCHEDULER_JOB_GROUPS=platform` ⇒ 只 claim `platform` 域（notify.*/org.sync/metric.*）。
  #    两组的排班集合**不相交**，台账里 `job_run.runner_id` 会分别写成 `scheduler-data` /
  #    `scheduler-platform`（判「谁跑的」看这一列）。把应用单元的 `SCHEDULER_ENABLED` 置 0
  #    = 平台域作业**没有人跑**（2026-11-20 实测两边心跳都在，是正常态，不是双跑）。
  # ⚠️ openship **忽略 profiles**（issue #369）⇒ 所有用本 compose 的数据项目下次部署都会建本服务。
  #    不需要它的项目（或还没备好 env 的项目）必须在服务行置 `enabled: false`，否则它会因缺
  #    DATABASE_URL 启动即退出（fail-closed，但会一直重启）。
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: platform-core-scheduler:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      SCHEDULER_ENABLED: '1'
      NOTIFY_DELIVERY_ENABLED: '0'
      # 与镜像 HEALTHCHECK（`127.0.0.1:${PORT:-13000}/healthz`）对齐；容器内端口，不映射宿主。
      WORKER_HEALTH_PORT: '13000'
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-30000}
      SCHEDULER_MAX_CONCURRENCY: ${SCHEDULER_MAX_CONCURRENCY:-2}
      # 停机收尾预算（#2567）：SIGTERM 后不再 claim、等在跑的子进程收尾的最长时间。
      # 必须**小于**本服务的 stop_grace_period（660s），否则到点会被 SIGKILL、收尾日志都写不出来。
      WORKER_DRAIN_TIMEOUT_MS: ${WORKER_DRAIN_TIMEOUT_MS:-600000}
      # 派发模式开关（#2574）：留空 = 本地执行（今天的行为）；置 `http://executor:13100`
      # = 作业交给独立执行器，本容器（派发器）重建时在跑的作业不受影响。
      # **默认不开**：灰度开关要走一次真机验收再打开（见 deploy/deployment-units.md §5.7）。
      EXECUTOR_URL: ${EXECUTOR_URL:-}
      EXECUTOR_TOKEN_FILE: /run/executor-auth/token
      # 平台库在**应用单元**。注意：宿主端口是回环发布，容器里的 127.0.0.1 是自己的 netns、
      # host.docker.internal 也够不到回环发布口 ⇒ 只能走应用机的**私网 IP**（配 DATA_BIND_ADDR
      # + 安全组白名单）。真值写进数据项目 env(isSecret)，键 SCHEDULER_DATABASE_URL；
      # 缺了它就启动即退出（fail-closed，绝不静默「不跑调度」）。
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:-}
      # 物化目标 pg_duckdb：同 compose 网络走服务名（不是宿主视角的 127.0.0.1:15432）。
      DATA_WAREHOUSE_URL: postgres://${PGDUCK_USER:-platform}:${PGDUCK_PASSWORD:-platform}@pg_duckdb:5432/${PGDUCK_DB:-warehouse}
      # dbt 在**本容器内**执行（镜像自带 dbt 1.9.1）⇒ 不需要 docker sock、也不依赖 etl profile 的 dbt 服务。
      MATERIALIZE_MODE: container
      # 产物（manifest.json / run_results.json）写到**与应用单元共享的宿主目录**，
      # 而不是容器内的 /tmp：应用单元的 server 把同一目录只读挂到 /app/dbt-target，
      # `reconcile` / `toolbox health` 读的就是它。写 /tmp 的后果是「跑完就丢」——
      # 2026-11-19 实测：server 侧读到的是 11-16 的旧 manifest（容器化迁移后没人再更新那条路径）。
      # ⚠️ 宿主目录必须对 uid 1000 可写（镜像以 node 运行）：`chown -R 1000:1000 <dir>` 一次即可。
      MATERIALIZE_TARGET_DIR: /app/dbt-target
    volumes:
      # 物化产物落**命名卷**（不是宿主目录）：跨机迁移时卷能跟着项目走，宿主路径不能。
      # 同项目的 `artifacts` 服务把它**只读**挂成 HTTP 面，应用单元从那里增量拉取。
      - dbt-artifacts:/app/dbt-target
      - executor-auth:/run/executor-auth:ro
    # 运行镜像已含 tsx；不要用裸 node 跑 .ts import（与 deploy/docker-compose.yml 的 notify-worker 同）
    command: ['pnpm', 'exec', 'tsx', 'scripts/notify-worker.mjs']
    # 优雅停机（#2567）：docker 默认只给 10s 就 SIGKILL，而本容器在跑的 dbt 采集/审计是 20–90 分钟。
    # worker 收到 SIGTERM 后**不再 claim 新作业**、等在跑的子进程收尾（预算 WORKER_DRAIN_TIMEOUT_MS，
    # 缺省 600s），所以这里的宽限期要比那个预算**再宽一点**，让进程自己先退、别被 SIGKILL 打断收尾。
    # 语义提醒：发版因此可能多等最多 ~10 分钟；换来的是不再把一条 90 分钟的审计砍成 0s timeout。
    stop_grace_period: 660s
    depends_on:
      - pg_duckdb
    # 无 ports：只被本容器自己用（healthz 绑回环），宿主面为零。

  # ── 执行器（#2574 方案 A）：派发 / 执行拆分 ────────────────────────────────────
  # 为什么拆：调度器容器同时「派发」和「跑作业」，任何发版都会重建容器、把在跑的 dbt 作业带走
  # （2026-11-20 一天三次 `dur=0s`）。拆开后派发器随时可重启（容器里没有作业子进程），
  # 执行器只在「执行时读的东西」（dbt/scripts/镜像）变更时才重建，且可先排空再重建。
  # 台账语义不变：终态/重试/事件仍走 apps/server/src/scheduler/execute.ts 的同一份实现。
  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: platform-core-executor:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      EXECUTOR_PORT: '13100'
      EXECUTOR_MAX_CONCURRENCY: ${SCHEDULER_MAX_CONCURRENCY:-2}
      # 与 scheduler 同源：平台库在应用单元，走私网 IP（见 scheduler 服务的说明）。
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:-}
      DATA_WAREHOUSE_URL: postgres://${PGDUCK_USER:-platform}:${PGDUCK_PASSWORD:-platform}@pg_duckdb:5432/${PGDUCK_DB:-warehouse}
      MATERIALIZE_MODE: container
      MATERIALIZE_TARGET_DIR: /app/dbt-target
      WORKER_DRAIN_TIMEOUT_MS: ${WORKER_DRAIN_TIMEOUT_MS:-600000}
      # 服务间令牌：两容器共享卷里的文件，执行器首次启动自动生成（无人工密钥步骤）。
      EXECUTOR_TOKEN_FILE: /run/executor-auth/token
    volumes:
      - dbt-artifacts:/app/dbt-target
      - executor-auth:/run/executor-auth
    command: ['pnpm', 'exec', 'tsx', 'scripts/executor-server.mjs']
    depends_on:
      - pg_duckdb
    # 无 ports：只在本 compose 网络内被 scheduler 调用。

  # ── 只读产物服务（#2518）：数据单元的 runs 回执 / dbt 产物，以 HTTP 提供给应用单元 ──
  # 为什么需要：产物产生在数据单元，消费它们的模块在应用单元、按**文件**读。同机时靠宿主 bind
  # 偷看对方目录；**跨机那条路必断**（迁移只搬卷，不搬宿主路径）。
  # 为什么不直连 console：duckle console 是能跑任意管线的执行器，不该为读几个 JSON 把端口放内网。
  # 鉴权：`Authorization: Bearer $ARTIFACTS_TOKEN`（两个 project env 同值）；空值即全部 401。
  # 只读：三个 location 各自 alias 到白名单子目录，非 GET/HEAD 拒绝，其余路径 404。
  artifacts:
    build: { context: .., dockerfile: deploy/artifacts/Dockerfile }
    image: platform-core-artifacts:local
    environment:
      ARTIFACTS_TOKEN: ${ARTIFACTS_TOKEN:-}
    volumes:
      # console 工作区只挂到私有路径；nginx 用 alias 只暴露其下的 runs/ 子目录。
      - lemeng-console-3120-ws:/data/ws3120:ro
      - lemeng-console-64188-ws:/data/ws64188:ro
      - dbt-artifacts:/data/dbt:ro
    ports:
      # 跨机拆分时设 DATA_BIND_ADDR=本机私网 IP（B7 唯一例外，须配安全组白名单）。
      - '${DATA_BIND_ADDR:-127.0.0.1}:18090:8080'
    healthcheck:
      # 官方 nginx 镜像没有 wget/curl；用自带的 `nginx -t`？不——探活要打 /healthz。
      # 镜像基于 alpine，自带 busybox wget。
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Metabase：**已退役**（2026-11-19，随调度拆分同一波腾磁盘）────────────────────
  # 服务与卷声明都已删除（metabase / metabase-db / mbdata）。删的是**编排面**：
  # 旧容器由 openship 下次部署时拆掉，`mbdata` 卷**仍在磁盘上**（应用库不可重建，
  # 确认不再需要后再 `docker volume rm`）。要恢复 BI 面：按 git 历史把三个声明加回即可。
  # 报表面现役路径是平台自有报表（docs/superpowers/plans/2026-11-13-report-platform-roadmap.md）。

  # ── duckle headless runner（T5 提供 Dockerfile；一次性执行，不常驻）──
  duckle:
    build: { context: .., dockerfile: deploy/duckle/Dockerfile }
    image: platform-core-duckle:local
    profiles: ["etl"]        # 平时 up 不起；docker compose --profile etl run duckle <args> 按需执行
    environment:
      # --token 是硬要求（spec §1：绑非回环且无凭据时 15 分钟内可被 claim 成管理员）——
      # 不用 :? 强制插值（会让没配 token 的部署连三服务的 up 都起不来）；真值在 etl 执行时给，
      # runner 入口对空 token 拒跑（T5 的 ENTRYPOINT 说明）。
      DUCKLE_TOKEN: ${DUCKLE_TOKEN:-}
    volumes:
      - duckle-workspace:/workspace
      - ../duckle:/pipelines:ro      # 相对路径锚在 compose 文件所在目录（deploy/）⇒ 一层 .. 即仓根
    # 无 ports：headless runner 不需要网络面

  # ── dbt runner（物化/测试执行器；调度=openship jobs 打 docker run，拍板 #4，零常驻）──
  dbt:
    build: { context: .., dockerfile: deploy/dbt/Dockerfile }
    image: platform-core-dbt:local
    profiles: ["etl"]
    environment:
      DBT_HOST: pg_duckdb          # compose 网络内走服务名（不是宿主视角的 127.0.0.1:15432）
      DBT_USER: ${PGDUCK_USER:-platform}
      DBT_PASSWORD: ${PGDUCK_PASSWORD:-platform}
      DBT_DBNAME: ${PGDUCK_DB:-warehouse}
      # ZOS/S3 凭据键见 dbt/profiles.example.yml——真值只在 project env（openship isSecret）
    volumes:
      - ../dbt:/usr/app                              # ⚠️ **不带 `:ro`**：dbt 要写 target/logs（相对路径 ⇒ 解析到 /usr/app）；见 SOP 的挂载要求与 issue #202
    depends_on:
      - pg_duckdb
    # 无 ports

  # ── duckle console ×2：**每账套一个**，承担「何时跑」（ADR-0014）────────────────────
  # · 为什么按账套分：调度条目**带不了自己的 env**（实测：塞 env/args/params 会被静默丢弃），
  #   而 `LEMENG_TOKEN` **按账套绑定** ⇒ 共用一个 console 必然有一个拿到错 token，且会
  #   **静默采错数据**（不是报错）。见 `deploy/duckle/console/README.md`。
  # · 为什么绑回环：调度靠**进程内 tick**，不需要对外开端口 ⇒ serve 文档那条「绑非回环且无凭据时
  #   15 分钟内任何人可 claim 成管理员」的风险**从根上不存在**（entrypoint 的凭据闸仍在）。
  # · 为什么**不挂 profiles**：它要常驻 —— 这是对拍板 #4「零常驻」的**局部有意偏离**（ADR-0014 留档）。
  #   代价：它会出现在**每个**用本 compose 的项目的下次部署 ⇒ 不需要它的项目必须 patch
  #   `enabled: false`（实测语义：**不部署 + 拆旧容器**）。**别忘这一步**。
  # （旧 wrapper `/opt/lemeng-run.sh` 的挂载与本说明已随 #382 退役删除——勿照历史文档加回。）
  # ⚠️ 为什么 console **必须自带 `build:`**（2026-11-19 实测，openship 1.0）：
  #   1.0 的部署在切流前会「准备镜像」，手动部署对**可变 tag**（`:local`）一律强制刷新，
  #   即 `docker pull platform-core-duckle:local` ⇒ docker.io 上没有这个仓库 ⇒ `pull access denied`
  #   ⇒ 整个部署失败（实测 dep_MtntpXNFZpwtdQ2b）。`image:` 跟 `build:` 一起写，openship 才会
  #   **本地构建**这张图，而不是去拉它。构建经 dockerd 的 registry-mirrors 拉基础镜像（见
  #   deploy/openship-adopt.md 陷阱 7）。三个服务共用同一 Dockerfile ⇒ 后两个基本命中缓存。
  lemeng-console-3120:
    image: platform-core-duckle:local
    build: { context: .., dockerfile: deploy/duckle/Dockerfile }
    restart: unless-stopped
    environment:
      SYSTEM_BOOK: "3120"
      # 本账套声明的「已接入源」（逗号分隔）：**声明侧**，对账的另一侧是平台登记
      # `platform.tenant_source`。真值走 project env（openship），键名带账套后缀
      # ——宿主侧对账用 `pnpm exec tsx scripts/reconcile-tenant-sources.mjs` 读同名键。
      ADOPTED_SOURCES: ${ADOPTED_SOURCES_3120:-}
      DUCKLE_TOKEN: ${DUCKLE_TOKEN:-}          # 兼作 console 登录令牌（entrypoint 翻成引擎正式名）
      LEMENG_TOKEN: ${LEMENG_TOKEN:-}
      ZOS_ACCESS_KEY: ${ZOS_ACCESS_KEY:-}
      ZOS_SECRET_KEY: ${ZOS_SECRET_KEY:-}
      ZOS_BUCKET: ${ZOS_BUCKET:-}
      ZOS_ENDPOINT: ${ZOS_ENDPOINT:-}
      ZOS_REGION: ${ZOS_REGION:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - lemeng-console-3120-ws:/workspace
    ports:
      - "127.0.0.1:18080:18080"                # 只绑回环
    # --duckdb 必给：不给则每次触发都记 "DuckDB engine isn't installed yet."（实测）
    command: ["serve", "--host", "0.0.0.0", "--port", "18080",
              "--workspace", "/workspace", "--duckdb", "/usr/local/bin/duckdb"]

  lemeng-console-64188:
    image: platform-core-duckle:local
    build: { context: .., dockerfile: deploy/duckle/Dockerfile }   # 同上：1.0 不拉本机自建镜像
    restart: unless-stopped
    environment:
      SYSTEM_BOOK: "64188"
      # 同 3120：本账套的「已接入源」声明（真值走 project env 的 ADOPTED_SOURCES_64188）
      ADOPTED_SOURCES: ${ADOPTED_SOURCES_64188:-}
      DUCKLE_TOKEN: ${DUCKLE_TOKEN:-}
      LEMENG_TOKEN: ${LEMENG_TOKEN_64188:-}    # ← 这个账套自己的令牌（项目 env 里带后缀存）
      ZOS_ACCESS_KEY: ${ZOS_ACCESS_KEY:-}
      ZOS_SECRET_KEY: ${ZOS_SECRET_KEY:-}
      ZOS_BUCKET: ${ZOS_BUCKET:-}
      ZOS_ENDPOINT: ${ZOS_ENDPOINT:-}
      ZOS_REGION: ${ZOS_REGION:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - lemeng-console-64188-ws:/workspace
    ports:
      - "127.0.0.1:18081:18081"
    command: ["serve", "--host", "0.0.0.0", "--port", "18081",
              "--workspace", "/workspace", "--duckdb", "/usr/local/bin/duckdb"]

volumes:
  pgduckdata:        # 物化表/语义 schema（可从 parquet 重算，备份=省重建时间，spec §8）
  # mbdata（Metabase 应用库）随 metabase 退役一并撤出编排——卷还在磁盘上，需人工确认后删。
  duckle-workspace:  # 管线定义的真源在仓内 duckle/；workspace 是中间产物（可重建）
  # 派发器 ↔ 执行器 的服务间令牌（#2574）：执行器首次启动写入，派发器读。
  executor-auth:
  # dbt 物化产物（manifest / run_results）。scheduler 写、artifacts 只读挂载对外供。
  # 用卷而不是宿主目录：跨机迁移时卷随项目走。
  dbt-artifacts:
  # 两个账套各自的 console 工作区（放 schedules.json 与引擎状态）。
  # **必须按账套分开**：调度条目带不了 env ⇒ 一个 workspace 只有一套 env（见 console/README.md）。
  # dim 管线实测**无跨运行状态组件** ⇒ 分卷不会丢状态；将来若接有状态的管线，迁移要连状态一起搬。
  lemeng-console-3120-ws:
  lemeng-console-64188-ws:
