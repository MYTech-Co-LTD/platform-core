id: data
name: 数据
version: 0.1.0
platform: '>=0.1'
permissions:
  - { code: data:query,  name: 数据查询 }
  # 建**自己的**报表（#1330）：创建后 owner=创建者、默认私有（restricted）。
  # 与 data:manage 分开是刻意的——「能建自己的资产」≠「能管全租户指标/报表」；
  # 真正的资产写权限由 canEditAsset（owner ∪ data:manage）在 handler 判。
  - { code: data:create, name: 创建自己的报表 }
  - { code: data:manage, name: 数据指标管理 }
  # 列级授权（spec 2026-10-17 §4.2）：看得到成本价 / 毛利额一类敏感指标。
  # 由租户管理员发放（`POST /api/platform/admin/permissions/:code/users`，需 tenant:admin）。
  # ⚠️ 装载器按各租户 org 逐个 upsert ⇒ **声明了才发得出去**（admin 端点会校验码∈本清单，
  #    否则 404 NO_SUCH_CODE）。漏声明 = 指标声明了 required_scope: data:cost 也永远匹配不上
  #    ⇒ 该指标对所有人静默不可见。
  - { code: data:cost,   name: 成本与毛利数据 }
  # 值级脱敏的**默认档豁免码**（spec 2026-10-17 §4.1.1，裁决 A：专用码而非复用 data:cost）。
  # 语义：持有它 ⇒ 看原值；否则默认档（整值 nullify）生效。与 data:cost 分开是刻意的——
  # 列级可见（看得到成本指标）与值级精确（看得到精确值）是**两条独立的授权**，
  # 合成一个码会让「给了成本可见就顺带给了精确值」。
  # ⚠️ **打第一个 `sensitivity` 之前必须先声明它**：check-column-scope-monotonicity 会拦
  #    （否则默认档的豁免码在清单里不存在 ⇒ 谁都豁免不了 ⇒ 全租户静默拿 NULL）。
  # ⚠️ **这不是终态**：将来若按敏感级别细分（cost / pii / …各一码），本码拆成一组；
  #    别把「一码走天下」当成设计意图。
  - { code: data:precise, name: 精确值查看 }
  # 数据探索（spec 2026-10-21 §8）：清单/描述/健康类工具的声明面码。
  # ⚠️ Wave 1 端点门仍是 data:query（/mcp）——本码先收录进清单（可授予、可审计），
  #    端点级 read/query 分离留人工裁决（计划决策 D1：一端点一 scope 的正典约束）。
  - { code: data:read,   name: 数据探索 }
# ⚠️ api.internal 的 path 是**模块相对路径**（不带 /api/modules/<id> 前缀）——
# loader 的 applyDeclaredApiGate 会用 moduleApiBasePath(id) 加前缀后再做门卫比对。
# 声明集合必须与 createRouter 注册的集合逐条一致（装载期双向核对，任一方向差集 ⇒ 装载失败）。
# 改路由或改本清单都必须在同一提交里对齐两侧。T6 首批（指标 + 问数）；
# T7（个人 Key）已加；T8（MCP 端点）已加；T9（系统内问数 SSE）已加。
api:
  internal:
    # ── 问数面（data:query）──
    # ⚠️ 2026-11-12：**站内问数 UI 已退役**（console 问数页 + 移动问数 tab 均已删除；
    #   问数只经 MCP 给 openclaw 与三方 agent）。`POST /chat`（SSE agent loop）**保留但已无
    #   一等消费方**，仅为兼容/排障存在；下次改这一面时一并评估退役（改路由必须与本清单同提交）。
    - { method: GET,  path: /metrics, scope: data:query }
    - { method: POST, path: /query,   scope: data:query }
    # 明细下钻（spec 2026-10-21 §2.5：路由门必须与 /query 同清单声明——装载期双向核对）
    - { method: POST, path: /query/detail, scope: data:query }
    # 门店维读面（#1047 报表页筛选器）：只读 analystPool，与问数面同档 data:query
    - { method: GET,  path: /branches, scope: data:query }
    # 数据体系地图（W5 Task 4，issue #1455）：只读单文件 HTML（健康五数 / 指标 / 实体 /
    # 数据源 / 需求台账 + 五步回溯链 + W4 维度与不变量清单）。事实源 = 仓内声明 + 运行库；
    # 与问数面同档 data:query。页面零写操作、零外链。
    - { method: GET,  path: /system-map, scope: data:query }
    # 通道 A：系统内问数（SSE 流式；LLM 编排在平台后端）
    - { method: POST, path: /chat,    scope: data:query }
    # MCP 端点（通道 B 的 JSON-RPC 单入口；协议错误自兜，授权仍走同一核心）
    - { method: POST, path: /mcp,     scope: data:query }
    # toolbox HTTP 薄封装（Wave 2，spec §6/§9：registry 的通道无关面；通道 C 插件经它调
    # 分析师面工具。与 /mcp 同档 data:query——工具级 requiredScope 仍是声明面（registry D1），
    # 执法点在本端点门；dispatch/审计单点在 registry.callTool。
    - { method: POST, path: /toolbox, scope: data:query }
    # ── 写面（MCP；管理面：口径 + 报表 + 管线提案；#486 口径写面 / #496 报表工具面）──
    # 与 /mcp 分成两个端点，是为了让**门禁仍由声明施加**（本模块不写 requireScope）：
    # 把写工具塞进 /mcp 会让「写所需的能力」不再出现在清单里，清单作为「声明即授权」的
    # 单一事实源就被削弱了。设计见 docs/superpowers/specs/2026-10-07-mcp-write-face-design.md
    # 与 docs/superpowers/specs/2026-10-07-report-agent-toolface-design.md。
    - { method: POST, path: /mcp-manage, scope: data:manage }
    # ── 指标管理面（data:manage）──
    # T8：定义面已从「自由 SQL」收成**结构化声明**（L2Declaration，禁任意 SQL 不变，全局约束 12）：
    #   · POST/PUT 只收 `{ id, baseMetric, op:{kind:'refine'}, alias?, visibility?, filters?, target? }`；
    #     body 里出现 selectSql/subjectColumn/groupBy/params/source ⇒ **400**（.strict()，不是忽略）。
    #   · `source='l1'` 的行动（org='platform'，由 scripts/sync-data-semantics.mjs 物化）经 API **只读**：
    #     改它要改仓内 dbt 声明再物化（口径变更走代码评审）。DELETE 打到 L1 id ⇒ 409 READONLY_L1。
    #   · 页门仍是 data:manage（本模块不自己写 requireScope，门卫由宿主按本清单施加）。
    #     ⚠️ 平台超管（org='platform' 的 l2 行 / 全租户可见）**当前无门可落**：仓内没有平台超管
    #     identity 信号（唯一平台内置码 tenant:admin 是**租户级**的，loader.ts:137）⇒ 本轮不开口，
    #     见 README「L2 的已知边界」。**这就是拍板 #5 的平台超管那一半尚未落地的唯一原因。**
    - { method: GET,    path: /metrics/all, scope: data:manage }
    # 口径变更史（#489）：谁、何时、从什么到什么。门与 /metrics/all 同档（能看到「谁改的」＝管理信息）
    - { method: GET,    path: /metrics/:id/audit, scope: data:manage }
    - { method: POST,   path: /metrics,     scope: data:manage }
    # 租户语义自治（W8，issue #1716）：新建全额声明（basis='declared'，只收声明不收 SQL）
    - { method: POST,   path: /metrics/declarations, scope: data:manage }
    # 覆盖平台口径（W8 P2）：草稿 → 确认 → 生效（D6）。name 必须等于被覆盖的 L1 id
    - { method: GET,    path: /metrics/overrides,            scope: data:manage }
    - { method: POST,   path: /metrics/:id/override,         scope: data:manage }
    - { method: POST,   path: /metrics/:id/override/confirm, scope: data:manage }
    - { method: DELETE, path: /metrics/:id/override,         scope: data:manage }
    - { method: PUT,    path: /metrics/:id, scope: data:manage }
    - { method: DELETE, path: /metrics/:id, scope: data:manage }
    # 指标治理（spec 2026-11-01 §10.4）：L2 草稿→确认→生效。申报 data:query——
    # creator 未必持管理码，真判据在 handler（source=l2 且 created_by=requester）
    - { method: PUT,    path: /metrics/:id/draft,         scope: data:query }
    - { method: GET,    path: /metrics/:id/draft,         scope: data:query }
    - { method: POST,   path: /metrics/:id/confirm-draft, scope: data:query }
    # 可信度分级升降（spec §10.4 D7）：管理员动作，门与 /metrics/all 同档（data:manage）；
    # L1 只读由 certifyMetric 判（403，读侧恒 certified 从 source 推导，写列会被 sync 冲掉）
    - { method: PUT,    path: /metrics/:id/certified,     scope: data:manage }
    # 使用统计读面（spec 2026-11-01 §10.4.3 P1）：query_audit 按 metricId 聚合 + 下线候选清单。
    # 门与 /metrics/audit 同档（data:manage）——「谁在用」是管理信息；下线候选只含本租户 L2
    - { method: GET,    path: /metrics/usage,             scope: data:manage }
    # 元数据写路径（§10.4.3 P1）：业务描述/单位/口径说明。申报 data:query（写闸 manage ∪ creator
    # 是并集，单一 scope 表达不了——取低档进真判据 updateMetricMeta，与草稿端点的取舍同源；
    # 持 data:manage 的 PAT 需同时带 data:query）。L1 在平台桶 ⇒ 租户天然 404（跨租户 fail-closed）
    - { method: PUT,    path: /metrics/:id/meta,          scope: data:query }
    # ── 私有测度（W2 三档闭环；spec 2026-11-04 §4）──
    # 新建：申报 data:query（与 D6 草稿端点同档；真判据在域层 writePrivateMeasure——
    #   一次新建的 creator 就是调用者自己；修改走 D6；归档复活需 creator ∪ data:manage）。
    #   落库 = 生效列 + basis='column_agg' + certified='draft'，新建即时可用。
    - { method: POST,   path: /metrics/private,           scope: data:query }
    # 归档行读面（Task 1 评审遗留：archivedAt 消费面不可达）：管理动作的可见面 ⇒ data:manage。
    # 只读；复活走 POST /metrics/private（creator ∪ data:manage 闸在域层）。
    - { method: GET,    path: /metrics/private/archived,  scope: data:manage }
    # 候选池（W2 Task 5；spec 2026-11-04 §3 双来源分流）：批量 profile 产出**只进候选池**，
    # 一键采用才上台——防「26 关系 × 几十列」自动建出数百条垃圾口径。
    #   · generate：读仓库库最新画像（只读）+ 写平台库候选表（幂等）；无 profile 数据 ⇒ 500（不是 0 条假绿）
    #   · adopt：候选 → 私有测度。候选里的 expr 是**输入**，三闸 + 编译一处不少（见域层）。
    # 两条都是管理动作（没有「creator 是谁」的歧义）⇒ data:manage。
    - { method: POST,   path: /metrics/candidates/generate,       scope: data:manage }
    - { method: POST,   path: /metrics/candidates/:id/adopt,      scope: data:manage }
    # Wave 1.4（#1969）：候选池**读面**与**拒绝面**。读面同档 data:manage——候选 rationale 会
    # 带画像统计（列基数/空值率），与 /metrics/verified 的取舍一致（管理动作，不是内容读）。
    - { method: GET,    path: /metrics/candidates,                scope: data:manage }
    - { method: POST,   path: /metrics/candidates/:id/reject,     scope: data:manage }
    # W3（#1401）：候选 → L1 声明**草案**。零写盘——piece 只进回包，写动作仍走 MCP 工具面
    # apply_pipeline_proposal（人复核后开 draft PR）。管理动作（与 adopt 同档）⇒ data:manage。
    - { method: POST,   path: /metrics/candidates/:id/propose-l1, scope: data:manage }
    # ── 已验证问答（W1 可信度地基；计划 2026-11-04-amd-w1-verified-questions Task 2）──
    # 三条都是 data:manage：基线由关闭掩码的重放产生，读面会把掩码列的精确聚合值透给
    # 低档用户（终审 Important 4）；人工确认/拒绝本来就是管理动作。
    # 默认只列 verified；候选/拒绝需显式 ?status=。:id 是 bigserial，跨租户一律 404。
    # ⚠️ 三条声明必须与 registerVerifiedQuestions 注册的集合逐条一致
    #    （装载期双向核对：漏声明 ⇒ 请求恒 403；多声明 ⇒ 装载失败）。
    - { method: GET,    path: /metrics/verified,            scope: data:manage }
    - { method: POST,   path: /metrics/verified/:id/verify, scope: data:manage }
    - { method: POST,   path: /metrics/verified/:id/reject, scope: data:manage }
    # ── agent 接入面（**已落地**；#486）──────────────────────────────────────────────
    # 两条通道，对 agent 与人**同形**（都是 HTTP/MCP + 同一个 scope，管理面不自建第二份判定）：
    #   · HTTP：上面那四条 /metrics 写/读端点（PAT 通道即可调）；
    #   · MCP：读面 `/mcp`（问数，data:query）与**写面 `/mcp-manage`**（管理面：口径 + 报表 + 管线提案，data:manage）。
    # ⚠️ 仍然成立的那条告诫：**不要**新开绕过本清单的入口——绕开清单就绕开了宿主门卫
    #    （MCP 端点评审 §11.3.1 的教训）。写面之所以单独一个端点而不是把写工具塞进 `/mcp`，
    #    正是为了「写所需的能力」继续出现在清单里。设计见
    #    docs/superpowers/specs/2026-10-07-mcp-write-face-design.md。
    # ── 个人 Key 管理：**已上移宿主**（issue #894，正典 §1.5）──
    # 原 /keys 三条（GET/POST/DELETE，scope data:query）连同 routes/keys.ts 一并删除：
    # token 是平台级身份能力，现由 /api/platform/keys 承载（个人档免 scope + 管理档 tenant:admin）。
    # 删声明必须与本模块的注册集合同提交（装载期双向核对，差一侧即装载失败）。
    # ── 报表（Metabase 报表 facade；#150 T7）──
    # 页门分档（spec §4「权限双门必须分开表态」）：**创建**声明 data:query（门卫只挡匿名/无关者），
    # 真判据在 handler：`data:create ∪ data:manage`（普通用户靠 data:create 建自己的；管理员照旧）；
    # 管理清单/对账 = data:manage（跨资产能力，必须经平台）；观看面（清单 + 拿嵌入 URL）= data:query。
    # ⚠️ **资产级写动作**（改规格/发布/回收/回滚/读草稿与历史/改部门门/删除/编辑入口）= data:query，
    #    真判据在 handler 的 canEditAsset（owner ∪ data:manage）——#1325 用户裁决：
    #    **owner 对自己报表有最高权限**（转账后的 owner 未必持管理码）。
    # **数据门不在这里**：看哪个租户的数据由嵌入时锁定的 tenant 参数控（值 = 调用者 org，
    # 入参不可覆盖）——门卫管不了那一半，别以为声明了 scope 就万事大吉。
    - { method: POST,   path: /reports,               scope: data:query }
    - { method: GET,    path: /reports,               scope: data:query }
    - { method: GET,    path: /reports/:id/embed-url, scope: data:query }
    # 编辑页入口（spec §3⑦）：把身份经 120s 一次性票据渡给专用反代 ⇒ **资产写动作**：
    # data:query + handler 的 canEditAsset（owner ∪ data:manage，同 ACL 端点口径，见上）。
    - { method: GET,    path: /reports/:id/edit-url,  scope: data:query }
    - { method: DELETE, path: /reports/:id,           scope: data:query }
    - { method: POST,   path: /reports/reconcile,     scope: data:manage }
    # 管理清单（跨资产视图）：管理面 data:manage，**不做 visibleTo 行裁剪**——页门未放行
    # 的行对管理员必须可见可改（观看面 GET /reports 才裁）。
    # 「发布」= requiredScope 置 null，没有独立的 published 列（见 report-store 头注）。
    # `PUT /reports/:id`（metabase 行的页门）是**单资产写** ⇒ data:query + canEditAsset。
    - { method: GET,    path: /reports/manage,        scope: data:manage }
    - { method: PUT,    path: /reports/:id,           scope: data:query }
    # ── 部门门（spec 2026-10-30-org-as-platform-primitive §3.4；#1173）──
    # 改门 = 授权变更，但属**单资产写** ⇒ data:query + handler 的 canEditAsset（#1325）。
    # 选择器数据源仍是管理面：观看者不需要看到「有哪些部门可以当门」，那是配置信息不是内容。
    # 判定（行级部门门）不在门卫这一层，在 handler 的 visibleTo（清单表达不了「行级」）。
    # 资产级共享（spec 2026-11-01 §4）：**data:query** 是有意的——owner 未必持管理码，
    # 真判据在 handler 的 canEditAsset（owner ∪ data:manage），门卫只挡匿名与无关者。
    # （模块只能声明自己的码；owner 侧的 `data:query` 是本模块已声明的码，直接复用。）
    - { method: GET,    path: /reports/:id/acl,       scope: data:query }
    - { method: PUT,    path: /reports/:id/acl,       scope: data:query }
    - { method: PUT,    path: /reports/:id/owner,     scope: data:query }
    - { method: PUT,    path: /reports/:id/dept-gate, scope: data:query }
    - { method: GET,    path: /reports/dept-options,  scope: data:manage }
    # ── 自绘规格读写（#391 计划 6 Task 3）：读 = 观看面（行级页门照 embed-url 的 visibleTo
    #    裁剪，Task 4 渲染器从这里取规格）；写 = **单资产写**（data:query + canEditAsset，#1325）。
    #    注册序保持字面量在前、param 在后（#145 口径）。──
    - { method: GET,    path: /reports/:id/spec,      scope: data:query }
    - { method: PUT,    path: /reports/:id/spec,      scope: data:query }
    # ── 定义版本（月报重做 Task 10；设计 2026-10-26-report-versioning-and-standalone §4/§5）──
    # 发布/下线/回滚/历史/草稿 = **单资产写/读**（data:query + canEditAsset，#1325；
    # agent 无这些工具，只有人走 console）。
    # 已发布快照 = 观看面（data:query）——独立链接 `/r/:id` 的用户拿到的就是它；**页门另判**：
    # 行上 `required_scope` 不通过 ⇒ 404（本模块 handler 的 visibleTo，清单表达不了「行级」）。
    # ⚠️ 平台行的 `PUT /reports/:id` 已改为 409 USE_PUBLISH_ENDPOINT（发布必须走 /publish，
    #    否则会出现「发布却没有版本行」）；metabase 行保持 PUT。
    - { method: POST,   path: /reports/:id/publish,                   scope: data:query }
    - { method: POST,   path: /reports/:id/unpublish,                 scope: data:query }
    - { method: POST,   path: /reports/:id/versions/:version/rollback, scope: data:query }
    - { method: GET,    path: /reports/:id/versions,                  scope: data:query }
    - { method: GET,    path: /reports/:id/versions/:version,         scope: data:query }
    - { method: GET,    path: /reports/:id/published-spec,            scope: data:query }
    - { method: GET,    path: /reports/:id/draft,                     scope: data:query }
    # ── AI 文本（ai_text；设计 2026-10-26 §4，计划 Task 7）：观看面 = data:query。
    #    更细的页门在 handler 里按**快照自己的** required_scope 另判（同 published-spec），
    #    草稿预览（preview:'draft'）另要 canEditAsset（owner ∪ data:manage）；跨租户 / 无门一律 404。──
    - { method: POST,   path: /reports/:id/narrative,                 scope: data:query }
    - { method: POST,   path: /reports/:id/narrative/stream,          scope: data:query }
    # ── 数据范围 scope 管理面（spec 2026-11-10 §5.5；issue #1901）──
    # 全部 data:manage（授权变更是管理动作；运行期执法在 authorizeCore，这里只有配置面）。
    # 判定链在 domain/scope-admin.ts：selector 闭集 + 受控维表存在性校验（fail-closed，
    # 不建「永远没人能满足」的门）+ 写后回读 + data.scope_audit。effective 是预览（dry-run），
    # 给运营排查「为什么他看不见东部一区」——?user= 必填，?roles=a,b 可选。
    # ⚠️ 六条声明必须与 registerScopes（routes/scopes.ts）注册的集合逐条一致
    #    （装载期双向核对：漏声明 ⇒ 恒 403；多声明 ⇒ 装载失败）。
    - { method: GET,    path: /scopes,                    scope: data:manage }
    - { method: GET,    path: /scopes/effective,          scope: data:manage }
    # 变更历史（只读）：CRUD/分配每次写都落 data.scope_audit，这里给管理面回溯
    - { method: GET,    path: /scopes/audit,              scope: data:manage }
    # 可分配部门（assignment 的 dept 主体候选；2026-11-12 部门主体上线）
    - { method: GET,    path: /scopes/depts,              scope: data:manage }
    - { method: POST,   path: /scopes,                    scope: data:manage }
    - { method: PUT,    path: /scopes/:id,                scope: data:manage }
    - { method: DELETE, path: /scopes/:id,                scope: data:manage }
    - { method: PUT,    path: /scopes/:id/assignments,    scope: data:manage }
# 通知事件（模块协议 12：先声明再发；spec 2026-11-01 §10.4 D6「生效必发通知」）。
# 收件人 = 持 data:query 的人（scope_holders；指标查看面唯一门就是这个码，声明侧没有
# 逐指标 viewer 清单，这是 P0 的诚实近似——资产级 ACL 到指标是后续议题）。defaults 幂等
# 派生默认规则（模板/派生规则的 seed 在 modules/notify 侧，开通/升级时 seed-builtin 落库）。
notifications:
  events:
    - key: data.metric.definition.changed
      title: 报表中心定义变更
      description: L2 指标草稿确认生效后，通知本租户的看数人（spec 2026-11-01 §10.4 D6）
      scope: { key: metricId, label: 指标 }
      payload:
        metricId: { type: string, required: true, label: 指标 }
        title:    { type: string, required: true, label: 指标名 }
        changedBy: { type: user, required: true, label: 操作人 }
        link:     { type: url, required: true, label: 详情链接 }
      recipients:
        viewers: { kind: scope_holders, scope: data:query, label: 指标看数人 }
      defaults:
        recipient: viewers
        template: data_metric_definition_changed
        channels: [inapp_default]

# 业务面承载端（#1266 机检）：console ⇒ pc；移动指标页（spec 2026-11-01 §10.2，userApp）⇒ mobile。
surfaces: [pc, mobile]
frontend:
  # 左侧多级菜单（#1953 二期）：父条目 = 分组标题（不可点），子页 = 菜单叶子。
  # 子页共用同一个 entry 组件——它按 pathname 末段选页（见 console/index.tsx 的三条实测结论）。
  console:
    - { path: /console/data, title: 数据分析, icon: BarChartOutlined, scope: data:query, entry: ./console/index.tsx }
    # ⚠️ 站内问数已于 2026-11-12 退役（问数只经 MCP）⇒ 不再有 /console/data/query 菜单项
    - { path: /console/data/metrics, title: 指标, description: 指标是「一个数怎么算」的唯一定义；口径改这里，报表和问数一起生效。, scope: data:query, entry: ./console/index.tsx }
    - { path: /console/data/reports, title: 报表, description: 把指标拼成业务看板；每张报表可单独设部门可见范围。, scope: data:query, entry: ./console/index.tsx }
    # 数据范围管理面（#1901）：入口按 data:manage 过滤；API 门卫才是真闸
    - { path: /console/data/scopes, title: 数据范围, description: 决定谁能看哪些品牌/门店/品类：先建范围，再分配到部门（主）、角色或人（例外）。, scope: data:manage, entry: ./console/index.tsx }
    # 候选池（Wave 2.3 / 2026-11-12 补菜单项）：页面标签用业务说法「可能的指标」
    - { path: /console/data/candidates, title: 可能的指标, description: 从源数据自动推导出的候选指标；采用后才会变成正式指标。, scope: data:manage, entry: ./console/index.tsx }
  # 移动端「报表中心」（#1369；2026-11-12 起**没有问数 tab**）：报表 / 管理 / 指标；/m 入口卡片按 scope=data:query 过滤——
  # 「谁能看到这个版块」的唯一事实源还是平台 scopes（不造第二套）。dist 由 @data/mobile 构建产
  userApp:
    mount: /app/data
    dist: ./mobile/dist
    scope: data:query
    title: 报表中心
migrations: { dir: ./migrations }
# 源投影（计划 5，spec §3⑧）：本模块需要「本租户已接入的源」——宿主按请求把
# `platform.tenant_source` 里 enabled=true 的集合 set 到 context 的 TENANT_SOURCES 键。
# ⚠️ 键名是 `tenantSources`（**不是** `sources`）：`sources` 已被「存储路径」占用（上面的 dbt 声明），
#     两个维度不能共用一个词（Constraint 1）。声明 true 之后本模块的每个 API 请求多一次查表
#     （宿主侧刻意不做缓存，见 loader.ts 的注记）。
tenantSources: true
# 跨模块只读数据依赖（docs/module-protocol.md「跨模块只读数据依赖」判据 1）：
# 报表的**部门门**（spec 2026-10-30-org-as-platform-primitive-design §3.4）要在判定侧把
# 「用户所在部门 + 全部祖先」算出来，数据源是平台原语的只读稳定视图（不是物理表——
# 协议要求声明面是视图）。`apps/server/src/migrations/013_org_views.sql` 提供这两个视图。
# 只读：本模块不写组织架构（写侧由宿主 admin 的 org-sync 负责）。
dataDependencies:
  - platform.v_org_node
  - platform.v_org_membership
