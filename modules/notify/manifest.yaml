# notify 模块（通知基础设施；正典 docs/superpowers/specs/2026-10-27-notification-infrastructure-design.md）
# 三同纪律：id = DB schema 名 = API 前缀。
# 绑定层：什么事件 × 作用域 × 通知谁 × 用哪个模板 × 什么通道；投递在 worker，模板/通道在 notify schema。
id: notify
name: 通知基础设施
version: 0.2.0
platform: '>=0.1'
permissions:
  - { code: notify:view,    name: 通知查看 }
  - { code: notify:manage,  name: 通知规则管理 }
  - { code: notify:publish, name: 通知文案发布 }
  - { code: notify:channel, name: 通知通道配置 }
  - { code: notify:emit,    name: 事件触发 }
# ⚠️ api.internal 声明集合必须与 createRouter 注册集合逐条一致（装载期双向核对）。
api:
  internal:
    - { method: GET,    path: /rules,             scope: notify:view }
    # 可送达性预检（只读，D3）。/rules/deliverability 是静态路径，Hono 静态优先于 param，
    # 与 /rules/:id/resolve 的注册顺序无关（2026-10-28 实测：param 先注册也照样命中静态）。
    - { method: GET,    path: /rules/deliverability,   scope: notify:view }
    - { method: GET,    path: /rules/:id/resolve,      scope: notify:view }
    - { method: POST,   path: /rules/:id/resolve,      scope: notify:view }
    # 部门选择器（组织架构 Phase C；#1174）：规则里「按部门发」的候选项。数据由宿主注入
    # （`ChannelAddressResolver.listOrgNodes`），模块自身不读 platform.org_* —— B1。
    - { method: GET,    path: /org-depts,         scope: notify:manage }
    - { method: POST,   path: /rules,             scope: notify:manage }
    - { method: PUT,    path: /rules/:id/enabled, scope: notify:manage }
    - { method: DELETE, path: /rules/:id,         scope: notify:manage }
    - { method: GET,    path: /deliveries,        scope: notify:view }
    # 外部生产者（case-engine 等）：PAT + notify:emit；org 只来自 identity
    - { method: POST,   path: /emit,              scope: notify:emit }
    - { method: GET,    path: /inbox,             scope: notify:view }
    - { method: POST,   path: /inbox/:id/read,    scope: notify:view }
    - { method: POST,   path: /inbox/read-all,    scope: notify:view }
    # 事件目录（只读；来自宿主注入的 reader）
    - { method: GET,    path: /events,                  scope: notify:view }
    - { method: GET,    path: /events/:key,             scope: notify:view }
    # 模板：草稿/预览/发布
    - { method: GET,    path: /templates,               scope: notify:view }
    - { method: GET,    path: /templates/:key,          scope: notify:view }
    - { method: POST,   path: /templates/:key/revisions,scope: notify:manage }
    - { method: POST,   path: /templates/:key/preview,  scope: notify:manage }
    - { method: POST,   path: /templates/:key/publish,  scope: notify:publish }
    # 通道：列表/配置/健康
    - { method: GET,    path: /channels,                scope: notify:view }
    - { method: PATCH,  path: /channels/:id,            scope: notify:channel }
    - { method: POST,   path: /channels/:id/health,     scope: notify:manage }
    # 测试发送（只发给自己）/ 手动重试
    - { method: POST,   path: /test-send,               scope: notify:manage }
    - { method: POST,   path: /deliveries/retry,        scope: notify:manage }
    # 管理面 MCP（agent）：工具清单见 mcp-tools.ts；无 publish/channel 工具
    - { method: POST,   path: /mcp-manage,              scope: notify:manage }
# 通知事件声明（spec 2026-10-31-integration-health-design.md §2.4）：
# **集成健康 STALE** —— 由 notify-worker 从 `platform.integration` 的装填位消费后入队
# （模块不读 platform schema，B1：装填位由宿主探针写、脚本侧转成事件）。
# 收件人 = 持 tenant:admin 的人；scope 用集成 id（同一集成反复转红时靠它区分作用域）。
notifications:
  events:
    - key: notify.integration.stale
      title: 集成活性超期
      description: 某个出站集成超过允许静默时长没有活性证据（回调没来 / 凭据换不到 / 通道无投递）
      scope: { key: integrationId, label: 集成 }
      payload:
        integrationId: { type: string, required: true, label: 集成标识 }
        integrationKind: { type: string, required: true, label: 类型 }
        reason: { type: string, required: true, label: 判定依据 }
        slaSeconds: { type: number, required: true, label: 允许静默(秒) }
      recipients:
        admins: { kind: scope_holders, scope: tenant:admin, label: 租户管理员 }
      defaults:
        recipient: admins
        template: notify_integration_stale
        channels: [inapp_default]

frontend:
  console:
    - { path: /console/notify, title: 通知, icon: BellOutlined, scope: notify:view, entry: ./console/index.tsx }
migrations: { dir: ./migrations }
