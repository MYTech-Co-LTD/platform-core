# forms 模块（架构正典 docs/architecture.md §2.4「采集底座：受管数据集（表单+字典）」）。
# 三同纪律：id = DB schema 名 = API 前缀——改 id = 三处同改，选错比放错难改。
# M1.2（issue #710）：受管数据集内核——生命周期 + 字典双档（P4）+ 绑定强度两档（P7）。
# scope 矩阵即 P4 分档：forms:global-manage 标记 platformOnly——装载器仍供给到各租户 org，
# 但宿主的租户管理员授权宇宙会过滤掉它（平台运营在 Casdoor 后台授予）。
id: forms
name: 表单模块
version: 0.2.0
platform: '>=0.1'
permissions:
  - { code: forms:view,             name: 表单查看与解析 }
  - { code: forms:fill,             name: 表单填报 }
  - { code: forms:manage,           name: 表单与租户字典管理 }
  - { code: forms:publish,          name: 表单发布（人 gate） }
  - { code: forms:global-manage,    name: 平台全局字典管理, platformOnly: true }
  # ── 审批（OA P1 / issue #2363）：三档人 gate + 服务账号回调 ──
  - { code: forms:approval:view,    name: 审批模板查看与解析 }
  - { code: forms:approval:manage,  name: 审批模板起草与编辑（AI 工具面到此为止） }
  - { code: forms:approval:publish, name: 审批模板发布（人 gate） }
  - { code: forms:case:callback,    name: 引擎回调（服务账号专用） }
# ⚠️ api.internal 的 path 是模块相对路径；声明集合必须与 createRouter 注册集合逐条一致
#（装载期双向核对，任一方向差集 ⇒ 装载失败）。改路由或改本清单必须同一提交对齐。
api:
  internal:
    # ── 表单定义（生命周期：draft→publish 人 gate→retired）──
    - { method: GET,    path: /defs,                                scope: forms:view }
    - { method: GET,    path: /defs/:assetId,                       scope: forms:view }
    - { method: POST,   path: /defs,                                scope: forms:manage }
    # AI 起草（#724）：自然语言 → 契约草案 → 落 draft（永不自动发布）。scope 与起草同档
    - { method: POST,   path: /generate,                            scope: forms:manage }
    # 读面 MCP 端点（2026-11-16 能力网关）：只暴露 list_forms（摘要，**不回 draft body**）
    - { method: POST,   path: /mcp,                                 scope: forms:view }
    # 管理面 MCP 端点（#724）：工具 list_forms / generate_form_draft；**不含任何发布类工具**
    - { method: POST,   path: /mcp-manage,                          scope: forms:manage }
    - { method: PUT,    path: /defs/:assetId/versions/:v,           scope: forms:manage }
    - { method: DELETE, path: /defs/:assetId/versions/:v,           scope: forms:manage }
    - { method: POST,   path: /defs/:assetId/versions/:v/publish,   scope: forms:publish }
    - { method: POST,   path: /defs/:assetId/rollback,              scope: forms:publish }
    - { method: POST,   path: /defs/:assetId/versions/:v/retire,    scope: forms:publish }
    # ── 审批模板（OA P1）：同一生命周期，kind='approval_def'；发布 = 人 gate ──
    - { method: GET,    path: /approval-defs,                              scope: forms:approval:view }
    - { method: GET,    path: /approval-defs/:assetId,                     scope: forms:approval:view }
    - { method: POST,   path: /approval-defs,                              scope: forms:approval:manage }
    - { method: PUT,    path: /approval-defs/:assetId/versions/:v,         scope: forms:approval:manage }
    - { method: DELETE, path: /approval-defs/:assetId/versions/:v,         scope: forms:approval:manage }
    - { method: POST,   path: /approval-defs/:assetId/dry-run,             scope: forms:approval:manage }
    - { method: POST,   path: /approval-defs/:assetId/versions/:v/publish, scope: forms:approval:publish }
    # ── 标准审批绑定（OA P2 / issue #2385）：provider=wecom_native 的绑定资产面 ──
    # 全端点限平台管理员（forms:global-manage 是 platformOnly ⇒ 租户管理员授权宇宙里没有它）：
    # 绑定发布是平台运营的 gate，普通 forms:approval:publish 不能发布绑定。
    - { method: GET,    path: /approval-bindings,                          scope: forms:global-manage }
    - { method: GET,    path: /approval-bindings/:assetId,                 scope: forms:global-manage }
    - { method: POST,   path: /approval-bindings,                          scope: forms:global-manage }
    - { method: PUT,    path: /approval-bindings/:assetId/versions/:v,     scope: forms:global-manage }
    - { method: DELETE, path: /approval-bindings/:assetId/versions/:v,     scope: forms:global-manage }
    - { method: POST,   path: /approval-bindings/:assetId/versions/:v/publish, scope: forms:global-manage }
    # ── 标准审批镜像（OA P2 Task 7 / issue #2385）：只读列表 + 数据面导出 ──
    # 镜像由企微回调/小时级对账写入；端点只读。scope 宽档 forms:view（org 由身份钉死，
    # 与 /export/submissions 同款）；agent 选模板走 /mcp 的 search_standard_approvals。
    - { method: GET,    path: /standard-approvals,                         scope: forms:view }
    - { method: GET,    path: /standard-approvals/export,                  scope: forms:view }
    # ── 提交（org 钉死 + 按提交钉住版本契约校验）──
    - { method: POST,   path: /defs/:assetId/submissions,           scope: forms:fill }
    - { method: GET,    path: /defs/:assetId/submissions,           scope: forms:view }
    - { method: GET,    path: /submissions/:id,                     scope: forms:view }
    # 撤回：scope 宽档（forms:fill），数据授权收窄在 handler（仅提交人 + 仅 pending）
    - { method: POST,   path: /submissions/:id/withdraw,            scope: forms:fill }
    # ── 收集轮次（件③ / issue #2707）：名单轮/值集轮的建轮、开轮、关轮与进度 ──
    - { method: GET,  path: /rounds,           scope: forms:view }
    - { method: POST, path: /rounds,           scope: forms:manage }
    - { method: GET,  path: /rounds/:id,       scope: forms:view }
    - { method: POST, path: /rounds/:id/open,  scope: forms:manage }
    - { method: POST, path: /rounds/:id/close, scope: forms:manage }
    # ── 应用内审批（OA P1）：scope 宽档 + **按计划快照授权**（handler 内判定当前节点审批人）──
    - { method: GET,    path: /approvals/mine,                      scope: forms:view }
    - { method: GET,    path: /approvals/:caseId,                   scope: forms:view }
    - { method: POST,   path: /approvals/:caseId/decision,          scope: forms:fill }
    # ── 引擎回调（spec §10.6）：服务账号专用 ──
    - { method: POST,   path: /approval-callback,                   scope: forms:case:callback }
    # ── 导出面（出湖管线的「源」，M1.4 / #729）──
    - { method: GET,    path: /export/submissions,                  scope: forms:view }
    # ── 字典（租户私有：forms:manage；读与解析 forms:view）──
    - { method: GET,    path: /dicts,                               scope: forms:view }
    - { method: GET,    path: /dicts/:dictId/options,               scope: forms:view }
    - { method: GET,    path: /dicts/:dictId/resolve,               scope: forms:view }
    - { method: POST,   path: /dicts,                               scope: forms:manage }
    - { method: PUT,    path: /dicts/:dictId/keys/:key,             scope: forms:manage }
    # ── 全局字典（P4：编辑权收平台运营——forms:global-manage platformOnly，租户管理员授不了）──
    - { method: GET,    path: /global-dicts,                        scope: forms:view }
    - { method: GET,    path: /global-dicts/:dictId/options,        scope: forms:view }
    - { method: GET,    path: /global-dicts/:dictId/resolve,        scope: forms:view }
    - { method: POST,   path: /global-dicts,                        scope: forms:global-manage }
    - { method: PUT,    path: /global-dicts/:dictId/keys/:key,      scope: forms:global-manage }
# agent MCP face 声明（2026-11-16 能力网关 spec §5.2）：
# path/method/scope 必须与上方 api.internal 逐条一致（loader 与 check-manifests 双向核对）。
# 发布/回滚/退役（forms:publish）**不在任何 MCP face**——那是人在控制台的唯一 gate。
mcpFaces:
  - { face: read,   group: forms, precedence: 1, path: /mcp,        method: POST, scope: forms:view,   audiences: [mcp] }
  - { face: manage, group: forms, precedence: 2, path: /mcp-manage, method: POST, scope: forms:manage, audiences: [mcp, wecom] }
frontend:
  console:
    # 一个条目 + 页内三页签（表单/填报/提交记录，照 aftersales 姿势）；scope=forms:view
    - { path: /console/forms, title: 表单, icon: FileTextOutlined, scope: forms:view, entry: ./console/index.tsx }
    # 标准审批绑定（OA P2）：平台管理员页（forms:global-manage platformOnly）。
    # 与 /console/forms 平级（不是它的子路径）——避免把既有「表单」菜单条目变成不可点的分组标题。
    - { path: /console/forms-bindings, title: 标准审批绑定, description: 企微标准审批模板的绑定资产：processCode、深链与验证证据；发布是平台管理员 gate。, icon: FileTextOutlined, scope: forms:global-manage, entry: ./console/bindings.tsx }
migrations: { dir: ./migrations }

# 通知事件声明（2026-10-27 通知基础设施 §3.1）：对账脚本/发布路径入队，worker 投递。
notifications:
  events:
    - key: forms.form.assigned
      title: 表单指派
      scope: { key: assetId, label: 表单 }
      payload:
        assetId:  { type: string, required: true }
        assignee: { type: user, required: true }
        link:     { type: url, required: true }
      recipients:
        assignee: { kind: field, field: assignee }
      # 开通即投递（Wave 2.3）：没有 defaults 时这条链只有「事件声明」——模板与规则都不存在，
      # dispatch 结果是 `no_rules`（静默不进收件箱）。defaults 是「事件 + 模板 + 派生规则」这根
      # 链的声明面，三处（本文件 / notify/templates/builtin.ts / notify/seed-builtin.ts）必须同描。
      defaults:
        recipient: assignee
        template: forms_form_assigned
        channels: [wecom_default, inapp_default]
    - key: forms.form.due_reminder
      title: 表单催办
      scope: { key: assetId, label: 表单 }
      payload:
        assetId:  { type: string, required: true }
        assignee: { type: user, required: true }
        link:     { type: url, required: true }
      recipients:
        assignee: { kind: field, field: assignee }
      defaults:
        recipient: assignee
        template: forms_form_due_reminder
        channels: [wecom_default, inapp_default]
    # ── 收集轮次（件③ / issue #2707）：开轮指派 + 到期催办 ──
    # 三处同描（本文件 events[].defaults ⇔ notify/templates/builtin.ts ⇔ notify/seed-builtin.ts
    # 派生规则 recipient_key='assignee'）——漏一处 = dispatch `no_rules` 静默丢。
    # assigned 由开轮路由逐 pending 发（eventId forms:round:<id>:assigned:<key>，确定性）；
    # due 由 notify-reconcile job 逐未交发（eventId 含日期 ⇒ 同日重跑不重复）。
    - key: forms.collection.assigned
      title: 收集轮次开轮
      scope: { key: roundId, label: 轮次 }
      payload:
        roundId:  { type: string, required: true }
        assetId:  { type: string, required: true }
        roundKey: { type: string, required: true }
        name:     { type: string, required: true }
        assignee: { type: user, required: true }
        link:     { type: url, required: true }
      recipients:
        assignee: { kind: field, field: assignee }
      defaults: { recipient: assignee, template: oa_collection_assigned, channels: [wecom_default, inapp_default] }
    - key: forms.collection.due
      title: 收集轮次催办
      scope: { key: roundId, label: 轮次 }
      payload:
        roundId:  { type: string, required: true }
        assetId:  { type: string, required: true }
        roundKey: { type: string, required: true }
        name:     { type: string, required: true }
        assignee: { type: user, required: true }
        link:     { type: url, required: true }
      recipients:
        assignee: { kind: field, field: assignee }
      defaults: { recipient: assignee, template: oa_collection_due, channels: [wecom_default, inapp_default] }
    # ── OA 审批（P1 只声明这两个；forms.task.assigned / forms.case.sla.breach 随 P4/P1.5 再加）──
    # `forms.approval.awaiting` 由 **case-engine（外部生产者）** 产生：key 仍以声明模块 id 开头，
    # 归属由 producer 元数据表达（event catalog 记 module_id=external:case-engine）。
    # 三处同描（声明 ⇔ 模板 ⇔ 派生规则），缺一处 = dispatch `no_rules` 静默丢弃：
    #   ① 本文件 events[].defaults；② modules/notify/templates/builtin.ts；
    #   ③ modules/notify/seed-builtin.ts。
    # 护栏：modules/notify/templates/builtin.test.ts（①每条声明必须有 defaults；②模板存在且 eventKey 同名）。
    - key: forms.approval.awaiting
      title: 待审批
      producer: external:case-engine
      scope: { key: caseId, label: 审批 }
      payload:
        submissionId: { type: string, required: true }
        caseId:       { type: string, required: true }
        nodeKey:      { type: string, required: true }
        title:        { type: string, required: true }
        assignee:     { type: user, required: true }
        link:         { type: url, required: true }
      recipients:
        approver: { kind: field, field: assignee }
      # 三处同描：本文件 ⇔ notify/templates/builtin.ts（oa_approval_awaiting）⇔ notify/seed-builtin.ts
      defaults: { recipient: approver, template: oa_approval_awaiting, channels: [wecom_default, inapp_default] }
    - key: forms.approval.decided
      title: 审批有结果
      scope: { key: caseId, label: 审批 }
      payload:
        submissionId: { type: string, required: true }
        caseId:       { type: string, required: true }
        action:       { type: string, required: true }
        decidedBy:    { type: string, required: true }
        decidedAt:    { type: string, required: true }
        submitter:    { type: user, required: true }
        link:         { type: url, required: true }
      recipients:
        submitter: { kind: field, field: submitter }
      defaults: { recipient: submitter, template: oa_approval_decided, channels: [wecom_default, inapp_default] }
