# forms 模块（架构正典 docs/architecture.md §2.4「采集底座：受管数据集（表单+字典）」）。
# 三同纪律：id = DB schema 名 = API 前缀——改 id = 三处同改，选错比放错难改。
# M1.2（issue #710）：受管数据集内核——生命周期 + 字典双档（P4）+ 绑定强度两档（P7）。
# scope 矩阵即 P4 分档：forms:global-manage 标记 platformOnly——装载器仍供给到各租户 org，
# 但宿主的租户管理员授权宇宙会过滤掉它（平台运营在 Casdoor 后台授予）。
id: forms
name: 表单模块
version: 0.2.0
platform: '>=0.1'
permissions:
  - { code: forms:view,           name: 表单查看与解析 }
  - { code: forms:fill,           name: 表单填报 }
  - { code: forms:manage,         name: 表单与租户字典管理 }
  - { code: forms:publish,        name: 表单发布（人 gate） }
  - { code: forms:global-manage,  name: 平台全局字典管理, platformOnly: true }
# ⚠️ api.internal 的 path 是模块相对路径；声明集合必须与 createRouter 注册集合逐条一致
#（装载期双向核对，任一方向差集 ⇒ 装载失败）。改路由或改本清单必须同一提交对齐。
api:
  internal:
    # ── 表单定义（生命周期：draft→publish 人 gate→retired）──
    - { method: GET,    path: /defs,                                scope: forms:view }
    - { method: GET,    path: /defs/:assetId,                       scope: forms:view }
    - { method: POST,   path: /defs,                                scope: forms:manage }
    # AI 起草（#724）：自然语言 → 契约草案 → 落 draft（永不自动发布）。scope 与起草同档
    - { method: POST,   path: /generate,                            scope: forms:manage }
    # 管理面 MCP 端点（#724）：工具 list_forms / generate_form_draft；**不含任何发布类工具**
    - { method: POST,   path: /mcp-manage,                          scope: forms:manage }
    - { method: PUT,    path: /defs/:assetId/versions/:v,           scope: forms:manage }
    - { method: DELETE, path: /defs/:assetId/versions/:v,           scope: forms:manage }
    - { method: POST,   path: /defs/:assetId/versions/:v/publish,   scope: forms:publish }
    - { method: POST,   path: /defs/:assetId/rollback,              scope: forms:publish }
    - { method: POST,   path: /defs/:assetId/versions/:v/retire,    scope: forms:publish }
    # ── 提交（org 钉死 + 按提交钉住版本契约校验）──
    - { method: POST,   path: /defs/:assetId/submissions,           scope: forms:fill }
    - { method: GET,    path: /defs/:assetId/submissions,           scope: forms:view }
    - { method: GET,    path: /submissions/:id,                     scope: forms:view }
    # ── 导出面（出湖管线的「源」，M1.4 / #729）──
    - { method: GET,    path: /export/submissions,                  scope: forms:view }
    # ── 字典（租户私有：forms:manage；读与解析 forms:view）──
    - { method: GET,    path: /dicts,                               scope: forms:view }
    - { method: GET,    path: /dicts/:dictId/options,               scope: forms:view }
    - { method: GET,    path: /dicts/:dictId/resolve,               scope: forms:view }
    - { method: POST,   path: /dicts,                               scope: forms:manage }
    - { method: PUT,    path: /dicts/:dictId/keys/:key,             scope: forms:manage }
    # ── 全局字典（P4：编辑权收平台运营——forms:global-manage platformOnly，租户管理员授不了）──
    - { method: GET,    path: /global-dicts,                        scope: forms:view }
    - { method: GET,    path: /global-dicts/:dictId/options,        scope: forms:view }
    - { method: GET,    path: /global-dicts/:dictId/resolve,        scope: forms:view }
    - { method: POST,   path: /global-dicts,                        scope: forms:global-manage }
    - { method: PUT,    path: /global-dicts/:dictId/keys/:key,      scope: forms:global-manage }
frontend:
  console:
    # 一个条目 + 页内三页签（表单/填报/提交记录，照 aftersales 姿势）；scope=forms:view
    - { path: /console/forms, title: 表单, icon: FileTextOutlined, scope: forms:view, entry: ./console/index.tsx }
migrations: { dir: ./migrations }

# 通知事件声明（2026-10-27 通知基础设施 §3.1）：对账脚本/发布路径入队，worker 投递。
notifications:
  events:
    - key: forms.form.assigned
      title: 表单指派
      scope: { key: assetId, label: 表单 }
      payload:
        assetId:  { type: string, required: true }
        assignee: { type: user, required: true }
        link:     { type: url, required: true }
      recipients:
        assignee: { kind: field, field: assignee }
    - key: forms.form.due_reminder
      title: 表单催办
      scope: { key: assetId, label: 表单 }
      payload:
        assetId:  { type: string, required: true }
        assignee: { type: user, required: true }
        link:     { type: url, required: true }
      recipients:
        assignee: { kind: field, field: assignee }
