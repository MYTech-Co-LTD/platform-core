# dbt/seeds/schema.yml — X01 受控配置 seed 的属性（W1 2026-10-12；spec §3 X01 行）。
#
# 【它是什么】X01 营业日历 = **git 受控 CSV**：结构我建、数据客户填、进 PR 可审。
#   【2026-10-13 裁决（用户）】门店→战区**不走客户映射表**：两账套门店档案管线（dim.branch.l0）
#   天天在跑、湖上 dim_branch.region_id 每日更新，fct 侧按「最新快照为准」直接取（回落语义
#   升正）⇒ 原 x01_branch_region 生效期映射 seed **退役删除**（0 行占位、无消费方）。
#   战区跨账套「同名合并」缺名称（接口只回 region_id、两账套 id 空间不相交、region 管理接口
#   403）——需要跨品牌战区视图时再补一张 27 行 id→名称对照，不阻塞账套内指标。
#
# 【当前两份 CSV 都只有 header（0 行）】——这是**有意的**：没有客户数据就不造数据（无案例不立标准）。
#   dbt seed 对 header-only CSV 建 0 行关系；真机首跑若对空 CSV 报错（版本行为差异），回这里改成
#   放占位行并在 description 记录，不许静默删 seed。
#
# 【生效期语义】region 映射按 effective_from/effective_to 匹配业务日（客户文档 D12 边界：
#   「历史战区要带生效日期，不能套用当前档案」）——匹配逻辑在消费侧（fct/查询），本 seed 只存事实。
version: 2

seeds:
  - name: x01_region_names
    description: >-
      X01 战区名称对照（region_id → 名称，**账套内 id 空间不相交**，跨品牌合并按 region_name
      分组即「同名合并同类项」——2026-10-13 用户裁决）。数据来源：branchindicator（D10）年频枚举
      （report 体系的 branch_region_num 与门店档案 region_id 同空间），非客户手填；6294 一行系
      对称推断（report 无销售行带不出）。战区改名时重跑枚举更新本表（慢变维，无需日更）。
    config:
      column_types:
        system_book: varchar
        region_id: bigint
        region_name: varchar
        source_note: varchar
    columns:
      - name: system_book
        description: 账套。
        tests:
          - not_null
      - name: region_id
        description: 战区编号（乐檬 region_id 原值，与 dim_branch.region_id 同空间）。
        tests:
          - not_null
      - name: region_name
        description: 战区名称（跨账套同名即同一战区）。
        tests:
          - not_null
      - name: region_l1
        description: >-
          一级战区（东部/西部/中部/南部）＝二级名称去序号推导；**空 = 不归属四向的杂项组**
          （其余门店1/其他门店/贵州宣威大区/广西大区/所有区域）——客户文档战区角色明写
          「管理范围：东部、西部、中部、南部独立归属；排除其他门店、贵州宣威大区和广西大区」。
          层级佐证：报表中心三级 war_zone → region_l2 → store（WeKnora region_l2 目标排查条）。

  - name: x01_branch_calendar
    description: >-
      X01 营业日历（客户填）：branch_num × bizday 的营业标记（is_open），供可比门店/连续无业绩
      类指标的「营业日」分母与闭店排除。当前 0 行（等客户数据）。
    config:
      column_types:
        system_book: varchar
        branch_num: bigint
        bizday: date
        is_open: boolean
    columns:
      - name: system_book
        description: 账套。
        tests:
          - not_null
      - name: branch_num
        description: 门店号。
        tests:
          - not_null
      - name: bizday
        description: 营业日。
        tests:
          - not_null
      - name: is_open
        description: 当日是否营业（客户文档 X01 建议 is_open；enable≠营业状态的边界在 D12）。
        tests:
          - not_null

  - name: x08_thresholds
    description: >-
      X08 口径阈值与商品范围（客户批）：批号管理清单/临期天数/低动销阈值/重复费用窗口/考核目标值
      按 threshold_key + domain + 对象行存。当前 0 行（等裁5 客户批准）。未批准前相关指标不设门槛
      （spec 原则：不自设统一门槛）。
    config:
      column_types:
        threshold_key: varchar
        domain: varchar
        branch_num: bigint
        item_num: bigint
        value: varchar
        effective_from: date
        effective_to: date
        source_note: varchar
    columns:
      - name: threshold_key
        description: 阈值键（如 lot_required_items / near_expiry_days / low_sell_threshold / dup_expense_window）。
        tests:
          - not_null
      - name: domain
        description: 适用域（transfer/wholesale/retail/…或 all）。
      - name: value
        description: 阈值取值（统一 varchar，消费侧按 key 解读）。
        tests:
          - not_null
