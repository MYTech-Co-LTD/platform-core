# dbt/seeds/schema.yml — X01 受控配置 seed 的属性（W1 2026-10-12；spec §3 X01 行）。
#
# 【它是什么】X01 组织生效期映射 + 营业日历 = **git 受控 CSV**（2026-10-12 裁决）：结构我建、
#   数据客户填（裁4）、进 PR 可审（diff 可见）。fct 侧的回落语义（X01 未就位 → dim_branch 当前
#   档案 region_id，未映射=0）在 fct_hq_outbound 头注，与 seed 解耦——X01 有数后的「生效期匹配」
#   改造是后续任务（W1 只建结构，无数据可验＝YAGNI 不预接）。
#
# 【当前两份 CSV 都只有 header（0 行）】——这是**有意的**：没有客户数据就不造数据（无案例不立标准）。
#   dbt seed 对 header-only CSV 建 0 行关系；真机首跑若对空 CSV 报错（版本行为差异），回这里改成
#   放占位行并在 description 记录，不许静默删 seed。
#
# 【生效期语义】region 映射按 effective_from/effective_to 匹配业务日（客户文档 D12 边界：
#   「历史战区要带生效日期，不能套用当前档案」）——匹配逻辑在消费侧（fct/查询），本 seed 只存事实。
version: 2

seeds:
  - name: x01_branch_region
    description: >-
      X01 战区生效期映射（客户填）：branch_num → region_id（战区），按 effective_from/to 生效期。
      source_note 记数据来源（谁在哪次给的）。当前 0 行（等客户数据）。
    config:
      column_types:
        system_book: varchar
        branch_num: bigint
        region_id: bigint
        effective_from: date
        effective_to: date
        source_note: varchar
    columns:
      - name: system_book
        description: 账套。
        tests:
          - not_null
      - name: branch_num
        description: 门店号。
        tests:
          - not_null
      - name: region_id
        description: 战区编号（乐檬 region_id 原值）。
        tests:
          - not_null
      - name: effective_from
        description: 生效起始日（含）。
        tests:
          - not_null
      - name: effective_to
        description: 生效截止日（含；开放区间用远未来日期，不用 null）。
        tests:
          - not_null

  - name: x01_branch_calendar
    description: >-
      X01 营业日历（客户填）：branch_num × bizday 的营业标记（is_open），供可比门店/连续无业绩
      类指标的「营业日」分母与闭店排除。当前 0 行（等客户数据）。
    config:
      column_types:
        system_book: varchar
        branch_num: bigint
        bizday: date
        is_open: boolean
    columns:
      - name: system_book
        description: 账套。
        tests:
          - not_null
      - name: branch_num
        description: 门店号。
        tests:
          - not_null
      - name: bizday
        description: 营业日。
        tests:
          - not_null
      - name: is_open
        description: 当日是否营业（客户文档 X01 建议 is_open；enable≠营业状态的边界在 D12）。
        tests:
          - not_null
