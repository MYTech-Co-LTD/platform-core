# dbt/seeds/schema.yml — X01 受控配置 seed 的属性（W1 2026-10-12；spec §3 X01 行）。
#
# 【它是什么】X01 营业日历 = **git 受控 CSV**：结构我建、数据客户填、进 PR 可审。
#   【2026-10-13 裁决（用户）】门店→战区**不走客户映射表**：两账套门店档案管线（dim.branch.l0）
#   天天在跑、湖上 dim_branch.region_id 每日更新，fct 侧按「最新快照为准」直接取（回落语义
#   升正）⇒ 原 x01_branch_region 生效期映射 seed **退役删除**（0 行占位、无消费方）。
#   战区跨账套「同名合并」缺名称（接口只回 region_id、两账套 id 空间不相交、region 管理接口
#   403）——那张 27 行 id→名称对照已建，即 **`dim_region`**（2026-10-18 由 `x01_region_names`
#   升格为维，见其 description）；2026-10-18 起它还被门店维 `dim_lemeng_branch` join，
#   供所有下游源消费（#883）。
#
# 【当前各 CSV 的行数】x01_branch_calendar / x08_thresholds 只有 header（0 行，**有意的**：
#   没有客户数据就不造数据，无案例不立标准）；`dim_region` 27 行 / `dim_brand` 2 行 /
#   `recon_tolerances` 为真实容差 —— 后三者是**受控维与配置**（非客户手填，见各自 description）。
#   dbt seed 对 header-only CSV 建 0 行关系；真机首跑若对空 CSV 报错（版本行为差异），回这里改成
#   放占位行并在 description 记录，不许静默删 seed。
#
# 【生效期语义已随 x01_branch_region 退役而作废】原「region 映射按 effective_from/effective_to
#   匹配业务日」只对已删的那颗 seed 有意义；客户文档 D12 的「历史战区带生效日期」边界改由
#   dim_branch 每日快照 + fct 回落语义承接（2026-10-13 裁决）。
version: 2

seeds:
  - name: dim_region
    description: >-
      **战区维**（`region_id` → 二级名 + 一级战区）。原名 `x01_region_names`，2026-10-18 升格为维
      （#883）：它**不是**客户输入台账（`x01_` 的语义是「结构我建、数据客户填」），而是我们**自力
      枚举**所得；且自 2026-10-18 起被门店维 `dim_lemeng_branch` join、供所有下游源消费 ⇒ 与
      `dim_brand` 同形，按**维**命名。
      **账套内 id 空间不相交**，跨品牌合并按 `region_name` 分组即「同名合并同类项」（2026-10-13 用户裁决）。
      **二级名**来源：`branchindicator`（D10）年频枚举（report 体系的 `branch_region_num` 与门店档案
      `region_id` 同空间），非客户手填；6294 一行系对称推断（report 无销售行带不出）。
      **一级名**来源：乐檬后台 UI 的区域树（2026-10-17 读取）——`nhsoft.user.ai.branch.region.find`
      （唯一能返回完整树的接口）**PAT 路由未配置**（目录有、`enabled=true`，仅未授权）⇒ 一级名
      暂为**受控配置**：**改名 / 新区靠哨兵告警**（见 `dbt/tests/lemeng/warn_region_unregistered.sql`
      与 `dim_lemeng_branch`），不静默腐烂。**慢变维**，改值走 PR。
      **消费方**：① 门店维 `dim_lemeng_branch`（join 出 `region_name` / `region_l1`）；② 回包层
      `modules/data/domain/dimension-labels.ts`（键必须带 `system_book`——两账套都有「中部一区」
      这类同名战区）。
    config:
      column_types:
        system_book: varchar
        region_id: bigint
        region_name: varchar
        region_l1: varchar
        level: integer
        source_note: varchar
    columns:
      - name: system_book
        description: 账套。
        tests:
          - not_null
      - name: region_id
        description: 战区编号（乐檬 region_id 原值，与 dim_branch.region_id 同空间）。
        tests:
          - not_null
      - name: region_name
        description: 战区名称（二级；跨账套同名即同一战区）。
        tests:
          - not_null
      - name: region_l1
        description: >-
          **一级战区（受控真值）**：东部战区 / 中部战区 / 南部战区 / 西部战区（二级名去序号后
          再定级，**不是**字符串截断）；广西大区 / 贵州宣威大区 / 其余门店1 / 其他门店 **自成一档**
          （客户文档战区角色明写「管理范围：东部、西部、中部、南部独立归属；**排除**其他门店、
          贵州宣威大区和广西大区」）。**空 = 根节点**（`所有区域`，非一级）。
          ⚠️ 2026-10-18 前的语义是「去序号推导 + 杂项组为空」——大区被误判成「无一级」；
          本次改为受控真值（#883）。层级佐证：报表中心三级 war_zone → region_l2 → store。
      - name: level
        description: >-
          **该行自身所处的层级**（#883 复审补）：`0` = 根（`所有区域`，无上级）；
          `1` = 一级节点**本身**（`广西大区` / `贵州宣威大区` / `其余门店1` / `其他门店`
          ——它们的 `region_l1` 就是自己）；`2` = 二级（挂在某个「X战区」下的子区）。
          ⚠️ **它由 `region_l1` 完全决定**（`null→0` / `=region_name→1` / 否则 `→2`），
          不是独立事实——加它是为了让消费方**不必重推**这条规则（推错了会静默把大区当二级）。
          一致性由 `dbt/tests/lemeng/assert_dim_region_level_matches_l1.sql` 钉住。

  - name: x01_branch_calendar
    description: >-
      X01 营业日历（客户填）：branch_num × bizday 的营业标记（is_open），供可比门店/连续无业绩
      类指标的「营业日」分母与闭店排除。当前 0 行（等客户数据）。
    config:
      column_types:
        system_book: varchar
        branch_num: bigint
        bizday: date
        is_open: boolean
    columns:
      - name: system_book
        description: 账套。
        tests:
          - not_null
      - name: branch_num
        description: 门店号。
        tests:
          - not_null
      - name: bizday
        description: 营业日。
        tests:
          - not_null
      - name: is_open
        description: 当日是否营业（客户文档 X01 建议 is_open；enable≠营业状态的边界在 D12）。
        tests:
          - not_null

  - name: x08_thresholds
    description: >-
      X08 口径阈值与商品范围（客户批）：批号管理清单/临期天数/低动销阈值/重复费用窗口/考核目标值
      按 threshold_key + domain + 对象行存。当前 0 行（等裁5 客户批准）。未批准前相关指标不设门槛
      （spec 原则：不自设统一门槛）。
    config:
      column_types:
        threshold_key: varchar
        domain: varchar
        branch_num: bigint
        item_num: bigint
        value: varchar
        effective_from: date
        effective_to: date
        source_note: varchar
    columns:
      - name: threshold_key
        description: 阈值键（如 lot_required_items / near_expiry_days / low_sell_threshold / dup_expense_window）。
        tests:
          - not_null
      - name: domain
        description: 适用域（transfer/wholesale/retail/…或 all）。
      - name: value
        description: 阈值取值（统一 varchar，消费侧按 key 解读）。
        tests:
          - not_null

  - name: dim_brand
    description: >-
      品牌维（`system_book` → 品牌名）。**为什么需要它**：账套号 `3120`/`64188` 是技术键，
      业务人员认的是品牌名；而乐檬侧没有任何「品牌」接口（`stg_lemeng_branch` 只有门店名，
      门店名前缀只是佐证、不是权威来源）⇒ 这 2 行是**唯一事实源**，进 git 可审。
      **慢变维**：账套改名是极低频事件，改了直接改本 CSV 走 PR（无生效期语义，永远取当前值）。
      **消费方**：查询 API 的回包层（`modules/data/domain/dimension-labels.ts`）——事实表只存键，
      名称在展示层解析；**不要**把它 join 进指标 `select_sql`（会让可加性与合计失真）。
    config:
      column_types:
        system_book: varchar
        brand_name: varchar
        source_note: varchar
    columns:
      - name: system_book
        description: 账套（与各事实表的 system_book 同域）。
        tests:
          - not_null
          - unique
      - name: brand_name
        description: 品牌名（业务可见名称，如 熊喵鲜生 / 品品甜）。
        tests:
          - not_null
      - name: source_note
        description: 来源与佐证（谁给的、拿什么交叉核过）。

  - name: recon_tolerances
    description: >-
      **口径对账的容差配置**（消费面 spec §12.4；行业形态 control totals + break management）。
      一行 = 一个 control 的容差与其**具名理由**。为什么要具名 + 到期：
      `NET_ABS_TOL=200` 原先是脚本里的**匿名活口**——它同样放过任何 ≤200 元的新问题，
      而且没人知道它何时该失效。落到本 seed 后，`reason_code` 具名、`expires_on` 到期，
      **过期后 `abs_tol` 视为 0 ⇒ 任何非零差自动转 `over_tol`**（到期自动转红，不靠人记得）。
      生效逻辑在 `dbt/models/lemeng/marts/recon_break.sql`。
    config:
      column_types:
        control: varchar
        abs_tol: decimal(20,2)
        pct_tol: decimal(10,4)
        reason_code: varchar
        expires_on: date
        disposition: varchar
        disposition_by: varchar
    columns:
      - name: control
        description: 控制名（`caliber_sale` 销售侧 / `caliber_net` 净额侧）。
        tests:
          - not_null
          - unique
      - name: abs_tol
        description: 绝对容差（元）。与 `pct_tol` 取大者生效。
        tests:
          - not_null
      - name: pct_tol
        description: 相对容差（百分比，如 0.01 = 0.01%）。
        tests:
          - not_null
      - name: reason_code
        description: >-
          具名理由（空 = 无已知缺口，任何差都算真红）。**不允许写成「容差内」这类无名描述**。
      - name: expires_on
        description: >-
          到期日（空 = 无到期）。**到期后 `abs_tol` 视为 0** ⇒ 该 control 的差一律转 `over_tol`。
      - name: disposition
        description: 处置说明（为什么接受、按哪边修）。
      - name: disposition_by
        description: 认领人。

  - name: x01_client_region_overrides
    description: >-
      **批发客户 → 体系内门店 的覆盖映射**（P0 2026-10-30，issue #1181）。默认口径是**自动匹配**：
      客户名在**另一个账套**的门店名里**唯一命中** ⇒ 判为体系内门店（`dim_lemeng_client` 的实现）。
      本 seed 只装**自动匹配救不了的两种情况**：① 名字写法不一致的别名（如客户台账写「腾冲1店」、
      门店档案写「品品甜保山腾冲1店」）；② 业务人工指定的归属（如某外部客户确属某战区）。
      **0 行是合规态**（没有需要覆盖的数据就不造数据，与 `x01_branch_calendar` 同规）。
      一行 = 某账套的一个客户被指定为「另一个账套的某家门店」，`region_id` 可省略（省略时取该门店
      在 `dim_region` 里的 `region_id`）；`source_system_book` + `client_fid` 唯一。
      **生效语义**：覆盖优先于自动匹配（`match_rule = 'override'`）；客户改名不影响本行。
    columns:
      - name: source_system_book
        description: 客户所属账套（如 3120）。与 `client_fid` 一起定位一个客户。
        tests: [{not_null: {}}]
      - name: client_fid
        description: 客户 ID（`stg_lemeng_client.client_fid`）。
        tests: [{not_null: {}}]
      - name: client_name
        description: 客户名（仅供人读；匹配键是 `client_fid`，改本列不影响生效）。
      - name: home_system_book
        description: 客户本体所属账套（如 64188）——战区从这个账套的门店档案取。
        tests: [{not_null: {}}]
      - name: home_branch_num
        description: 本体门店号（可空：只指定战区、不指定门店时留空）。
      - name: region_id
        description: 指定战区（可空：留空则取 `home_branch_num` 在 `dim_region` 的 `region_id`）。
      - name: note
        description: 为什么需要这条覆盖（必填，供评审看）。
