# dbt_project.yml — 数据栈 dbt 项目（分层设计 ③ staging / ④ marts 两层；issue #150 / 计划 Task 4）
#
# 为什么 materialization 缺省是 `table`（不是 view、也不是全量禁物化）：
#   分层设计的实测口径（layered §5.3）是「staging 物化一次、marts 物化一次，消费层不再回源」
#   （1.09M 行聚合 ~1 秒）；纪律原是**按需 `--select`**（物化存储实测 ×8 膨胀），#679 实证名单
#   已是事实全量（26/26 节点）后改为**全量日物化**（命令真身 `scripts/lemeng/materialize.sh`，
#   无 `--select`，新模型自动纳入）。不是禁止物化。
#   而 `table` 同时满足 gate 2：**物化落点必须是 PG 可见关系**（见下）。
#
# ⚠️ 两处「以实测口径为准」的设计 gate（本文件**不预接**未实测的接线 = 不制造假绿；
#    结论与核对清单在 dbt/README.md 的同名小节）：
#   gate 1 S3 凭据注入：DuckDB 实例**按连接**（spec §11.5 #1）⇒ secret 必须在用到它的那条会话里建。
#   gate 2 物化落点：read_parquet 裸扫描不进 pg_class（spec §9.4）⇒ 模型必须物化成 PG 可见关系
#     （table / view / `USING duckdb` 外表）。本文件缺省 `table`，形态核对见 README。
name: 'platform_data'
version: '0.1.0'
config-version: 2

# profile 名固定；**真值不在本仓**——跑的人用一份不进仓的 profiles.yml（模板见 profiles.example.yml），
# 或由 openship 把 env(isSecret) 注入运行环境。
profile: 'platform_data'

model-paths: ['models']
# `macro-paths` **显式声明**（评审 M8）：dbt 缺省就是 `["macros"]`，但缺省一旦被收紧/改动，
# `generate_schema_name.sql` 会**静默变成死代码** —— 那时 dbt 回内置行为、每个租户落进同一个
# schema，而「macro 在场且由 var('tenant') 派生」那批**结构断言仍然全绿**（它只读文件内容）。
# 显式写出来，等于把「这个目录必须被 dbt 扫」变成一份可 diff 的声明。
macro-paths: ['macros']
test-paths: ['tests']
# 本地产物（`dbt parse` / `dbt run` 生成）：**不进仓**。忽略规则归 T5（.gitignore 唯一写入方，本任务
# 不碰）；静态门禁自己也跳过这三个目录（scripts/check-data-models.mjs 的 SKIP_DIRS）——否则本地跑过
# 一次 `dbt parse` 就会让门禁去读 target/ 里的编译产物。
target-path: 'target'
log-path: 'logs'
packages-install-path: 'dbt_packages'
clean-targets: ['target', 'logs', 'dbt_packages']

vars:
  # ── 非敏感：路径与账套 ───────────────────────────────────────────────────────
  # 乐檬零售**订单明细**前缀（新湖；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet
  # 出处：contracts/common/lemeng.retail_order_line.json 的 `layout.prefix` / `partitionBy`（hive 三级分区）。
  # 消费者 = `stg_lemeng_retail_order_line`（唯一）。**不按账套分 var**：它读 `system_book=*/` 通配两账套，
  # `system_book` 走 hive 自动推断成列（2026-09-26 改：原「每账套跑一份」会让 64188 落湖却进不了物化，issue #250）。
  #
  # ⚠️ 2026-10-06 退役：双轨期的旧湖 var `lemeng_retail_prefix` 与 `account_book` 已随
  #    `stg_lemeng_retail_detail.sql` 的**仓内退役**一并删除（不再有第二个前缀）。
  #    本轮只退**仓内工件**——湖上前缀 `lemeng/retail_detail/…` **仍在被写、未下线**
  #    （生产方 `data-analysis` 每 5 min 运行一次；§1.3 阶段 I 的观察期前提未满足），
  #    状态与出处见 docs/data-platform-handbook.md §2 的旧前缀行。
  lemeng_retail_order_line_prefix: 'lemeng/retail_order_line'
  #
  # ── S2-a **维度面**前缀（新湖；与上面零售那条是**另一组**，别混）────────────────────
  # 乐檬**门店维**前缀（全量快照；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/dim_branch/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.branch.json 的 `layout.prefix` / `partitionBy`（hive 两级分区）。
  # 消费者 = `stg_lemeng_branch`（唯一）；分域单点：每个域一个 var，谁读哪个见对应 staging 的头注。
  lemeng_branch_prefix: 'lemeng/dim_branch'
  #
  # ── **forms 域**前缀（新湖；M1.4 / issue #729）─────────────────────────────────
  # 表单提交（通用域：任何表单同表，新表单只是新的 form_def_id 值）：
  # s3://<bucket>/forms/submission/bizday=<采集日，Asia/Shanghai 日历日 ${date+8h}>/batch_id=<run id>/all.parquet
  # 出处：contracts/common/forms.submission.json 的 `layout.prefix` / `partitionBy`（hive 两级分区）。
  # 消费者 = `stg_forms_submission`（唯一）。
  # ⚠️ `batch_id` 作分区键是**刻意的**：ADR-0005 §13.1 ② 实测 snk.parquet 的 append+分区
  #    实际是**覆写**（分区固定文件名，二轮抹一轮）⇒ 追加语义靠「批次目录」实现。
  # ⚠️ 租户维度**不在路径里**（org 由 subject_org() 注入，见该 macro 与契约 description）。
  forms_submission_prefix: 'forms/submission'
  # 乐檬**商品维**前缀（全量快照；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/dim_item/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.item.json 的 `layout.prefix` / `partitionBy`（hive 两级分区）。
  # 消费者 = `stg_lemeng_item`（唯一）；分域单点：每个域一个 var，谁读哪个见对应 staging 的头注。
  lemeng_item_prefix: 'lemeng/dim_item'
  # 乐檬**门店商品应用价**前缀（#481 价格批；全量快照；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/item_price/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.item_price.json 的 `layout.prefix` / `partitionBy`（hive 两级分区）。
  # 消费者 = `stg_lemeng_item_price`（唯一）；分域单点：每个域一个 var，谁读哪个见对应 staging 的头注。
  # ⚠️ 刻意叫 `item_price` 而不是 `dim_item_price`：生产者判定按「sink 文本含契约 prefix」的
  #    子串匹配，`dim_item_price` 会以子串撞上 `dim_item` 的契约（多配出一个 108 列生产者 ⇒ 门红）。
  lemeng_item_price_prefix: 'lemeng/item_price'
  # 乐檬**配送调出单**前缀（#499/R2；行=配送单商品行；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.transfer_out.json 的 `layout.prefix` / `partitionBy`（hive 两级分区）。
  # 消费者 = `stg_lemeng_transfer_out`（唯一）；采集范围仅 3120 主账套（64188=外部批发客户，R2 拍板）。
  # 乐檬**口径对账逐店事实**前缀（2026-10-18，消费面 spec §12.4）：
  # s3://<bucket>/lemeng/recon_preagg/system_book=<账套>/bizday=<日期>/chunk=<块号>/all.parquet
  # 出处：contracts/common/lemeng.recon_preagg.json 的 `layout.prefix` / `partitionBy`（hive 三级）。
  # 消费者 = `stg_lemeng_recon_preagg`（唯一）。**chunk 是绕端点硬限的切块维度**（单次 ≤100 家）。
  lemeng_recon_preagg_prefix: 'lemeng/recon_preagg'
  lemeng_transfer_out_prefix: 'lemeng/transfer_out'
  # 乐檬**批发销售单**前缀（#499/R3；行=批发单商品行；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/wholesale_out/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.wholesale_out.json 的 `layout.prefix` / `partitionBy`。
  # 消费者 = `stg_lemeng_wholesale_out`（唯一）；采集范围仅 3120 主账套（WO 发货方=3120）。
  lemeng_wholesale_out_prefix: 'lemeng/wholesale_out'
  # 乐檬**批发退货单**前缀（W1 2026-10-12；行=退货单商品行；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/wholesale_return/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.wholesale_return.json 的 `layout.prefix` / `partitionBy`。
  # 消费者 = `stg_lemeng_wholesale_return`（唯一）；采集范围仅 3120 主账套；A 阶段恒空集（契约 description 详）。
  lemeng_wholesale_return_prefix: 'lemeng/wholesale_return'
  # 乐檬**门店费用**前缀（W2 2026-10-13；行=费用单；不含 bucket / 协议）：
  # 出处：contracts/common/lemeng.branch_expense.json 的 `layout.prefix` / `partitionBy`。
  # 消费者 = `stg_lemeng_branch_expense`（唯一）；采集范围仅 3120 主账套。
  lemeng_branch_expense_prefix: 'lemeng/branch_expense'
  # 乐檬**客户费用**前缀（W2 2026-10-13；行=客户费用单；不含 bucket / 协议）：
  # 出处：contracts/common/lemeng.client_expense.json 的 `layout.prefix` / `partitionBy`。
  # 消费者 = `stg_lemeng_client_expense`（唯一）；采集范围仅 3120 主账套。
  lemeng_client_expense_prefix: 'lemeng/client_expense'
  lemeng_request_order_prefix: 'lemeng/request_order'
  lemeng_transfer_in_prefix: 'lemeng/transfer_in'
  lemeng_inventory_snapshot_prefix: 'lemeng/inventory_snapshot'
  lemeng_item_purchase_prefix: 'lemeng/item_purchase'
  # 乐檬**批发客户档案**前缀（#516 段①；全量快照；不含 bucket / 协议）：
  # s3://<bucket>/lemeng/client/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet
  # 出处：contracts/common/lemeng.client.json 的 `layout.prefix` / `partitionBy`（hive 两级分区）。
  # 消费者 = `stg_lemeng_client`（唯一）；采集范围仅 3120 主账套（GET 零参数固定窗，例外见正典 §1.7）。
  lemeng_client_prefix: 'lemeng/client'
  #
  # ── 敏感：只留「非密」三项作 var（bucket / endpoint / region）────────────────
  # ⚠️ AK/SK **刻意不做 dbt var**：vars 会落进 target/manifest.json、编译产物与 `dbt run` 日志。
  #    它们只在「建 secret 的那一句」里由 `env_var()` 现取（形态待 T6 实测，见 README gate 1）。
  # `env_var` 第二参给空串默认值：这样**没有凭据的机器也能 `dbt parse`**（parse 不连库、不读 parquet）。
  # 缺 env 时路径会拼成 `s3:///…` ⇒ 运行期**响亮失败**，不会静默读到别的东西。
  # 取法：天翼云 ZOS 控制台 → 对象存储 → 访问密钥；endpoint 只写域名（不带 https://）。
  zos_bucket: "{{ env_var('LEMENG_ZOS_BUCKET', '') }}"
  zos_endpoint: "{{ env_var('LEMENG_ZOS_ENDPOINT', '') }}"
  zos_region: "{{ env_var('LEMENG_ZOS_REGION', '') }}"

models:
  platform_data:
    +materialized: table

    # ── 域开关：一个部署只物化自己的域（docs/architecture.md §2.5；2026-10-17 实测）──────────
    # **目录即域**：`models/<域>/{staging,marts}/`。每个数据面按 env `DATA_PLANE_DOMAINS`
    # （逗号分隔）只 build 自己拥有的域 —— 共享一棵 dbt/ 树但**不得互 build 对方的模型**：
    # 本方侧会把对方租户的数据物化进本方仓库并标成本方 org（反向泄漏），对方侧则因前缀空而 dbt 红
    # ⇒ `exit 1` 早于写 load_log ⇒ 水位冻结、全部指标新鲜度连带退化。
    #
    # ⚠️ 三条实测（dbt-core 1.9.1 + dbt-postgres 1.9.1，即 deploy/dbt/Dockerfile 钉的版本；
    #    scratch 工程 dbt parse 后读 target/manifest.json 的 config.enabled）——**改这里之前先读**：
    #    ① `env_var` **绝不能带默认值**：带 `''` 时变量漏配 ⇒ 解析成空串 ⇒ **0 个模型、退出 0**
    #       ⇒ 物化脚本照打 MATERIALIZE_OK（假绿）。不带默认值时未设即 parse 报错（fail-closed）。
    #    ② 域目录**未在此登记** ⇒ dbt 默认 `enabled: true` ⇒ **每个面都会 build 它**。
    #    ③ `+enabled` 里**不能引用本文件 `vars:` 块的 var**（`models:` 的渲染早于工程 vars，
    #       报 `Required var 'x' not found in config`）⇒ 部署身份只能来自 env / `--vars`。
    #    ⇒ ①② 两个方向都**静默**，所以 `scripts/check-data-models.mjs` 规则 ⑪ 机检「每个
    #      models/<域>/ 目录在这里都有显式 +enabled 条目」。新增域 = 加目录 + 加这里两处，缺一即红。
    lemeng:
      +enabled: "{{ 'lemeng' in env_var('DATA_PLANE_DOMAINS').split(',') }}"
    forms:
      +enabled: "{{ 'forms' in env_var('DATA_PLANE_DOMAINS').split(',') }}"
