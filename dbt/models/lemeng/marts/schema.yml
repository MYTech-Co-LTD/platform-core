# schema.yml — marts 层的模型描述 + dbt tests（layered §4 步骤 4）。
#
# ⚠️ **L1 语义声明不在这里**，在 `dbt/semantics/l1_metrics.yml`。为什么（一句话）：
#   指标名的命名空间形态是 `<源>:<业务域>:<指标>`（`lemeng:retail:net_sales`），而 **dbt 资源名不允许冒号**
#   ⇒ 把带冒号的 `name` 放进 dbt 会扫的 schema 文件里，有让 `dbt parse` 挂掉的风险。
#   详细理由、以及「T6 若证实 dbt 接受带冒号的名字可并入本文件」的核对步，见 dbt/README.md
#   「L1 语义声明的落点」。静态门禁**两处都扫**（`dbt/semantics/**` 与 `dbt/models/**`），
#   所以两种落点都不会漏检。
#
# 本文件的两类断言（都不替代对账：对账是 `dbt/tests/<域>/audit_*.sql` 的独立复算）：
#   · 列级 `tests:`（dbt 原生，`not_null` / `accepted_values`）——钉「这一列该有的形状」
#   · 结构断言（singular test）——钉「单列约束抓不住的形状」，如**复合粒度的唯一性**与金额范围
version: 2

models:
  - name: dim_lemeng_branch
    description: >-
      **门店维（湖上每日快照 + 战区标签）**（#883，2026-10-18）。粒度与 `stg_lemeng_branch`
      逐行一致：`(system_book, snapshot, branch_num)`——**保留全部快照**，fct 侧仍可按
      `latest snapshot ≤ bizday` 做 as-of join；只要"当前值"的消费方自取 `snapshot = max(snapshot)`。
      **为什么有它**：乐檬 `branch.find` **不回** `region_name`（实测）⇒ 战区名/一级原先只活在回包层，
      marts / 报表 / 各下游源拿不到；本模型把 `dim_region` join 上来，**所有源免 join 即得**，
      且 `region_l1` 可作 group by 键（「按一级战区汇总」必须发生在**聚合处**）。
      **落点裁决**：标签落在**维**上，**不塞进湖上采集快照**（`lemeng/dim_branch` 是契约驱动的 raw 快照，
      `region_name` 非源生；理由全文见模型头注）。**为什么叫 `dim_lemeng_branch` 而不是 `dim_branch`**：
      后者在本仓**已专指湖上快照路径**，复用会失去所指（同头注）。
      **join 语义**：`left join` + 键带 `system_book` ⇒ 未登记的新区**照出行**（标签 null，不捏造、不反噬），
      且不会串账套（两账套有同名战区）。新 `region_id` 由 `dbt/tests/lemeng/warn_region_unregistered.sql`
      **告警**（warn，不阻断——新区不影响存量指标的正确性）。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests: [{not_null: {}}]
      - name: org
        description: 主体列（宏注入）。
        tests: [{not_null: {}}]
      - name: snapshot
        description: 快照日（Asia/Shanghai 日历日）。粒度键。
        tests: [{not_null: {}}]
      - name: branch_num
        description: 门店号（账套内编号）。粒度键。
        tests: [{not_null: {}}]
      - name: code
        description: 门店编码。
      - name: name
        description: 门店名。
      - name: pinyin
        description: 拼音码。
      - name: type
        description: 门店类型。
      - name: enable
        description: 是否启用。
      - name: region_id
        description: 战区编号（乐檬原值，与 `dim_region.region_id` 同空间）。**可空**（契约 nullable）。
      - name: region_name
        description: >-
          战区二级名（`dim_region` join 所得）。**未登记的新区为 null**——「名称未知 ≠ 捏造名称」，
          与回包层同姿态；该情形由 `warn_region_unregistered` 告警。
      - name: region_l1
        description: >-
          一级战区（`dim_region` join 所得；东部战区/中部战区/南部战区/西部战区 + 大区/杂项自成一档）。
          **空 = 根节点或未登记**（`dim_region.region_l1` 的语义见 `dbt/seeds/schema.yml`）。
      - name: province
        description: 省。
      - name: city
        description: 市。
      - name: district
        description: 区县。
      - name: contact
        description: 联系人。
      - name: phone
        description: 电话。
      - name: address
        description: 地址。

  - name: fct_branch_day_activity
    description: >-
      门店 × 日 **活动骨架**（03-05 连续无业绩天数的落点；2026-10-17 最小案例）。粒度
      (system_book, bizday, branch_num)。零售事实只在「有单」的店日有行 ⇒ 本表补**真零天**，
      使「连续无业绩天数」建立在完整日序列上。门店存在性/是否营业/战区取自 `stg_lemeng_branch`
      **每日快照的 as-of**（latest snapshot ≤ bizday）——**日历可推导，不等客户交表**
      （实测店×日空格子 129 个，其中 125/96.9% 门店当日存在）。`retail_active` 标记该门店在观察窗内
      是否**有过**零售销售：400 个「账套×门店」里 173 个零零售（批发客户/仓库），其 zero_sales 不构成信号，
      消费侧按它收缩。**已知盲区**：整窗零零售 vs 窗内一直闭店无法区分（历史 25 天），待客户营业日历
      或更长窗口；「断数 vs 零销售」的最终判定仍需 X09（`collection_covered` 只是账套×日的弱代理）。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests:
          - not_null
      - name: org
        description: 主体列（宏注入）。
        tests:
          - not_null
      - name: bizday
        description: 业务日（自然日序列，末日在上海昨日——当日为部分天不纳入）。粒度键。
        tests:
          - not_null
      - name: branch_num
        description: 门店号。粒度键。
        tests:
          - not_null
      - name: region_id
        description: 战区编号（as-of 快照；门店不存在时为空）。
      - name: branch_enabled
        description: 当日该门店在档案中是否启用（as-of）。
        tests:
          - not_null
      - name: retail_active
        description: 观察窗内是否有过零售销售（false = 批发客户/仓库/配送节点，zero_sales 不构成信号）。
        tests:
          - not_null
      - name: sale_money
        description: 当日零售销售额合计（无行为 0）。
        tests:
          - not_null
      - name: order_count
        description: 当日零售去重订单数（无行为 0）。
        tests:
          - not_null
      - name: collection_covered
        description: 该**账套当日**是否有任意零售行（弱代理：不能证明单店被完整采集；断数判定仍归 X09）。
        tests:
          - not_null
      - name: data_status
        description: >-
          店日分类：has_sales / zero_sales / not_collected / branch_absent / branch_disabled。
        tests:
          - not_null
          - accepted_values:
              values: ['has_sales', 'zero_sales', 'not_collected', 'branch_absent', 'branch_disabled']
      - name: consecutive_no_sales_days
        description: >-
          截至当日的连续无业绩天数（gaps-and-islands；非 zero_sales 的行为 0）。**不可加**。
        tests:
          - not_null

  - name: fct_retail_comparable_growth
    description: >-
      **可比门店（like-for-like）两期对照构件**（01-05 / 07-06 的落点；2026-10-17「问 0」第二例）。
      粒度 (system_book, period_days, bizday)。**为什么必须有构件**：客户公式
      `增长率＝Σ_B本期L/Σ_B上期L−1` 里的 **B 是「这一对期间」的属性**，消费方两次调用各取一期再相除
      会因行集不同而口径错 ⇒ B 必须在构件里定死，两期金额同表同粒度同集合。
      **B 全部可从自有数据推出**（不依赖客户营业日历）：不是新开店（`first_seen <= 上期开始`）／
      不是闭店（`last_seen >= 本期结束`）／两期每日快照均 `enable`／两期中至少一期有零售行
      （否则批发客户/仓库会混进分母——400 个「账套×门店」里 173 个零零售）。
      **周期当前只出 7 天**（客户频率是月，但湖只有 25 天历史）。**已知边界**：窗内新开/闭店实测均为 0
      ⇒ 那两条排除逻辑当前空转，随历史变长生效。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests:
          - not_null
      - name: org
        description: 主体列（宏注入）。
        tests:
          - not_null
      - name: period_days
        description: 周期长度（自然日）。粒度键。
        tests:
          - not_null
      - name: bizday
        description: 本期报告期末日（上海日历）。粒度键。
        tests:
          - not_null
      - name: comparable_count
        description: 可比门店集合 B 的门店数（本期分母样本）。
        tests:
          - not_null
      - name: excluded_new
        description: 排除——新开店（`first_seen > 上期开始`）。当前实测恒 0（窗内无新开）。
        tests:
          - not_null
      - name: excluded_closed
        description: 排除——闭店（`last_seen < 本期结束`）。当前实测恒 0（窗内无闭店）。
        tests:
          - not_null
      - name: excluded_disabled
        description: 排除——两期内快照有 `enable=false`。
        tests:
          - not_null
      - name: excluded_no_retail
        description: 排除——两期均无零售行（批发客户/仓库/配送节点；射程收缩用）。
        tests:
          - not_null
      - name: cur_amount
        description: B 的本期销售额合计（Σsale_money 毛额，不冲退货）。
        tests:
          - not_null
      - name: pri_amount
        description: B 的上期销售额合计（同上）。
        tests:
          - not_null
      - name: cur_store_days
        description: B 在本期**有销售**的店日数（客户「营业店日归一化」第二式的分母）。
        tests:
          - not_null
      - name: pri_store_days
        description: B 在上期有销售的店日数（同上）。
        tests:
          - not_null
      - name: growth_rate
        description: >-
          增长率 = cur/pri − 1；上期合计为 0 ⇒ NULL（率不适用——**不能落成 0 或 −1**）。
        tests:
          - not_null

  - name: fct_retail_sale
    description: >-
      零售销售事实（口径模型）。粒度 **(system_book, bizday, branch_num)**（2026-10-12 W0 由两键扩到三键）；
      口径只在此定义一次（现行口径 = #430 换货半边公式，见模型头注）。
      指标声明见 dbt/semantics/l1_metrics.yml（L1 事实源）。
      含**主体列 `org`**（由 subject_org 宏注入常量，见 dbt/macros/subject_org.sql）；粒度不受它影响 ——
      每个租户物化进自己的 schema，relation 内 org 恒为单值。
      ⚠️ **本文件的 description 里不许写「双大括号 + 宏名 + 括号」那种 Jinja 调用**（连当反例写也不许）：
      description 在**解析期**就会被渲染，而那时的上下文里**项目 macro 不可见** ⇒ `dbt parse` 直接报
      `'<宏名>' is undefined`。2026-09-26 实测：上面这句里曾那样写过一次，把物化 job 打红。
      要说明「由哪个宏注入」，就只写**宏名**（反引号里那个），别写成调用形态。
    columns:
      - name: system_book
        description: 账套（主体维度，3120 熊喵 / 64188 品品甜）。**已实证**——身份跟着数据走：值来自**路径**（新湖 hive 分区键 `system_book=<账套>/` 被 read_parquet 自动推断成列，staging 只把它 `::varchar` 定型；2026-09-24 真机 dbt run 通过）。（「由 `account_book` var 供值」那套只存在于双轨期的旧湖 `stg_lemeng_retail_detail` 里；该文件与其两条 var 已于 2026-10-06 随仓内退役删除。）
        tests:
          - not_null
          # 账套是**自己控制的枚举**（公司标准 §4.1 的主体清单——**该标准尚未合入**），故用 accepted_values 钉死；
          # 新增账套要改这里（有意的摩擦：账套集合变了是件该被看见的事）。
          - accepted_values:
              values: ['3120', '64188']
      - name: org
        description: '主体列 = 该部署租户的 casdoor_org（经 env `LEMENG_SUBJECT_ORG` 注入，值不落仓）。本模型由 `subject_org` 宏注入常量（宏名不是调用 —— 见模型 description 里的那条警告）；不参与口径，每个租户物化进自己的 schema ⇒ **单个 relation 内恒为单值**，故模型粒度仍写作 (system_book, bizday, branch_num)。行级授权谓词 `WHERE org = …` 的着力点（modules/data/domain/authz.ts）。'
        tests:
          - not_null
      - name: bizday
        description: 业务日。**新湖（现行）**：列名就是 `bizday`，是 **hive 分区键**（路径 `bizday=<日期>/` 推断）且**落盘即定型为 DATE**（管线侧由 shift_table_bizday 定型）——`order_detail_bizday` 与 `%Y%m%d` 是**旧湖** `stg_lemeng_retail_detail` 的形态（该文件已于 2026-10-06 仓内退役），不再是本模型的来源。
        tests:
          - not_null
      - name: branch_num
        description: 门店号（账套内编号；粒度第三键，2026-10-12 W0 加入——65 项指标体系的零售侧要下钻到店）。取自 staging 同名列透传（int 已定型）。
        tests:
          - not_null
      - name: sale_amount
        description: 销售侧金额（**不冲退货**；= 2026-10-17 之前 `net_amount` 的原值）。#430 口径：FINISHED+SALE_ORDER 基面 + 换货「送出半边」公式 + 赠品判别式排除，详见模型头注。**与 l1_metrics.yml 的 `lemeng:retail:sales` 同源**。
        tests:
          - not_null
      - name: return_amount
        description: 退货侧金额（**正数量级**）= Σ(sale_money + order_detail_share_discount)，条件 `order_transaction_type like '%RETURN%' AND state='FINISHED'`（REPAID_RETURN 不计）。**全额冲减，不套折半**。见 spec 2026-10-17 §4。
        tests:
          - not_null
      - name: net_amount
        description: 净销售额 = `sale_amount − return_amount`。**与 l1_metrics.yml 的 `lemeng:retail:net_sales` 同源**。
        tests:
          # 金额范围是结构断言（singular test）而不是列级 test：dbt 原生的 accepted_values 只判等值
          # 集合，判不了「≥ 0」这种区间；引 dbt_utils 又要加 packages.yml（多一层依赖 + 解析期要联网）。
          # ⚠️ net_amount **可负**（退货 > 销售的店日），故断言挂在 sale_amount 上：
          # 见 dbt/tests/lemeng/assert_fct_retail_sale_sale_amount_nonnegative.sql
          - not_null
      - name: order_count
        description: 有效订单数 = 销售侧基面（FINISHED+SALE_ORDER）count(distinct 单号)。**与 l1_metrics.yml 的 `lemeng:retail:order_count` 同源**；基面 = 销售单，**不含退货单**（退货不是「订单」）。
        tests:
          - not_null
      # 聚合面组件化 P3.2（2026-10-23）后，本模型不再输出 `*__gen` 影子列：`sale_amount` /
      # `return_amount` 直接取自 `scripts/gen-fct-measures.mjs` 生成区的 rollup（标记区见
      # fct_retail_sale.sql），`net_amount` 由前两者相减，归零仍在最终 SELECT 的 `coalesce(…, 0)`。
      # 口径的独立复算守卫是 audit_lemeng__retail__sales.sql / audit_lemeng__retail__net_sales.sql：
      # 复算侧不读生成物、直接打 parquet，且**不 ref staging**（若走 staging，staging 的 cast 错会
      # 同时污染两边 ⇒ 对账恒等永远绿）；只有比对侧 ref 本模型（fct_retail_sale）。


  - name: fct_hq_outbound
    description: >-
      总仓出库构件长表（W1 2026-10-12）：transfer/wholesale 双域的 R/C/G 构件唯一落点
      （跨 D01+D02−D03 三份湖表，L1 单 FROM 约束的 marts 解）。粒度 (system_book, bizday,
      domain, branch_num, region_id, **client_fid**)——client_fid 是 2026-10-17 加的第 6 键
      （批发按客户拆行；transfer 域恒 NULL，见模型头注）；口径见模型头注（transfer 基面排除店间直调；wholesale 侧
      退货店日级相减防 per_order join 放大；R 用行级 out_money=裁8 experimental）。
      region_id = X01 未就位的回落（dim_branch 最新快照，未映射=0，种子语义）。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests:
          - not_null
      - name: org
        description: 主体列（subject_org 宏注入；relation 内恒单值）。
        tests:
          - not_null
      - name: bizday
        description: 业务日（=制单/采集分区日）。粒度键。
        tests:
          - not_null
      - name: domain
        description: 域（transfer=配送出库 / wholesale=批发）；客户文档 01-01 禁混加，比例类按域分母。
        tests:
          - not_null
      - name: branch_num
        description: 收货门店号（transfer=调入店；wholesale=单头门店）。粒度键。
        tests:
          - not_null
      - name: client_fid
        description: 批发客户号（**第 6 粒度键**，2026-10-17 加）。`wholesale` 行来自 stg 的 client_fid（真机 2140/2140 非空、105 个客户）；**`transfer` 行恒 NULL**（客户对象不存在）。⚠️ 引用本表做门店/战区/总仓口径时必须先把 client_fid 聚合掉（见 fct_contribution）。
        # 恒 NULL 是**预期形状**（transfer 域无客户对象），故不挂 not_null；
        # 但「wholesale 行必须有值」由 audit_lemeng__outbound__net_amount 等对账用 5 键聚合间接兜住。
      - name: region_id
        description: 战区（X01 回落 dim_branch 最新快照；0=未映射单列）。粒度键。
        tests:
          - not_null
      - name: r_net
        description: R 出库净额构件（transfer=Σ行 out_money；wholesale=单头 total 和−退货单头 total 和）。**与 lemeng:outbound:net_amount 同源**。
        tests:
          - not_null
      - name: c_cost
        description: C 成本构件（transfer=Σ subtotal=成本小计；wholesale=单头 cost 和−退货 cost 和）。**与 lemeng:outbound:gross_profit 的减数同源**。
        tests:
          - not_null
      - name: g_gross
        description: G 毛利构件 = r_net − c_cost。**与 lemeng:outbound:gross_profit / gross_margin_rate 分子同源**。
        tests:
          - not_null
      - name: order_count
        description: 域内去重单数（04-01 面之一；transfer 侧与 lemeng:transfer:order_count 同源）。
        tests:
          - not_null
      - name: line_count
        description: 预留行数列（transfer 行数面 W1 以独立指标承载，本列恒 0 占位——2026-10-12 W1 裁：行数从 staging 直出，勿读本列）。

  - name: fct_transfer_item
    description: >-
      总仓配送出库商品粒度构件（W1 2026-10-12；服务 06-03 商品出库毛利率）。粒度
