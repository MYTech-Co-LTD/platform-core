        description: 商品部门（经 dim_item **最新快照**取；取不到记 `(未映射)`，不丢弃）。粒度键。水果/标品筛选即按此列。
        tests: [{not_null: {}}]
      - name: total_p
        description: 该 (账套,月,部门) 全部供应商的净采购额合计（**含负数供应商**）。
        tests: [{not_null: {}}]
      - name: supplier_count
        description: 参与排名的供应商数（全部，含负数）。供消费面判断样本量。
        tests: [{not_null: {}}]
      - name: top5_p
        description: 净额 **> 0** 的供应商按净额降序取前 5 的合计。**与 lemeng:purchase:cr5 的分子同源**。客户文档「净采购为负的供应商单列」⇒ 不进分子。
        tests: [{not_null: {}}]
      - name: top10_p
        description: 前 10 的合计（同 top5 的口径）。CR10 备用，未声明指标。
        tests: [{not_null: {}}]


  - name: fct_retail_quantity
    description: >-
      零售净销量构件（#769 2026-10-17）。客户项 03-07 库存覆盖天数的**分母**。
      粒度 (system_book, bizday, branch_num, item_num) —— 2026-10-17 由门店级**扩到商品级**（覆盖天数的
      客户粒度是「门店×商品×单位」，分母必须同粒度；门店级汇总照常可求和对表达式）。
      ⚠️ 与本族净**额**指标**基面不同**：净额自 2026-10-17 起**已减退货**（#813，按退货单自身 bizday，
      且只收 state='FINISHED' ⇒ REPAID_RETURN 不计）；本构件按客户原文 `sale_num − return_num`，
      退货谓词是 `like '%RETURN%' AND state in ('FINISHED','REPAID')` ⇒ **含 REPAID_RETURN**。
      两个谓词**刻意不同**，别合并（净额复现乐檬 return_money，净销量复现乐檬 return_num）。
      **必须减退货**——故单开一张 mart，见模型头注。⚠️ `quantity` 对退货行也是正数，分类靠单据类型不靠符号。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests: [{not_null: {}}]
      - name: org
        description: 主体列（subject_org 宏注入）。
        tests: [{not_null: {}}]
      - name: bizday
        description: 业务日。粒度键。
        tests: [{not_null: {}}]
      - name: branch_num
        description: 门店号。粒度键。
        tests: [{not_null: {}}]
      - name: item_num
        description: 商品号（**text 形态**——本职与 `fct_purchase.item_num`(bigint) 类型不同，跨表 join 要显式 cast）。粒度键。
        tests: [{not_null: {}}]
      - name: sale_quantity
        description: 销售数量（state=FINISHED 且 SALE_ORDER）。
        tests: [{not_null: {}}]
      - name: return_quantity
        description: 退货数量（单据类型含 RETURN 且 state ∈ FINISHED/REPAID）。
        tests: [{not_null: {}}]
      - name: net_quantity
        description: 净销量 = sale − return。**与 lemeng:retail:net_quantity 同源**。
        tests: [{not_null: {}}]

