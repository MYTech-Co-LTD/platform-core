# sources.yml — 乐檬域（零售 + 维度）的**落地声明**（对象存储上的 parquet 湖，不是 PG 表）。
#
# ⚠️ 两个必须先读的口径（否则会把本文件当成 dbt 的运行时接口）：
#
# 1. **`source()` 不是读路径**。本仓的读路径是 pg_duckdb 的 `read_parquet()`（staging 模型里直写），
#    而 dbt 跑在 **dbt-postgres** 适配器上：`{{ source('lemeng','retail_order_line') }}` 会被渲染成
#    `"db"."schema"."table"` 这种 PG 关系名 —— 湖上没有那个关系，渲染出来必然查不到。
#    （能直接读 parquet 的是 **dbt-duckdb** 适配器，走 source 的 `external_location`；本仓不用它。）
#    ⇒ 本文件的 `source` 声明是**声明与血缘的落点**，它的消费者是
#      ① 静态门禁 `scripts/check-data-models.mjs`（④ staging 一对一的另一半）
#      ② 人（这份清单本身就是「这个域有哪些源」的事实源）
#    ⚠️ 「声明 ↔ 实际读的 s3 路径一致」这条（spec §10 门禁③ 的对应物）**当前没有机检** —— 路径由
#       `read_parquet()` 的字符串拼出、还带 var，静态对不上。属**明确不做**，不是漏检（见 dbt/README.md）。
#
# 2. **命名是硬约束**：staging 模型名 = `stg_<source 的 name>_<table 的 name>`（例：`stg_lemeng_retail_order_line`
#    ← 本文件的 `lemeng`.`retail_order_line`）。④ 是**双向**机检：源没有 staging 模型违规，
#    staging 模型没有源也违规。改名要两处一起改。
version: 2

sources:
  - name: lemeng
    description: >-
      乐檬域（零售 + 维度；对象存储 parquet 湖）。账套 = 主体维度（3120 熊喵 / 64188 品品甜）。
      出处：docs/data-platform-handbook.md §2。
      ⚠️ 本 source 下每张表**各有一套**路径约定（都是新湖 hive 命名）：路径与分区的**事实源是各表
      自己的 `meta`**（`path_convention` / `partition_keys` …），没有 source 级通用约定可依赖。
      旧湖 `retail_detail`（非 hive、全 VARCHAR）的声明已随 2026-10-06 的仓内退役删除
      （湖上前缀仍在被写、未下线，见 handbook §2 的旧前缀行）。
    tables:
      - name: retail_order_line
        description: '零售订单明细行（新湖，2026-09-24 契约）：hive 三级分区 system_book/bizday/hour，落盘即定型（numeric/timestamp/date），作废单照采。'
        meta:
          path_convention: 'lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'
          # 读路径不是 source()（见文件头 1），这里是**人读的**说明。⚠️ 写的是本仓 staging 的
          # **实测生效形态**（函数别名 r + 位置参数，无命名形参）：
          #   · pg_duckdb 把 `read_parquet(...)` 暴露成 **PG 函数**，只认位置参数 ⇒ 命名形参递不进去。
          #     2026-09-24 真机实测原文：`… , hive_partitioning = 1)` →
          #       `ERROR:  column "hive_partitioning" does not exist`；
          #     `… , hive_partitioning := 1)` →
          #       `ERROR:  function read_parquet(unknown, hive_partitioning => integer) does not exist`。
          #     **别把 `hive_partitioning=1` 写回来** —— 它在这条栈上不可执行（不是风格问题）。
          #   · 分区推断本身仍生效（DuckDB 默认 hive_partitioning=auto，路径 `key=value` 段自动成列），
          #     故不需要显式开关；但推断出的类型**不合约**（system_book→bigint、hour→varchar），
          #     定型落在 staging 的**显式 cast**里（不是 hive_types —— 那个形参同样递不进去）。
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/lemeng/retail_order_line/system_book=*/**/*.parquet') r"
          partition_keys: ['system_book', 'bizday', 'hour']
          partition_key_typing: '由路径字符串重推断；三列在 staging 显式 cast（system_book::varchar / bizday::date / hour::int）'
          pagination: '新湖由 duckle 管线写入（🔴 2026-09-29 改向：**在用的** L1 子管线 `deploy/duckle/console/pipelines/lemeng.retail_order_line.window.json`；原指已退役的 `duckle/common/lemeng.retail_order_line.json`）'

      - name: branch
        description: '乐檬门店维（新湖，2026-09-25 契约）：**全量快照**（不是增量），hive 两级分区 system_book/snapshot，落盘即定型（integer/varchar/boolean/date）。两账套各采各的；改名/停用靠快照自愈，没有游标。'
        meta:
          path_convention: 'lemeng/dim_branch/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet'
          # 读路径不是 source()（见文件头 1）。形态与上面 retail_order_line 同源：函数别名 r +
          # 位置参数（命名形参在 pg_duckdb 上递不进去，原文见上一张表的注释）。
          # 与零售的**唯一差异**：路径段写 `*/snapshot=**/` 而不是钉单账套 —— 门店维在 dbt 侧
          # 一个模型读两个账套分区（`system_book` 是**列**，不需要按账套分 var）。
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_branch_prefix\") }}/*/snapshot=**/all.parquet') r"
          partition_keys: ['system_book', 'snapshot']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / snapshot::date）'
          pagination: '新湖由 duckle 管线写入（🔴 2026-09-29 改向：**在用的** L0 管线 `deploy/duckle/console/pipelines/lemeng.dim.branch.l0.json`；原指已退役的 `duckle/common/lemeng.branch.json`）：N 个显式页节点 + ctl.merge，末页挂 ctl.die 哨兵（无 total 字段 ⇒ 只能页空即止）'

      - name: item
        description: '乐檬商品维（新湖，2026-09-25 契约）：**全量快照**（不是增量），hive 两级分区 system_book/snapshot，落盘即定型（varchar/boolean/integer/bigint/decimal(18,8)/date）。两账套档案各自完整保留；列集 = **3 注入列 + 89 标量列 + 16 摊平列 = 108 列**（摊平的是 3 个嵌套对象：item_department 3 / item_category 9 / item_brand 4），6 个数组/深层对象按投影规则丢弃（见契约 description）。'
        meta:
          path_convention: 'lemeng/dim_item/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet'
          # 读路径不是 source()（见文件头 1）。形态与上面 branch 同源：函数别名 r + 位置参数
          # （命名形参在 pg_duckdb 上递不进去，原文见 retail_order_line 那段的注释）。
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_item_prefix\") }}/*/snapshot=**/all.parquet') r"
          partition_keys: ['system_book', 'snapshot']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / snapshot::date）'
          pagination: '新湖由 duckle 管线写入（🔴 2026-09-29 改向：**在用的** L0 管线 `deploy/duckle/console/pipelines/lemeng.dim.item.l0.json`；原指已退役的 `duckle/common/lemeng.item.json`）：150 个显式页节点（149 数据页 + 1 哨兵页）+ ctl.merge，末页挂 ctl.die 哨兵（无 total 字段 ⇒ 只能页空即止；真阈值 149×200 = 29,800 条/账套）'

      - name: item_price
        description: '乐檬**门店商品应用价**（新湖，2026-10-08 契约，#481 价格批）：**全量快照**（last_edit_time 传滚动 2 年窗起点——网关上限 10310217 随「今天」滚），hive 两级分区 system_book/snapshot，落盘即定型。行粒度 = 账套 × 快照日 × 门店 × 商品(×分级)；接口 nhsoft.retail.ai.branchitem.realprice.find 单发无分页。'
        meta:
          path_convention: 'lemeng/item_price/system_book=<账套>/bizday=<YYYY-MM-DD>/{all,bf-*}.parquet'
          # 读路径不是 source()（见文件头 1）；`*/snapshot=**/` 一个模型读两个账套（同 branch/item）。
          # ⚠️ 前缀刻意叫 item_price 不叫 dim_item_price：生产者判定按子串匹配，dim_item_price
          #    会撞 dim_item 契约（见 dbt_project.yml 同名 var 的注）。
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_item_price_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / bizday::date）'
          pagination: '新湖由 duckle 管线写入（#481 R1 增量模型）：**逐店一节点 + 请求侧增量水位**（last_edit_time；响应 KB 级/天）→ ctl.merge → 单文件覆盖写；backfill 管线另有打包/大店段扇出（bf 同层文件）；生成器 scripts/lemeng/gen-item-price-pipeline.mjs，不手编'

      - name: transfer_out
        description: '乐檬**配送调出单**（新湖，2026-10-08 契约，#499/R2）：行 = 配送单商品行；查询窗=制单日单日、每分区写一次不重写；接口 nhsoft.ama.ai.transfer.out.order.find 静态页扇出（p9 哨兵）。采集范围仅 3120 主账套。'
        meta:
          path_convention: 'lemeng/transfer_out/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_transfer_out_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / bizday::date）'
          pagination: '新湖由 duckle 管线写入（#499/R2）：静态页扇出 p1..p8 + p9 哨兵（>800 单/日大声红）+ ctl.merge + flatten（UNNEST items 成行粒度，销售明细子管线同款）；生成器 scripts/lemeng/gen-transfer-out-pipeline.mjs，不手编'

      - name: wholesale_out
        description: '乐檬**批发销售单**（新湖，2026-10-08 契约，#499/R3）：行 = 批发单商品行；查询窗=制单日单日（date_type=制单时间——⚠️ 2026-10-08 组合反转实测订正（#513）：短词「制单/审核」被静默忽略返回全史，正确值恰是「制单时间」）、每分区写一次不重写；接口 nhsoft.whs.ai.wholesaleorder.find limit/offset 分页。发货方=3120，收货方=品品甜等外部批发客户。'
        meta:
          path_convention: 'lemeng/wholesale_out/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_wholesale_out_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / bizday::date）'
          pagination: '新湖由 duckle 管线写入（#499/R3）：静态页扇出（limit/offset，p19 哨兵 >1800 单/日大声红）+ ctl.merge + flatten（UNNEST wholesale_order_details）；生成器 scripts/lemeng/gen-wholesale-out-pipeline.mjs，不手编'

      - name: branch_expense
        description: '乐檬**门店费用单**（新湖，2026-10-13 契约，W2）：行 = 费用单；查询窗=审核日单日（date_from/date_to 完整时分秒）、ama 族 page_number/page_size 分页；接口 nhsoft.ama.ai.branch.expense.find。归属店=branch_num（operate_branch_num=结算方）；direction 中文名（应付/应收）；due_amount 红字保留。'
        meta:
          path_convention: 'lemeng/branch_expense/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_branch_expense_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '新湖由 duckle 管线写入（W2）：静态页扇出（page_number/page_size，哨兵同构）+ ctl.merge'

      - name: client_expense
        description: '乐檬**客户费用单**（新湖，2026-10-13 契约，W2）：行 = 客户费用单；查询窗=审核日单日（date_type=审核时间、区间 ≤7 天硬限）、whs 族 offset/limit 分页（返回 {count,content}）；接口 nhsoft.whs.ai.otherinout.find。other_inout_flag: false=应付/true=应收（真样本实证）；归属客户=client_fid（前导零字符串）。'
        meta:
          path_convention: 'lemeng/client_expense/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_client_expense_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '新湖由 duckle 管线写入（W2）：静态页扇出（offset/limit，哨兵同构）+ ctl.merge'

      - name: request_order
        description: '乐檬**request_order**（新湖，2026-10-13 契约，W3）：行=要货单商品行；窗口=制单日单日（start_date/end_date 裸日期、ama 族 page_number 分页）；接口 nhsoft.ama.ai.request.order.find。要货满足率的需求面（D16 调入=供给面）。'
        meta:
          path_convention: 'lemeng/request_order/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_request_order_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '新湖由 duckle 管线写入（W3）：ama 族 page_number/page_size 静态页扇出 + 哨兵 + ctl.merge'

      - name: transfer_in
        description: '乐檬**transfer_in**（新湖，2026-10-13 契约，W3）：行=调入单商品行；窗口=制单日单日（start_date/end_date 裸日期、ama 族 page_number 分页）；接口 nhsoft.ama.ai.transfer.in.order.find。related_order_no 关联调出单 MO…（要货满足率供给面 join 键）。'
        meta:
          path_convention: 'lemeng/transfer_in/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_transfer_in_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '新湖由 duckle 管线写入（W3）：ama 族 page_number/page_size 静态页扇出 + 哨兵 + ctl.merge'

      - name: inventory_snapshot
        description: '乐檬**inventory_snapshot**（新湖，2026-10-13 契约，W3，#632 订正）：行=仓库×商品库存快照；查询窗=bizday 单日（**T-2 可得**——源端发布滞后 16~40h，T-1 通常未发布；**历史深可回溯，漏夜可补**；初版「T-1/不可回溯」描述被实测证伪）；接口 nhsoft.ama.ai.inventory.snapshot.find。快照无批号/到期日。'
        meta:
          path_convention: 'lemeng/inventory_snapshot/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_inventory_snapshot_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '新湖由 duckle 管线写入（W3）：ama 族 page_number/page_size 静态页扇出 + 哨兵 + ctl.merge'


      - name: item_purchase
        description: '乐檬**采购分析**（新湖，W3 余项 2026-10-13 契约，#640）：行=账套×bizday×供应商×商品（summary 型，无 branch/audit_date 列）；接口 nhsoft.report.ai.itempurchase.find。⚠️ branch_nums=[99] 固定（门店配送制不采购）；窗口 ≤31 天硬限；无翻页但响应带 total_count（管线作截断守卫）；无滞后 ⇒ 窗口 T-1 单日。'
        meta:
          path_convention: 'lemeng/item_purchase/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_item_purchase_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '无翻页（report 族 page_number 不支持）⇒ 单次全量；响应 {result:{total_count,rows[]}}，管线断言 len(rows)==total_count'

      - name: wholesale_return
        description: '乐檬**批发退货单**（新湖，2026-10-12 契约，W1）：行 = 退货单商品行；查询窗=制单日单日（date_type=制单时间，#513 同族坑）、区间 ≤7 天接口硬限（2026-10-12 实测）、每分区写一次不重写；接口 nhsoft.whs.ai.wholesalereturn.find limit/offset 分页（p19 哨兵同构）。⚠️ A 阶段探针恒空集（接口可达无业务样本）——明细键名未获真样本实证（契约 description 详）；单头列随行冗余，聚合前 per_order 取 max。'
        meta:
          path_convention: 'lemeng/wholesale_return/system_book=<账套>/bizday=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_wholesale_return_prefix\") }}/*/bizday=**/*.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / bizday::date）'
          pagination: '新湖由 duckle 管线写入（W1）：静态页扇出 p1..p18 + p19 哨兵（wholesale_out 同构派生）+ ctl.merge + flatten（UNNEST wholesale_return_details）'

      - name: client
        description: '乐檬**批发客户档案**（新湖，2026-10-10 契约，#516 段①）：全量快照（GET 零参数固定窗——例外路线证据见正典 §1.7；窗口跟随活档案，2026-10-10 实测 707 条且已知 41 个 WO 客户 41/41 在窗内），hive 两级分区 system_book/snapshot。行粒度 = 账套 × 快照日 × 客户。接口 nhsoft.whs.ai.client.find GET 裸码路径单页（limit/offset/keyword 全无效）。'
        meta:
          path_convention: 'lemeng/client/system_book=<账套>/snapshot=<YYYY-MM-DD>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_client_prefix\") }}/*/snapshot=**/all.parquet') r"
          partition_keys: ['system_book', 'snapshot']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast（system_book::varchar / snapshot::date）'
          pagination: '新湖由 duckle 管线写入（#516 段①）：**单页固定窗**（GET 零参数路由无翻页；行数带守卫 die：0 行或 <500 拒写湖）+ ctl.merge；生成器 scripts/lemeng/gen-client-pipeline.mjs，不手编'
      - name: recon_source
        description: '乐檬**口径对账的源侧快照**（新湖，2026-10-19 契约，issue #920）：**只装源侧**——乐檬报表引擎（nhsoft.report.ai.itemsales.find）逐店返回的 `sale_money` / `return_money`。**不含平台侧、不做比较、不含任何口径**：平台侧由 dbt 从构件 `fct_retail_sale` 取、比较由 dbt `recon_break` 做（不变量见 docs/architecture.md §4.1 B11）。hive **三级**分区 system_book/bizday/chunk——chunk 是绕端点「branch_nums 单次 ≤100 家、超出 code=10001」硬限的切块维度（64188 有 129 家、3120 有 271 家）。行粒度 = 账套 × 对账业务日 × 块 × 门店。'
        meta:
          path_convention: 'lemeng/recon_source/system_book=<账套>/bizday=<日期>/chunk=<块号>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_recon_source_prefix\") }}/*/bizday=**/chunk=*/all.parquet') r"
          partition_keys: ['system_book', 'bizday', 'chunk']
          partition_key_typing: '由路径字符串自动推断（hive）；staging 显式 cast（system_book::varchar / bizday::date / chunk_no::int）'
          pagination: '由 duckle **父/子管线**写入：父 lemeng.recon.preagg 按 ≤100 家切块（itemKey=item_key，各块独立水位）→ 子 lemeng.recon.preagg.item 逐块跑并写自己的 chunk 分区'



      - name: loss_adjustment
        description: '乐檬**库存调整单**（#1047 P1 2026-10-25 契约）：行 = 调整单；查询窗=制单日期族（纯 yyyy-MM-dd）；接口 nhsoft.ama.ai.adjustment.order.find。报损三类 cause（来货损/自然损/试吃）direction=出库；result 数组无 count ⇒ 哨兵页翻页。'
        meta:
          path_convention: 'lemeng/loss_adjustment/system_book=<账套>/bizday=<日期>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_loss_adjustment_prefix\") }}/system_book=*/bizday=*/all.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '静态页扇出（page_number/page_size=100，哨兵同构）+ ctl.merge；result 数组无 count'

      - name: member_summary
        description: '乐檬**会员销售汇总**（#1047 P5 2026-10-25 契约）：行 = 门店×营业日×订单类型汇总；接口 nhsoft.report.ai.customeranalysissummary.find；**无分页**（responsePath=/result/rows）；branch_nums 必传 ≤100 家 ⇒ 四批静态扇出。会员口径=全部 order_sale_type 的 customer_vip_* 合计。'
        meta:
          path_convention: 'lemeng/member_summary/system_book=<账套>/bizday=<日期>/all.parquet'
          access_path: "read_parquet('s3://{{ var(\"zos_bucket\") }}/{{ var(\"lemeng_member_summary_prefix\") }}/system_book=*/bizday=*/all.parquet') r"
          partition_keys: ['system_book', 'bizday']
          partition_key_typing: '由路径字符串重推断；两列在 staging 显式 cast'
          pagination: '无分页（page_number 报不支持）；单请求全量'
