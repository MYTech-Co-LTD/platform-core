# schema.yml — marts 层的模型描述 + dbt tests（layered §4 步骤 4）。
#
# ⚠️ **L1 语义声明不在这里**，在 `dbt/semantics/l1_metrics.yml`。为什么（一句话）：
#   指标名的命名空间形态是 `<源>:<业务域>:<指标>`（`lemeng:retail:net_sales`），而 **dbt 资源名不允许冒号**
#   ⇒ 把带冒号的 `name` 放进 dbt 会扫的 schema 文件里，有让 `dbt parse` 挂掉的风险。
#   详细理由、以及「T6 若证实 dbt 接受带冒号的名字可并入本文件」的核对步，见 dbt/README.md
#   「L1 语义声明的落点」。静态门禁**两处都扫**（`dbt/semantics/**` 与 `dbt/models/**`），
#   所以两种落点都不会漏检。
#
# 本文件的两类断言（都不替代对账：对账是 `dbt/tests/audit_*.sql` 的独立复算）：
#   · 列级 `tests:`（dbt 原生，`not_null` / `accepted_values`）——钉「这一列该有的形状」
#   · 结构断言（singular test）——钉「单列约束抓不住的形状」，如**复合粒度的唯一性**与金额范围
version: 2

models:
  - name: fct_retail_sale
    description: >-
      零售销售事实（口径模型）。粒度 **(system_book, bizday, branch_num)**（2026-10-12 W0 由两键扩到三键）；
      口径只在此定义一次（现行口径 = #430 换货半边公式，见模型头注）。
      指标声明见 dbt/semantics/l1_metrics.yml（L1 事实源）。
      含**主体列 `org`**（由 subject_org 宏注入常量，见 dbt/macros/subject_org.sql）；粒度不受它影响 ——
      每个租户物化进自己的 schema，relation 内 org 恒为单值。
      ⚠️ **本文件的 description 里不许写「双大括号 + 宏名 + 括号」那种 Jinja 调用**（连当反例写也不许）：
      description 在**解析期**就会被渲染，而那时的上下文里**项目 macro 不可见** ⇒ `dbt parse` 直接报
      `'<宏名>' is undefined`。2026-09-26 实测：上面这句里曾那样写过一次，把物化 job 打红。
      要说明「由哪个宏注入」，就只写**宏名**（反引号里那个），别写成调用形态。
    columns:
      - name: system_book
        description: 账套（主体维度，3120 熊喵 / 64188 品品甜）。**已实证**——身份跟着数据走：值来自**路径**（新湖 hive 分区键 `system_book=<账套>/` 被 read_parquet 自动推断成列，staging 只把它 `::varchar` 定型；2026-09-24 真机 dbt run 通过）。（「由 `account_book` var 供值」那套只存在于双轨期的旧湖 `stg_lemeng_retail_detail` 里；该文件与其两条 var 已于 2026-10-06 随仓内退役删除。）
        tests:
          - not_null
          # 账套是**自己控制的枚举**（公司标准 §4.1 的主体清单——**该标准尚未合入**），故用 accepted_values 钉死；
          # 新增账套要改这里（有意的摩擦：账套集合变了是件该被看见的事）。
          - accepted_values:
              values: ['3120', '64188']
      - name: org
        description: '主体列 = 该部署租户的 casdoor_org（经 env `LEMENG_SUBJECT_ORG` 注入，值不落仓）。本模型由 `subject_org` 宏注入常量（宏名不是调用 —— 见模型 description 里的那条警告）；不参与口径，每个租户物化进自己的 schema ⇒ **单个 relation 内恒为单值**，故模型粒度仍写作 (system_book, bizday, branch_num)。行级授权谓词 `WHERE org = …` 的着力点（modules/data/domain/authz.ts）。'
        tests:
          - not_null
      - name: bizday
        description: 业务日。**新湖（现行）**：列名就是 `bizday`，是 **hive 分区键**（路径 `bizday=<日期>/` 推断）且**落盘即定型为 DATE**（管线侧由 shift_table_bizday 定型）——`order_detail_bizday` 与 `%Y%m%d` 是**旧湖** `stg_lemeng_retail_detail` 的形态（该文件已于 2026-10-06 仓内退役），不再是本模型的来源。
        tests:
          - not_null
      - name: branch_num
        description: 门店号（账套内编号；粒度第三键，2026-10-12 W0 加入——65 项指标体系的零售侧要下钻到店）。取自 staging 同名列透传（int 已定型）。
        tests:
          - not_null
      - name: net_amount
        description: 净销售额（#430 平台口径：FINISHED+SALE_ORDER 基面 + 换货「送出半边」公式 + 赠品判别式排除，详见模型头注）。**与 l1_metrics.yml 的 `lemeng:retail:net_sales` 同源**。
        tests:
          # 金额范围是结构断言（singular test）而不是列级 test：dbt 原生的 accepted_values 只判等值
          # 集合，判不了「≥ 0」这种区间；引 dbt_utils 又要加 packages.yml（多一层依赖 + 解析期要联网）。
          # 见 dbt/tests/assert_fct_retail_sale_net_amount_nonnegative.sql
          - not_null
      - name: order_count
        description: 有效订单数 = 同基面（FINISHED+SALE_ORDER）count(distinct 单号)。**与 l1_metrics.yml 的 `lemeng:retail:order_count` 同源**。
        tests:
          - not_null


  - name: fct_hq_outbound
    description: >-
      总仓出库构件长表（W1 2026-10-12）：transfer/wholesale 双域的 R/C/G 构件唯一落点
      （跨 D01+D02−D03 三份湖表，L1 单 FROM 约束的 marts 解）。粒度 (system_book, bizday,
      domain, branch_num, region_id)；口径见模型头注（transfer 基面排除店间直调；wholesale 侧
      退货店日级相减防 per_order join 放大；R 用行级 out_money=裁8 experimental）。
      region_id = X01 未就位的回落（dim_branch 最新快照，未映射=0，种子语义）。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests:
          - not_null
      - name: org
        description: 主体列（subject_org 宏注入；relation 内恒单值）。
        tests:
          - not_null
      - name: bizday
        description: 业务日（=制单/采集分区日）。粒度键。
        tests:
          - not_null
      - name: domain
        description: 域（transfer=配送出库 / wholesale=批发）；客户文档 01-01 禁混加，比例类按域分母。
        tests:
          - not_null
      - name: branch_num
        description: 收货门店号（transfer=调入店；wholesale=单头门店）。粒度键。
        tests:
          - not_null
      - name: region_id
        description: 战区（X01 回落 dim_branch 最新快照；0=未映射单列）。粒度键。
        tests:
          - not_null
      - name: r_net
        description: R 出库净额构件（transfer=Σ行 out_money；wholesale=单头 total 和−退货单头 total 和）。**与 lemeng:outbound:net_amount 同源**。
        tests:
          - not_null
      - name: c_cost
        description: C 成本构件（transfer=Σ subtotal=成本小计；wholesale=单头 cost 和−退货 cost 和）。**与 lemeng:outbound:gross_profit 的减数同源**。
        tests:
          - not_null
      - name: g_gross
        description: G 毛利构件 = r_net − c_cost。**与 lemeng:outbound:gross_profit / gross_margin_rate 分子同源**。
        tests:
          - not_null
      - name: order_count
        description: 域内去重单数（04-01 面之一；transfer 侧与 lemeng:transfer:order_count 同源）。
        tests:
          - not_null
      - name: line_count
        description: 预留行数列（transfer 行数面 W1 以独立指标承载，本列恒 0 占位——2026-10-12 W1 裁：行数从 staging 直出，勿读本列）。

  - name: fct_transfer_item
    description: >-
      总仓配送出库商品粒度构件（W1 2026-10-12；服务 06-03 商品出库毛利率）。粒度
      (system_book, bizday, item_num)；基面与构件口径同 fct_hq_outbound 的 transfer 域（行级
      out_money/subtotal）。只 transfer 域——批发侧商品毛利受「明细成本须与单头勾稽」约束
      （客户文档 06-03 数据条件），随 D02 v2 勾稽另批。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests:
          - not_null
      - name: org
        description: 主体列（宏注入）。
        tests:
          - not_null
      - name: bizday
        description: 业务日。粒度键。
        tests:
          - not_null
      - name: item_num
        description: 商品内部编号。粒度键。
        tests:
          - not_null
      - name: r_net
        description: R 构件（商品日）。
        tests:
          - not_null
      - name: c_cost
        description: C 构件（商品日）。
        tests:
          - not_null
      - name: g_gross
        description: G 构件 = r_net − c_cost。**与 lemeng:transfer:item_gross_margin_rate 同源**。
        tests:
          - not_null

  - name: fct_transfer_line_quality
    description: >-
      总仓配送出库行质量构件（W1 2026-10-12；服务 04-05/04-06/04-07 的 L1 落点）。粒度
      (system_book, bizday, branch_num)；基面同 fct_hq_outbound 的 transfer 域。口径逐列见模型头注
      （批号率全量版待 X08；零成本与缺成本不相加；负金额不按绝对值变正收入）。
      wholesale 侧行质量面随 D02 v2 勾稽批次另出。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests:
          - not_null
      - name: org
        description: 主体列（宏注入）。
        tests:
          - not_null
      - name: bizday
        description: 业务日。粒度键。
        tests:
          - not_null
      - name: branch_num
        description: 调入门店号。粒度键。
        tests:
          - not_null
      - name: line_count
        description: 审核出库明细行数（04-05 分母构件）。
        tests:
          - not_null
      - name: lot_filled_lines
        description: 批号非空行数（04-05 分子构件；空白串视为未填）。
        tests:
          - not_null
      - name: zero_cost_amount
        description: 零成本暴露金额（金额≠0 且成本=0）。**与 lemeng:transfer:zero_cost_exposure_amount 同源**。
        tests:
          - not_null
      - name: zero_cost_rows
        description: 零成本暴露行数（行数面 L2/消费层用）。
        tests:
          - not_null
      - name: missing_cost_amount
        description: 缺成本金额（成本 null 且金额≠0；与零成本**不相加**——客户文档「null 不当 0」）。
        tests:
          - not_null
      - name: negative_order_count
        description: 负金额单数（单头口径）。**与 lemeng:transfer:negative_order_count 同源**。
        tests:
          - not_null
      - name: negative_amount
        description: 负金额合计（保留负号；不按绝对值变正收入）。
        tests:
          - not_null

  - name: fct_branch_expense
    description: >-
      门店费用构件（W2 2026-10-13）。粒度 (system_book, bizday, branch_num, expense_type)；
      基面 = 全部审核费用单（管线请求侧筛 state_code=3）。构件列 ep/er/e_net 语义见模型头注
      （e_net 符号语义待裁9 客户回签 ⇒ 全表指标 experimental）。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests: [{not_null: {}}]
      - name: org
        description: 主体列（宏注入）。
        tests: [{not_null: {}}]
      - name: bizday
        description: 费用审核日。粒度键。
        tests: [{not_null: {}}]
      - name: branch_num
        description: 归属门店号。粒度键。
        tests: [{not_null: {}}]
      - name: expense_type
        description: 费用项目名（补损/补贴类筛选键）。粒度键。
        tests: [{not_null: {}}]
      - name: ep_payable
        description: 应付合计构件（EP）。
        tests: [{not_null: {}}]
      - name: er_receivable
        description: 应收合计构件（ER）。
        tests: [{not_null: {}}]
      - name: e_net
        description: 净费用构件 = ep − er。**与 lemeng:expense:branch_net 同源**。
        tests: [{not_null: {}}]
      - name: bill_count
        description: 去重费用单数（单数面，未声明指标）。
        tests: [{not_null: {}}]

  - name: fct_client_expense
    description: >-
      客户费用构件（W2 2026-10-13）。粒度 (system_book, bizday, client_fid, other_inout_kind)；
      基面同上。flag: false=应付/true=应收（真样本实证）。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests: [{not_null: {}}]
      - name: org
        description: 主体列（宏注入）。
        tests: [{not_null: {}}]
      - name: bizday
        description: 费用审核日。粒度键。
        tests: [{not_null: {}}]
      - name: client_fid
        description: 客户编号（前导零字符串）。粒度键。
        tests: [{not_null: {}}]
      - name: other_inout_kind
        description: 费用项目名。粒度键。
        tests: [{not_null: {}}]
      - name: ep_payable
        description: 应付合计构件（EP）。
        tests: [{not_null: {}}]
      - name: er_receivable
        description: 应收合计构件（ER）。
        tests: [{not_null: {}}]
      - name: e_net
        description: 净费用构件 = ep − er。**与 lemeng:expense:client_net 同源**。
        tests: [{not_null: {}}]
      - name: bill_count
        description: 去重费用单数。
        tests: [{not_null: {}}]


  - name: fct_contribution
    description: >-
      费用后贡献组合构件（#744 W2 2026-10-17）。**它存在的唯一理由**：L1 的 `select_sql` 形状契约
      是「`select <聚合表达式> as value, <维度…> from <单一关系>`」——**`from` 只能一个关系**，
      跨域口径必须先落成 mart 才写得出声明。粒度 (system_book, bizday, domain, branch_num, region_id)
      与 fct_hq_outbound **逐字同粒度**；口径与边界（门店费用只挂 transfer 域、战区维度的既存边界、
      补损/补贴取值按真机实测字面量）见模型头注。
      ⚠️ **门店级与总仓级的 E 口径不同**（门店级只有门店费用；总仓级才是客户文档的 N=R−C−E 全量口径）
      ——引用前先读头注，别把两者混用。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests: [{not_null: {}}]
      - name: org
        description: 主体列（subject_org 宏注入；relation 内恒单值）。
        tests: [{not_null: {}}]
      - name: bizday
        description: 业务日。粒度键（出库侧制单日）。
        tests: [{not_null: {}}]
      - name: domain
        description: 域。粒度键。**三值**：`transfer`（配送出库）/ `wholesale`（批发）/ `expense`（**只有费用、当天无对应出库**的门店日，R/C/G 恒 0、N=−E）。后一类必须保留，否则总仓级 N 的 E 少算（真机实测 53 个组合）。**保留不折叠**——两域 branch_num 语义不同（见头注）。
        tests: [{not_null: {}}]
      - name: branch_num
        description: 门店号。粒度键。**语义随域变**：transfer=调入门店（可与 fct_branch_expense 对齐）；wholesale=发货方编号（99=管理中心）；expense=费用归属门店。
        tests: [{not_null: {}}]
      - name: region_id
        description: 战区。粒度键。wholesale 行由 branch_num=99 回落 dim_branch ⇒ **幻影战区**（真机实测全部批发落进 9046，与 12 个真战区不重叠）；expense 行恒 **0**（无出库可归属）。⇒ 战区级口径必须走 `*_store` 列（见头注）。
        tests: [{not_null: {}}]
      - name: r_net
        description: R 出库净额构件（出库侧原样透传）。**与 lemeng:outbound:net_amount 同源**。
        tests: [{not_null: {}}]
      - name: c_cost
        description: C 成本构件（原样透传）。
        tests: [{not_null: {}}]
      - name: g_gross
        description: G 毛利构件 = r_net − c_cost（原样透传）。
        tests: [{not_null: {}}]
      - name: e_net
        description: E 门店费用净额构件（= fct_branch_expense.e_net 按 账套×业务日×门店 汇总）。**wholesale 行恒 0**（门店费用只挂 transfer 域，见头注）。
        tests: [{not_null: {}}]
      - name: q_loss
        description: 补损分量（expense_type = `产品售后补损` 的 e_net）。wholesale 行恒 0。服务 02-07/07-05 的分子。
        tests: [{not_null: {}}]
      - name: q_subsidy
        description: 补贴分量（expense_type = `抖音直播补贴` 的 e_net）。wholesale 行恒 0。服务 03-04 的分子。
        tests: [{not_null: {}}]
      - name: n_net
        description: N 费用后贡献构件 = r_net − c_cost − e_net。**与 lemeng:contribution:net_amount 同源**。⚠️ 单行值在 wholesale 行上 e_net=0 ⇒ 该行的 N 只是 R−C；「总仓级 N」是**全表求和**的结果。
        tests: [{not_null: {}}]
      - name: r_net_store
        description: 门店域 R（**transfer-only**；wholesale 行恒 0）。战区级/门店级口径的分母。⚠️ 为什么必须单列：批发的 region_id 是幻影战区（真机实测全部落进 region_id=9046），且批发无法按 client_fid 归战区（出库侧无该列）——见模型头注。
        tests: [{not_null: {}}]
      - name: n_net_store
        description: 门店域 N（**transfer-only**；wholesale 行恒 0）。**与 lemeng:contribution:region_net 同源**。战区级/门店级口径的分子。
        tests: [{not_null: {}}]


  - name: fct_purchase_concentration
    description: >-
      供应商集中度预聚合构件（#744 W3 2026-10-17）。**为什么必须预聚合**：CR5 含「排序取前 5」，
      是子查询语义，塞不进 L1 的单关系聚合形状。粒度 **(system_book, bizday, item_department)**
      —— **月度**（客户文档频率栏「月」；CR5 不可按日累加）。净采购额与 `purchase:net_amount` 同源。
      ⚠️ 与仓里其他日粒度指标**不同粒度**；`bizday` 是月 1 号，不是业务日。
    columns:
      - name: system_book
        description: 账套。粒度键。
        tests: [{not_null: {}}]
      - name: org
        description: 主体列（subject_org 宏注入）。
        tests: [{not_null: {}}]
      - name: bizday
        description: 报告月（业务日所在月的 1 号，date 型）。粒度键。**不是业务日**——本指标按月算，日粒度不可累加。
        tests: [{not_null: {}}]
      - name: item_department
        description: 商品部门（经 dim_item **最新快照**取；取不到记 `(未映射)`，不丢弃）。粒度键。水果/标品筛选即按此列。
        tests: [{not_null: {}}]
      - name: total_p
        description: 该 (账套,月,部门) 全部供应商的净采购额合计（**含负数供应商**）。
        tests: [{not_null: {}}]
      - name: supplier_count
        description: 参与排名的供应商数（全部，含负数）。供消费面判断样本量。
        tests: [{not_null: {}}]
      - name: top5_p
