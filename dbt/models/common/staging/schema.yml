# 两张维度的**行粒度自然键**唯一性由 singular test 手写（单列 `unique` 判不了复合键；
# 引 dbt_utils 要加 packages.yml —— 多一层依赖、解析期还要联网）：
#   dbt/tests/assert_stg_lemeng_branch_key_unique.sql  —— (system_book, snapshot, branch_num)
#   dbt/tests/assert_stg_lemeng_item_key_unique.sql    —— (system_book, snapshot, item_num)
#
# 列级测试的**范围**（有意为之，不是漏做）：只给**自然键列**挂 `not_null`（与
# stg_lemeng_retail_order_line 的形状一致 —— 它也只给同名的两个自然键列挂）。
# 契约里 batch_id / system_book / snapshot 同样 `nullable=false`，但这三列在本层是
# 「路径推断 + cast」的产物，非空性由上游分区结构保证；要不要把它们也升成断言属**独立决定**。
