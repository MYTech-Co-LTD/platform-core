      #   item_department 3 列：item_department_id, item_department_name, item_department_code
      #   item_category   9 列：item_category_code, item_category_en_name, item_category_name, item_category_id, item_category_level, item_category_parent_id, item_category_pinyin, item_category_sort, item_category_tax_code
