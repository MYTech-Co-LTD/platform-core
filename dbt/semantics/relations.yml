# relations.yml —— 语义关系声明（W7 Task 2 事实源）。
#
# 纪律：**每条都必须带 evidence**（命中率 + 抽样日）。命中率 <0.95 不许 verified。
# 维表非唯一时必须写 dedupRule（2026-11-07 实测 stg_lemeng_item ≈42 行/商品，不去重放大 ~41 倍）。
version: 1
relations:
  - name: retail_sale_branch
    from: { relation: fct_retail_sale, column: branch_num }
    to:   { relation: dim_lemeng_branch, column: branch_num }
    cardinality: N:1
    status: verified
    evidence: { matchRate: 1.0, sampledDay: '2026-10-01..2026-11-06', rowsProbed: 571626 }

  - name: retail_item_sale_item
    from: { relation: fct_retail_item_sale, column: item_num }
    to:   { relation: dim_item_latest, column: item_num }
    cardinality: N:1
    dedupRule: latest_snapshot
    status: verified
    evidence: { matchRate: 1.0, sampledDay: '2026-10-20', rowsProbed: 7221, matchedDistinct: 1858 }

  - name: outbound_client
    from: { relation: fct_hq_outbound, column: client_fid }
    to:   { relation: dim_lemeng_client, column: client_fid }
    cardinality: N:1
    status: candidate
    evidence: { matchRate: null, sampledDay: null, note: '待真机测命中率后升 verified' }
