  - name: 'lemeng:expense:branch_net'
    label: 门店净费用
    definition: >-
      门店净费用（E 构件）= 应付合计 − 应收合计。**不可加边界**：更粗粒度求和即净费用之和
      （E 可加）。（符号语义 = 应付 − 应收；**裁9 客户已回签 2026-10-13**。）
      粒度 = 账套 × 审核日 × 门店 × 项目。
    expression: 'sum(fct_branch_expense.e_net)'
    grain: [system_book, bizday, branch_num, expense_type]
    owner: data-platform
    tier: certified
