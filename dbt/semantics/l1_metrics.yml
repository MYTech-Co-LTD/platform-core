  - name: 'lemeng:purchase:item_count'
    label: 采购商品数
    definition: >-
      该窗口内有采购收货的商品**去重数**。⚠️ 非可加：同 supplier_count。
    expression: 'count(distinct fct_purchase.item_num)'
    grain: [system_book, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  # ── 组合族 W1（2026-10-16，#744）：采购退货率 / 零金额采购行 ────────────────────────
  # 两项都是「判据过、源已齐、当时被推给消费面」的悬空指标。均落 fct_purchase 现成列，无新构件。

  - name: 'lemeng:purchase:return_rate'
    label: 采购退货率
    definition: >-
      金额退货率 = 采购退货金额 / 采购收货金额（不可加；上滚=重算/另声明）。零分母 → 不适用
      （sync 自动包 nullif）。服务客户项 05-05「水果采购退货率」与 06-06「采购退货率」——
      客户附录两处公式**逐字相同**（金额退货率＝Σ采购退货金额/Σ采购收货金额），差异只在
      「水果/标品」的**角色部门范围**。⚠️ **部门维度待 W3 随 CR5 一并补**（需 join dim_item 最新
      快照），届时本指标**加 grain 维度**，不另声明第二条——故现阶段本条是**全品类**退货率，
      不能直接当 05-05 或 06-06 的角色口径引用。数量退货率不在本条：客户文档要求「同商品同单位」
      内计算，属消费面。experimental 事由：分母 money_total 与购入/退货分量的勾稽待客户确认
      （同 net_amount 的边界）。
    ratio:
      numerator: 'sum(fct_purchase.purchase_item_return_money)'
      denominator: 'sum(fct_purchase.money_total)'
    grain: [system_book, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:purchase:zero_amount_rows'
    label: 零金额采购行数
    definition: >-
      购入数量 > 0 且购入金额 = 0 的采购行数（客户项 05-08）。赠品**不在此列**（赠品是独立分量，
      见 present_amount）。⚠️ 计数类不可加语义同 supplier_count：跨窗口直接相加即错，须按窗口重算。
      experimental 事由：该形态是「数据质量暴露」而非业务量，客户文档未给阈值口径。
    expression: 'sum(case when fct_purchase.purchase_item_amount > 0 and fct_purchase.purchase_item_money = 0 then 1 else 0 end)'
    grain: [system_book, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  # ── 组合族 W2（2026-10-17，#744）：费用后贡献 / 补损率 / 补贴率 ──────────────────────
  # 落点 = fct_contribution（出库 × 费用的组合构件）。**为什么必须建 mart**：L1 的 select_sql
  # 形状是「select <聚合> as value, <维度…> from <单一关系>」——`from` 只能一个关系，跨域口径
  # 写不出声明。构件头注记了全部边界（门店费用只挂 transfer 域、批发战区的幻影回落等）。

  - name: 'lemeng:contribution:net_amount'
    label: 费用后贡献额（总仓级）
    definition: >-
      N = R − C − E（元），**总仓级全域口径**：R/C 为配送出库与批发合并后的出库构件，E 为门店费用净额。
      服务客户项 01-03「费用后贡献与贡献率」与 08-05「费用后贡献率」的分子侧。
      ⚠️ **与战区级/门店级不是同一口径**：本条的 E 只含**门店费用**，**不含客户费用**——
      客户费用按 client 归集，而出库侧没有 client_fid（#744 Task 0 补记②），两者对不上；
      客户文档 01-03 的完整 E = 门店费用 + 客户费用，**客户费用部分已另补**
      （`client_contribution:net_amount`，2026-10-17，客户级口径）——但那是客户对象的 N，
      与本条总仓级 N 仍是两个口径，**不可相加成一条声明**；两边费用合并的「总仓级完整 N」
      未声明（属消费面 spec 范畴）。
      故本条是「门店费用后」的贡献额，**不是**客户文档定义的完整 N——引用前须知道这条边界。
      粒度 = 账套 × 业务日。
    expression: 'sum(fct_contribution.n_net)'
    grain: [system_book, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'
