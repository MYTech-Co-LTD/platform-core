  # ── 零售订单明细行（2026-10-21 建；2026-10-22 Phase 2 收口权限面）────────────────
  # 下钻绑定的**载体指标**：聚合面答「合计/分布」，下钻面（query_detail）答「多少行 / 哪几行造成的」。
  # 行数唯一权威 = 下钻回包的 rowCountTotal（不是聚合面的 1000 行截断）。
  # 行域统一 `state = 'FINISHED'`（**含退货行**；REPAID / CANCELED 不在）：非 FINISHED 行在聚合面贡献 0；
  #   分组集**不统一**（聚合面可能出现「某店日全为作废行 ⇒ 零值组」，下钻面同一店日是 0 行）。
  #   聚合面把谓词内嵌进 expression（聚合面没有 detail.filter 可用），下钻面写在 detail.filter；
  #   两处**声明**漂移由 scripts/sync-data-semantics.test.ts 的真事实源用例钉死（`detail.filter`
  #   走 `toEqual`、`expression` 折进 `selectSql` 走正则）；assert_drill_order_line_matches_metric.sql
  #   守的是**行域数据同量**（vw-FINISHED vs stg-CASE-FINISHED），它读不到声明。
  # 粒度 = 8 列原子行键闭集（业务键 distinct = 总行数，2026-10-21 真机核实；batch_id 不拆行）。
  # 价格列是**条件列**（detail.columns，grantedBy: data:cost）：无码 ⇒ 列**不在场**（缺席，不是 NULL）。
  #   它**不是**值级掩码——该列在 sale_amount@order 的赠品判别式内部，nullify 会让判别式变 NULL、
  #   污染聚合值（Phase 1 spec §7 订正 2 的算术仍成立）。
  # ⚠️ 契约层**未**打 sensitivity（spec 2026-10-22 §3.2）：打标会激活默认档**整值** nullify，
  #    把 sale_money 一起藏掉。列级暴露的机器声明缺口归 #780 后续，别在这里补假声明。
  # ⚠️ 若将来有人给本列加值级 `mask`（按列），两个方向都**不是**响亮失败（`mask.ts` 的按列替换
  #    跳过 `as ` 后的别名位，issue #824）：① 声明用**裸列名** ⇒ 投影变成
  #    `max(cast(null as numeric)) as <col>`——合法 SQL、列**在场但整列 NULL**（静默；审计仍记该列），
  #    正是本设计要消灭的「NULL 被读成这行没值」；② 声明用**限定列名**（`vw_….`）⇒ 本投影是不限定
  #    列名，掩码正则一个都不命中 ⇒ **掩码不生效（fail-open，明文照出）**。
  #    结论：给本列打列级掩码前**必须先裁决**「掩码生效 ⇒ 整列缺席（推荐）vs 列在场全 NULL」，
  #    缺口归 #995（下钻条件列 × 列级掩码的语义缺口）；别指望它自己报错。
  - name: 'lemeng:retail:order_line'
    label: 零售订单明细行
    definition: >-
      乐檬零售订单明细的**行级**读面（一行 = 一个订单明细行）。
      用途是**定位根因**：聚合指标答「是多少」，本指标答「哪几行造成的」。
      **行数的唯一权威 = query_detail 回包的 rowCountTotal**（不受 limit/分组影响）；
      聚合面（query_data）仍受 1000 行截断，**不要**拿它数行。
      行域 = state='FINISHED' 的全部行（**含退货行**；已退款 REPAID / 作废 CANCELED 不在）。
      维度闭集（8 列）= 账套 × 业务日 × 门店 × 订单号 × 明细行号 × 商品 × 交易类型。
      ⚠️ item_code 契约明文**恒为空串**（上游订单 API 无此字段），别当成有效商品码。
      ⚠️ 价格列 order_detail_std_price 需 `data:cost` 授权——**未授权时该列不在回包里**
      （是「无权限看这一列」，不是「这行没值」，也不是「没有数据」）。
      ⚠️ 本指标**不承载口径**（销售/退货判别式、赠品排除全在 fct_* 那族）；
      拿它对账前先读 lemeng:retail:net_sales 的 definition。
      前置核实（2026-10-21 真机）：业务键（账套×日×单号×行号）distinct = 总行数 ⇒ 无重复；
      加 batch_id 后仍无重复 ⇒ 85 个批次不拆行；hour 无空值。
    expression: >-
      sum(case when stg_lemeng_retail_order_line.state = 'FINISHED'
               then stg_lemeng_retail_order_line.sale_money else 0 end)
    grain: [system_book, bizday, branch_num, order_no, order_detail_num, item_num,
            item_code, order_transaction_type]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'
    compose: 'line_amount@line'
    dimensions: [system_book, bizday, branch_num, order_no, order_detail_num, item_num,
                 item_code, order_transaction_type]
    # detail.filter 不手写（P3.0 Task 3）：compose 只有 line_amount@line（domain: finished）⇒ 派生 `state = 'FINISHED'`。
    detail:
      relation: vw_lemeng_retail_order_line
      columns:
        - { col: order_detail_std_price, grantedBy: data:cost }

  - name: 'lemeng:loss:branch_amount'
    label: 门店报损金额
    definition: >-
      报损/调整出库金额合计：库存调整单（direction 含出库=报损/盘亏、入库=盘盈）按原因（cause：
      来货损/自然损/试吃 等）的 total_money 合计。真机锚：3120/店92/2026-10-01..19 三 cause
      合计 806.64 与乐檬报表逐分（单数 10/17/8）。粒度 = 账套 × 制单日 × 门店 × 原因 × 方向。
    expression: 'sum(fct_loss_adjustment.loss_money)'
    grain: [system_book, bizday, branch_num, cause, direction]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
    - 's3://<bucket>/lemeng/loss_adjustment/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:member:branch_vip_money'
    label: 门店会员销售
    definition: >-
      会员销售合计：会员销售汇总（customeranalysissummary）按门店×日×订单类型的 customer_vip_money 合计。
      **口径=全部订单类型的 vip 字段合计**（漏「拼团」型 2026-10-25 实测差 82.19/455 客单中 9 单）。
      真机锚：3120/店92/2026-10-01..19 累计 24284.39、客单 455、占比 47.36% 与乐檬报表逐分。
      粒度 = 账套 × 营业日 × 门店 × 订单类型。
    expression: 'sum(fct_member_summary.vip_money)'
    grain: [system_book, bizday, branch_num, order_sale_type_name]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
    - 's3://<bucket>/lemeng/member_summary/system_book=<账套>/bizday=<日期>/all.parquet'
  - name: 'lemeng:member:branch_vip_nums'
    label: 门店会员客单
    definition: >-
      会员客单合计：同基面 customer_vip_nums 合计。**口径=全部订单类型的 vip 字段合计**。
      粒度 = 账套 × 营业日 × 门店 × 订单类型。
    expression: 'sum(fct_member_summary.vip_nums)'
    grain: [system_book, bizday, branch_num, order_sale_type_name]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
    - 's3://<bucket>/lemeng/member_summary/system_book=<账套>/bizday=<日期>/all.parquet'

  # ── D10 门店经营指标（2026-10-26，#1047 P2/P3）：首发 transfer_money ─────────────────────
  # 构件落点 fct_branch_indicator（宽表：staging 的 metric 行转列）。新增 D10 指标 = mart 加一列
  # + 本节加一条声明；采集形态/网关省略语义见契约 contracts/common/lemeng.branch_indicator.json。
  - name: 'lemeng:branch:transfer_money'
    label: 门店配送金额
    definition: >-
      D10「配送金额」（乐檬 `transfer_money` 指标）= 源 `actual_value` 按门店×日合计，**可加**。
      采集形态：`date_type=month` + `date=<月内任一天>` + `group_type=day` + `metrics=["transfer_money"]`，
      源返回整月 `periods[]`，采集侧只留 `period_day = 业务日` 那一格 ⇒ 日粒度。
      **缺行语义（必读）**：源侧「本月无数据」的门店不出现在响应里 ⇒ 该店日湖里无行；构件对无行店日给 0
      ⇒ **本指标分不出「源侧没报」与「报了 0」**，要区分须读 staging 行集（契约 description 详）。
      锚：3120/店92/2026-10-01..19 合计 **32,114.96**（与乐檬源界面逐分对上；湖侧两面独立复算恒等）。
      ⚠️ tier=experimental：仅 3120 单账套 × 单指标 × 19 天验证，多指标/跨账套未复核前不升。
      粒度 = 账套 × 业务日 × 门店。
    expression: 'sum(fct_branch_indicator.transfer_money)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
    - 's3://<bucket>/lemeng/branch_indicator/system_book=<账套>/bizday=<日期>/all.parquet'
