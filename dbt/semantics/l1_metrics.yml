# l1_metrics.yml — **L1 语义声明（事实源）**。拍板 2（2026-09-22）：语义声明以 dbt YAML 为事实源，
# 引擎（Ossie 等）只当**编译产物**（spec §11.7「押架构不押规范」）。
#
# 为什么这个文件**不在** `models/` 下（也就不在 dbt 的扫描面内）—— 一句话版：
#   指标 `name` 是命名空间形态 `<源>:<业务域>:<指标>`（含冒号），而 **dbt 资源名不允许冒号**；
#   放进 dbt 会扫的 schema 文件有让 `dbt parse` 挂掉的风险。完整理由 + T6 的核对步见 README
#   「L1 语义声明的落点」。**静态门禁两处都扫**（本目录 + `dbt/models/**`），两种落点都不漏检。
#
# ── 字段约定（静态门禁 rules ⑤⑥⑦ 的判据面，改这里必须同步改 README 与门禁）─────────────────
#   name        必填。`<源>:<业务域>:<指标>`，三段都小写蛇形（`(org,id)` 主键下，**带源段**才能让
#               第二个源用同一业务概念名声明而不撞键）。命名空间是「同名唯一」能成立的前提
#               （layered §6）；它同时决定对账文件名（`:` → `__`，映射函数只有一处事实源：
#               scripts/check-data-models.mjs 导出的 metricToAuditFileName()）。
#   label       人读名字（进词表 / BI 展示面）。
#   definition  必填。**口径的逐字定义**（治理机制① 的必需字段，spec §10）。
#   expression  必填。口径的**实现表达式**（指向哪个模型的哪些列）；「口径只定义一次」的落点。
#   grain       必填。可聚合维度清单（非空数组）。消费层只能在这些维度上组合（layered §7 约束 5）。
#   owner       必填。口径负责人（谁改谁负责；治理机制①）。
#   tier        必填。`certified`（已认证，可直接对外）| `experimental`（试验口径，消费方自担）。
#               ⚠️ tier 是**标记**不是强制（spec §10 软肋③）：本仓不靠它挡谁，靠它让人一眼看见成熟度。
#   source      必填。**源系统**（小写蛇形，如 `lemeng`）—— 这条口径的数据来自哪个源。
#               ⚠️ 与下面的 `sources` **不是一回事**（一个是源系统、一个是存储路径），别合并：
#               它会**落库**（`data.metrics.source_system`，sync 物化）并被消费侧拿去与
#               「已接入源」比对（未接入该源的租户看不到这条指标）⇒ 写法必须与登记值逐字一致。
#   sources     选填（人读）。指标背后**实际读的对象存储路径**（不落库、无门禁）。
#
# ⚠️ 「声明 ↔ 实现一致」（expression 指向的模型/列真的存在且口径一致）这条**当前没有机检**
#    —— 它需要真库（spec §10 门禁③ 的形态）。当前只有：本文件的**存在性/字段/命名/对账文件**机检
#    （本仓 scripts/check-data-models.mjs），加上 `dbt/tests/audit_*.sql` 的独立复算（真库上跑）。
version: 1

metrics:
  - name: 'lemeng:retail:net_sales'
    label: 净销售额
    definition: >-
      零售净销售额，平台口径（issue #430 定案，2026-10-05 双账套真机 5 天逐分归零）：
      取 state=FINISHED 且 order_transaction_type=SALE_ORDER 的订单（退货单不进 gross——
      平台 sale_money 不冲退货单），逐订单取「(Σ非赠品行额 + order_total_money) / 2」，
      按门店×日合计后再减 Σ分摊折扣（order_detail_share_discount）；
      赠品行按判别式排除（std_price>0 且 sale_money>0 且 quantity>0 且
      |discount_money − std_price×quantity| ≤ 0.02，容差标定见判别式正典
      docs/superpowers/specs/2026-09-30-recon-zeroing-self-attribution.md）。
      粒度 = 账套 × 业务日 × 门店（口径模型 fct_retail_sale）。
      ⚠️ tier=experimental：公式已真机验证；等客户回签裁1（换货「送出半边」叠加进净额 L，
      spec 2026-10-12-lemeng-metrics-sources-semantics-design.md §6）后再转 certified。
    expression: 'sum(fct_retail_sale.net_amount)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'
    # 对账（每个声明指标一条独立复算，layered §7 硬约束 7）：对应的 singular test 文件名**不在这里写**
    # —— 名字由 `:` → `__` 的映射函数算出（scripts/check-data-models.mjs 导出的 metricToAuditFileName()，
    #   唯一事实源）。在这里再写一遍文件名 = 两处事实源，映射一改这两行就悄悄过期。

  - name: 'lemeng:retail:order_count'
    label: 订单数
    definition: >-
      有效零售订单数：state=FINISHED 且 order_transaction_type=SALE_ORDER 的去重订单笔数
      （与净销售额同基面，换货单算一单；口径模型 fct_retail_sale）。
      粒度 = 账套 × 业务日 × 门店。
      **上滚语义**：更粗粒度上对 expression 求和 = 各门店日去重笔数之和；跨门店重号的订单会被
      重复计入——`order_no` 的**跨门店唯一性未证**（单号语义的已证/未证边界见
      `dbt/tests/audit_lemeng__retail__order_count.sql` 头注），这是本口径的**已知边界**，
      要「全账套唯一订单数」得单独声明一个新指标，不许改本定义。
    expression: 'sum(fct_retail_sale.order_count)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'
