# l1_metrics.yml — **L1 语义声明（事实源）**。拍板 2（2026-09-22）：语义声明以 dbt YAML 为事实源，
# 引擎（Ossie 等）只当**编译产物**（spec §11.7「押架构不押规范」）。
#
# 为什么这个文件**不在** `models/` 下（也就不在 dbt 的扫描面内）—— 一句话版：
#   指标 `name` 是命名空间形态 `<源>:<业务域>:<指标>`（含冒号），而 **dbt 资源名不允许冒号**；
#   放进 dbt 会扫的 schema 文件有让 `dbt parse` 挂掉的风险。完整理由 + T6 的核对步见 README
#   「L1 语义声明的落点」。**静态门禁两处都扫**（本目录 + `dbt/models/**`），两种落点都不漏检。
#
# ── 字段约定（静态门禁 rules ⑤⑥⑦ 的判据面，改这里必须同步改 README 与门禁）─────────────────
#   name        必填。`<源>:<业务域>:<指标>`，三段都小写蛇形（`(org,id)` 主键下，**带源段**才能让
#               第二个源用同一业务概念名声明而不撞键）。命名空间是「同名唯一」能成立的前提
#               （layered §6）；它同时决定对账文件名（`:` → `__`，映射函数只有一处事实源：
#               scripts/check-data-models.mjs 导出的 metricToAuditFileName()）。
#   label       人读名字（进词表 / BI 展示面）。
#   definition  必填。**口径的逐字定义**（治理机制① 的必需字段，spec §10）。
#   expression  必填。口径的**实现表达式**（指向哪个模型的哪些列）；「口径只定义一次」的落点。
#   grain       必填。可聚合维度清单（非空数组）。消费层只能在这些维度上组合（layered §7 约束 5）。
#   owner       必填。口径负责人（谁改谁负责；治理机制①）。
#   tier        必填。`certified`（已认证，可直接对外）| `experimental`（试验口径，消费方自担）。
#               ⚠️ tier 是**标记**不是强制（spec §10 软肋③）：本仓不靠它挡谁，靠它让人一眼看见成熟度。
#   source      必填。**源系统**（小写蛇形，如 `lemeng`）—— 这条口径的数据来自哪个源。
#               ⚠️ 与下面的 `sources` **不是一回事**（一个是源系统、一个是存储路径），别合并：
#               它会**落库**（`data.metrics.source_system`，sync 物化）并被消费侧拿去与
#               「已接入源」比对（未接入该源的租户看不到这条指标）⇒ 写法必须与登记值逐字一致。
#   freshness_sla_days 必填。**新鲜度 SLA 承诺天数**（spec §10.7.1）：物化水位距今天 ≤N 个
#               业务日即「正常」。值 = 采集正典实测窗口的登记，不是拍脑袋：inventory 两指标 = 2
#               （源端发布滞后 16~40h 实测），其余 = 1（D+1 采集/日结）。sync 物化进
#               `data.metrics.sla_days`，服务端按它把水位转译成 freshness_status
#               （normal/late/alert）与 freshness_line 固定展示行；**缺声明 sync 响亮失败**
#               （新指标忘登记不许静默默认——那会让它永远「未知」且没人发现）。
#   sources     选填（人读）。指标背后**实际读的对象存储路径**（不落库、无门禁）。
#               ⚠️ 但它**参与新鲜度链路推导**（spec §10.7.3）：sync 取路径段 `lemeng/<资产>`
#               推导 `stg_lemeng_<资产>` 关系集物化进 `data.metrics.freshness_relations`，
#               水位 = 这些关系在 load_log 上的 min(max_bizday)。不声明 = 该指标无自动水位
#               （freshness_line 等字段缺席，如实「未知」）。
#   mask        选填。**值级脱敏声明**（spec 2026-10-17 §5.2）：数组，每项
#               { column, kind, step?, grantedBy }。kind ∈ {round, nullify}——闭集常量
#               MASK_KINDS 在 modules/data/domain/authz.ts（门禁与运行期共用一份，加 kind 走 PR）；
#               column 是「关系.列」形态的限定列引用，**必须逐字出现在本指标物化的 selectSql 里**
#               （运行期掩码是列引用定点替换，列不在 ⇒ 静默不生效，sync 会响亮拒绝）；
#               column: null = **整值掩码**（把 `… as value` 整个换成 typed NULL，fail-closed
#               默认档语义），此时 kind 只许 nullify。grantedBy 是**豁免码**（持有 ⇒ 看原值，
#               与 requiredScope 的「默认拒绝」方向相反）。⚠️ 声明只进 `data.metrics.mask_spec`，
#               **不进 select_sql**（占位符进 select_sql 会被 L2 编译原样带出去，spec §5.3 订正块）。
#               当前无指标声明——首个声明随业务裁决走（掩码一声明，无豁免码的人立即看不到原值）。
#
# ⚠️ 「声明 ↔ 实现一致」（expression 指向的模型/列真的存在且口径一致）这条**当前没有机检**
#    —— 它需要真库（spec §10 门禁③ 的形态）。当前只有：本文件的**存在性/字段/命名/对账文件**机检
#    （本仓 scripts/check-data-models.mjs），加上 `dbt/tests/audit_*.sql` 的独立复算（真库上跑）。
version: 1

metrics:
  - name: 'lemeng:retail:sales'
    label: 销售额（不冲退货）
    definition: >-
      零售销售侧金额（**不冲退货**）= 2026-10-17 之前 `lemeng:retail:net_sales` 的原值。
      取 state=FINISHED 且 order_transaction_type=SALE_ORDER 的订单（**退货单不进本口径**），
      逐订单取「(Σ非赠品行额 + order_total_money) / 2」，按门店×日合计后再减 Σ分摊折扣；
      赠品行按判别式排除（std_price>0 且 sale_money>0 且 quantity>0 且
      |discount_money − std_price×quantity| ≤ 0.02，容差标定见判别式正典
      docs/superpowers/specs/2026-09-30-recon-zeroing-self-attribution.md）。
      ⚠️ 会计上这个量叫 **gross sales**，不是 net sales —— 本指标存在的意义正是把「毛」与「净」
      在语义层**同时可见**，防「净销售额」被当成会计净收入用（2026-10-17 事故根因，issue #813）。
      粒度 = 账套 × 业务日 × 门店（口径模型 fct_retail_sale）。
      ✅ tier=certified（沿用旧 `net_sales` 的 2026-10-05 双账套 5 天 × 63 店逐分归零验证，公式未变）。
    expression: 'sum(fct_retail_sale.sale_amount)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'

  - name: 'lemeng:retail:net_sales'
    label: 净销售额
    definition: >-
      零售净销售额 = **销售侧 − 退货侧**（2026-10-17 起，issue #813；口径依据 = 客户裁1 的净额
      L = Σsale − Σreturn 叠加「换货扣送出半边」）。**销售侧** = state=FINISHED 且
      order_transaction_type=SALE_ORDER 的订单（退货单不进销售侧），逐订单取
      「(Σ非赠品行额 + order_total_money) / 2」，按门店×日合计后再减 Σ分摊折扣；赠品行按判别式排除
      （std_price>0 且 sale_money>0 且 quantity>0 且 |discount_money − std_price×quantity| ≤ 0.02，
      容差标定见判别式正典 docs/superpowers/specs/2026-09-30-recon-zeroing-self-attribution.md）。
      **退货侧** = 退货单**全额冲减**（不套折半）：Σ(sale_money + order_detail_share_discount)，
      条件 order_transaction_type like '%RETURN%' AND state='FINISHED'（**REPAID_RETURN 不计**
      —— 它们 state=REPAID；2026-10-17 四个 book-day 真机逐分验证）。
      退货按**退货单自身 bizday** 归属，不是原单销售日。
      粒度 = 账套 × 业务日 × 门店（口径模型 fct_retail_sale）。
      ⚠️ 本口径实为**乐檬报表复现口径**（销售侧折半式是反推式），**不是会计口径的净收入**。
      ⚠️ tier=experimental：退货侧存在逐店缺口（issue #814），缺口清零前不转 certified。
      spec：docs/superpowers/specs/2026-10-17-retail-net-sales-return-offset-design.md
    expression: 'sum(fct_retail_sale.net_amount)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'
    # 对账（每个声明指标一条独立复算，layered §7 硬约束 7）：对应的 singular test 文件名**不在这里写**
    # —— 名字由 `:` → `__` 的映射函数算出（scripts/check-data-models.mjs 导出的 metricToAuditFileName()，
    #   唯一事实源）。在这里再写一遍文件名 = 两处事实源，映射一改这两行就悄悄过期。

  - name: 'lemeng:retail:order_count'
    label: 订单数
    definition: >-
      有效零售订单数：state=FINISHED 且 order_transaction_type=SALE_ORDER 的去重订单笔数
      （基面 = 销售单，与 `lemeng:retail:sales` 同基面，**不含退货单**——退货不是「订单」；
      换货单算一单；口径模型 fct_retail_sale）。
      粒度 = 账套 × 业务日 × 门店。
      **上滚语义**：更粗粒度上对 expression 求和 = 各门店日去重笔数之和；跨门店重号的订单会被
      重复计入——`order_no` 的**跨门店唯一性未证**（单号语义的已证/未证边界见
      `dbt/tests/audit_lemeng__retail__order_count.sql` 头注），这是本口径的**已知边界**，
      要「全账套唯一订单数」得单独声明一个新指标，不许改本定义。✅ certified（2026-10-13 裁1 回签；基面 = 销售单，未随 #813 的净额口径变更而变）。
    expression: 'sum(fct_retail_sale.order_count)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'

  - name: 'lemeng:retail:net_quantity'
    label: 零售净销量
    definition: >-
      净销量 = 销售数量 − 退货数量（客户项 03-07「库存覆盖天数」的**分母**）。可加（按门店日求和）。
      **销售** = state=FINISHED 且 order_transaction_type=SALE_ORDER；**退货** = 单据类型含 RETURN
      且 state ∈ (FINISHED, REPAID)。⚠️ 载体见 `fct_retail_quantity`——它的基面与本族净**额**
      指标**不同**（净额自 2026-10-17 起也减退货，但退货谓词是 `like '%RETURN%' AND
      state='FINISHED'`（**不含** REPAID_RETURN）；本指标是 `state in ('FINISHED','REPAID')`
      —— 两者**刻意不同**，别合并），故单开构件而不是共用 fct_retail_sale。
      ⚠️ **两处解释性落地**（客户原文未细到这一层，故 experimental）：
      ① `REPAID_RETURN`（已退款退货）计入退货；② `state=CANCELED` 的销售与退货都不计。
      ⚠️ **本指标不产出「覆盖天数」**：客户公式里的「批准窗口 N」属 X08 口径阈值（客户待批），
      按裁5「未批准前不设门槛，只出分子/分母」⇒ 本仓只出净销量，N 由消费方带。
      分子（可售库存数量）见 `lemeng:inventory:quantity`。
      粒度 = 账套 × 业务日 × 门店 × **商品**（2026-10-17 由门店级扩到商品级，与覆盖天数的客户粒度对齐；
      门店级视角对 expression 求和即可）。
    expression: 'sum(fct_retail_quantity.net_quantity)'
    grain: [system_book, bizday, branch_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'

  - name: 'lemeng:retail:consecutive_no_sales_days'
    label: 连续无业绩天数
    definition: >-
      03-05：从报告日向前**逐日累计**的连续无正向销售天数（正向销售 = `Σsale_money > 0`）。
      **不可加**（跨日/跨店求和无意义）⇒ 用 `max(…)` 取该粒度上的值，消费侧不要跨行求和。
      **建立在门店×日骨架 `fct_branch_day_activity` 上**——零售事实只在「有单」的店日有行，
      「店开着但零销售」没有行 ⇒ 骨架补真零天，否则缺口被当成「不存在」而不是「零」。
      **射程（必须读）**：只对 `retail_active`（观察窗内有过零售销售）的门店成立；无零售历史的
      门店（批发客户/仓库/配送节点）恒为连续无业绩，**不构成经营异常信号**。故 expression 内按
      `retail_active` 收缩。**已知盲区**：整窗零零售的门店与「窗内一直闭店」无法区分（历史仅 25 天），
      待客户营业日历（`x01_branch_calendar`）或更长窗口；「断数 vs 零销售」的最终判定仍需 X09。
      ⚠️ 与 01-06「规则闭店候选」的区别：本指标只出**天数**，**15 日门槛属 01-06/X08，不在本口径**。
      粒度 = 账套 × 业务日 × 门店。
    scope_note: >-
      仅零售门店口径：批发客户/仓库/配送节点（观察窗内无零售销售）与停用门店已排除；
      断数与零销售的最终区分仍待采集日志。
    expression: >-
      max(case when fct_branch_day_activity.retail_active
               then fct_branch_day_activity.consecutive_no_sales_days end)
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      # 只列**度量源**（约定同 contribution:region_net——它用 dim_branch.region_id 但不列该路径）。
      # 门店快照是维度依赖，已写在 definition 里。
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'

  - name: 'lemeng:retail:comparable_growth_rate'
    label: 可比门店销售增长率
    definition: >-
      01-05：两期**可比门店集合 B** 的销售增长率 = `Σ_B本期L / Σ_B上期L − 1`
      （L = `Σsale_money` **毛额**，不冲退货——与 certified 净额口径 #430 **不同**，按客户 01-05 原式取毛额）。
      **B 是「这一对期间」的属性，不是单期的属性** ⇒ 消费方「两次调用各取一期再相除」**结构性做不到**
      （两次调用的行集不同 ⇒ 分母口径错）⇒ B 在构件 `fct_retail_comparable_growth` 里定死。
      **B 的判据**（客户文档「闭店日和新开店须按规则排除」，**全部可从自有数据推出**，不依赖客户营业日历）：
      不是新开店（`first_seen <= 上期开始`）／不是闭店（`last_seen >= 本期结束`）／两期每日快照均 `enable`／
      两期中至少一期有零售行（否则批发客户/仓库/配送节点会混进分母——与 03-05 的 `retail_active` 同一条约束）。
      **营业店日归一化**（客户第二式 `(本期L/本期营业店日)/(上期L/上期营业店日)−1`）的输入 =
      构件里的 `cur_store_days` / `pri_store_days`，由消费方另算，**本口径不含**。
      **周期**：当前只出 **7 天**。客户频率是**月**，但本湖只有 25 天历史 ⇒ 月对月尚无数据；
      加周期 = 同一代码路径在 `periods` 里多一个值（不是改口径）。
      **已知边界**：观察窗内新开/闭店实测均为 **0** ⇒ 那两条排除逻辑**当前空转**，随历史变长才生效
      （刻意保留，客户文档明确要求）。无可比门店或上期合计 ≤ 0 ⇒ 率不适用（分母 nullif）。
      粒度 = 账套 × 周期长度 × 报告期末日（列名 `bizday` = **本期报告期末那一天**，
      保留 bizday 这个名字是为了沿用问数参数白名单——它是业务日，`date_range` 过滤的是「期末日落在区间内的周期」）。
    scope_note: >-
      仅可比门店口径：新开店、闭店、两期内停用、以及无零售业务的节点（批发客户/仓库/配送节点）已排除；
      周期为 7 天（不是客户要求的月——历史不足）。
    expression: >-
      sum(fct_retail_comparable_growth.cur_amount)
      / nullif(sum(fct_retail_comparable_growth.pri_amount), 0) - 1
    grain: [system_book, period_days, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      # 只列**度量源**（约定同 contribution:region_net）。门店快照是 B 的判据来源，
      # 但其湖前缀 `lemeng/dim_branch` 推不出对应 staging 名（`stg_lemeng_dim_branch` 不存在），
      # 故不进 freshness_relations——它的依赖写在 definition 里。
      - 's3://<bucket>/lemeng/retail_order_line/system_book=<账套>/bizday=<日期>/hour=<时>/all.parquet'

  # ── W1（2026-10-12）：transfer/wholesale 出域骨架 9 条 ──────────────────────────────
  # 构件落点：fct_hq_outbound（R/C/G 长表）/ fct_transfer_line_quality（行质量面）/
  #   fct_transfer_item（商品粒度）。口径与基面的「为什么」在各 fct 头注。
  # ⚠️ 全部 experimental：裁8（transfer R 用行级 out_money）与裁1 未回客户签；
  #   region_id 是 X01 未就位的回落（dim_branch 当前档案），战区下钻语义受「历史战区不可套
  #   当前档案」约束（客户文档 D12 边界）。

  - name: 'lemeng:outbound:net_amount'
    label: 总仓出库净额
    definition: >-
      出库净额 R 构件（客户公共定义 R 的平台实现，分域不混加）：transfer 域 = Σ行级 out_money
      （总部结算口径，裁8）；wholesale 域 = Σ 单头 total_money（per_order 去冗余）− Σ 退货单头
      total_money（店日级相减，防一单多次退货的 join 放大；D03 A 阶段恒空集时为 0，与 D02 负金额
      红字不得重复扣）。基面：transfer = 审核且总仓发货且排除店间直调；wholesale = 审核批发单。
      粒度 = 账套 × 业务日 × 域 × 门店 × 战区（region_id 为 X01 回落）。
      不可加边界：跨 domain 相加 = 客户 01-01 的 R 全量，但客户文档明令展示时配送与批发分别列。
    expression: 'sum(fct_hq_outbound.r_net)'
    grain: [system_book, bizday, domain, branch_num, region_id, client_fid]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_return/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:outbound:gross_profit'
    label: 总仓出库毛利
    definition: >-
      出库毛利 G 构件 = R − C：transfer 域 C = Σ行级 subtotal（成本小计，契约实测=cost_subtotal）；
      wholesale 域 C = Σ 单头 cost_money − Σ 退货单头 cost_money（同 net_amount 的去冗余与相减形态）。
      粒度与不可加边界同 lemeng:outbound:net_amount。
      ⚠️ D10 系统指标对照（客户 01-02/08-01 的「系统差异」面）待 D10 接入（W3）后另补，本定义不含。
      成本缺失/税基未核时只能试算（客户文档数据条件原话）；experimental 事由同裁8。
    expression: 'sum(fct_hq_outbound.g_gross)'
    grain: [system_book, bizday, domain, branch_num, region_id, client_fid]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_return/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:outbound:gross_margin_rate'
    label: 总仓出库毛利率
    definition: >-
      出库毛利率 = G/R（不可加；上滚=重算/另声明）。分子分母同域同店日（domain 在 grain，
      域间不混算分母）。零分母 → 不适用（sync 自动包 nullif）。
      experimental 事由同裁8/裁1；D10 对照面 W3 后补。
    ratio:
      numerator: 'sum(fct_hq_outbound.g_gross)'
      denominator: 'sum(fct_hq_outbound.r_net)'
    grain: [system_book, bizday, domain, branch_num, region_id, client_fid]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_return/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:outbound:order_count'
    label: 出库单数
    definition: >-
      审核出库单数（域内去重；04-01 的单数面）。transfer 域 = COUNT DISTINCT 配送单号；
      wholesale 域 = COUNT DISTINCT 批发单号（domain 在 grain，客户文档「配送批发分别列」由
      下钻实现，不许跨域相加后当总量）。⚠️ 按 audit_time/采集分区日截日是**代理指标**——
      不代表实际拣货日（客户文档 04-01 数据条件原话）。粒度 = 账套 × 业务日 × 域 × 门店 × 战区。
    expression: 'sum(fct_hq_outbound.order_count)'
    grain: [system_book, bizday, domain, branch_num, region_id, client_fid]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_out/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:outbound:line_count'
    label: 出库明细行数
    definition: >-
      审核出库明细行数（04-01 的行数面；transfer 域 = 配送单商品行计数，wholesale 域 = 批发单
      商品行计数；domain 在 grain 分别列）。上滚 = 各粒度行数之和（行数可加）。
      同 order_count 的「审核日代理指标」边界。粒度同上。
    expression: 'sum(fct_hq_outbound.line_count)'
    grain: [system_book, bizday, domain, branch_num, region_id, client_fid]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'
      - 's3://<bucket>/lemeng/wholesale_out/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:transfer:batch_fill_rate'
    label: 配送批号填写率
    definition: >-
      出库明细批号填写率（04-05，**全量版**：分母 = 全部审核出库明细行，非「需批号管理」清单——
      X08 需批号清单未批准，考核版待 X08 就位另声明）。分子 = 批号非空且非空白串的行数
      （客户文档「空白和占位字符视为无效」）。不可加；上滚=重算/另声明。
      ⚠️ 字段完整率不证明实物批次正确（客户文档数据条件原话）。粒度 = 账套 × 业务日 × 门店。
      只 transfer 域；wholesale 侧随 D02 v2 勾稽批次。
    ratio:
      numerator: 'sum(fct_transfer_line_quality.lot_filled_lines)'
      denominator: 'sum(fct_transfer_line_quality.line_count)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:transfer:zero_cost_exposure_amount'
    label: 配送零成本出库暴露金额
    definition: >-
      零成本出库暴露金额（04-06 金额面）= Σ（金额≠0 且**已知**成本=0 的行的金额）；
      成本 **null 的缺成本金额是另一类暴露**（fct_transfer_line_quality.missing_cost_amount），
      **不在本口径**——判据是客户文档 04-06「**已知**成本=0」+「成本 null **另列**」与
      01-08「零成本金额**另算**」；两者**互斥**、不相加（01-08「各类暴露可能重叠，不相加为总损失」
      指暴露面整体，非指这两面之间）。⚠️ 2026-10-17 订正：原物化用 `coalesce(subtotal,0)=0`
      把 null 并了进来，与缺成本面重叠——已改为 `subtotal = 0`（数值零影响，见消费面 spec §5.2）。
      免费商品/暂估问题需业务确认（客户文档原话）；零成本不等于全部利润可实现。
      只 transfer 域。粒度 = 账套 × 业务日 × 门店。
    expression: 'sum(fct_transfer_line_quality.zero_cost_amount)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:transfer:negative_order_count'
    label: 配送负金额单数
    definition: >-
      负金额出库单数（04-07 单数面）= 单头金额 < 0 的去重单数（合计面见
      fct_transfer_line_quality.negative_amount，未声明为指标）。负数可能是退补/冲红/调整——
      「不按绝对值变正收入，也不一律称退货」（客户文档 04-07 原话）；本口径只计数不定性。
      只 transfer 域；wholesale 侧随 D02 v2 勾稽批次。粒度 = 账套 × 业务日 × 门店。
    expression: 'sum(fct_transfer_line_quality.negative_order_count)'
    grain: [system_book, bizday, branch_num]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:transfer:item_gross_margin_rate'
    label: 商品出库毛利率
    definition: >-
      商品粒度出库毛利率（06-03；不可加；上滚=重算/另声明）。只 transfer 域——客户文档 06-03
      数据条件「批发明细先与单头成本勾稽，差额单列或经批准分配；不能将整张单头成本分配给每个
      商品」⇒ wholesale 侧不出商品粒度毛利。基面同 fct_hq_outbound transfer 域（排除店间直调）。
      experimental 事由同裁8。粒度 = 账套 × 业务日 × 商品。
    ratio:
      numerator: 'sum(fct_transfer_item.g_gross)'
      denominator: 'sum(fct_transfer_item.r_net)'
    grain: [system_book, bizday, item_num]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/transfer_out/system_book=<账套>/bizday=<日期>/all.parquet'


  # ── W2（2026-10-13）：费用两件套 6 条 ────────────────────────────────────────────────
  # 构件落点：fct_branch_expense / fct_client_expense。全部 experimental——
  # 裁9（净费用 e = 应付 − 应收 的符号语义）未回签；费用率类为跨模型比率 → L2（消费面）。

  - name: 'lemeng:expense:branch_payable'
    label: 门店应付费用
    definition: >-
      门店费用应付合计（EP）：审核费用单（state_code=3）按 direction='应付' 的 amount 合计，
      按费用项目（expense_type）与门店、日分列。金额保留红字。粒度 = 账套 × 审核日 × 门店 × 项目。
    expression: 'sum(fct_branch_expense.ep_payable)'
    grain: [system_book, bizday, branch_num, expense_type]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/branch_expense/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:expense:branch_receivable'
    label: 门店应收费用
    definition: >-
      门店费用应收合计（ER）：同上基面按 direction='应收' 的 amount 合计。
      粒度 = 账套 × 审核日 × 门店 × 项目。
    expression: 'sum(fct_branch_expense.er_receivable)'
    grain: [system_book, bizday, branch_num, expense_type]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/branch_expense/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:expense:branch_net'
    label: 门店净费用
    definition: >-
      门店净费用（E 构件）= 应付合计 − 应收合计。**不可加边界**：更粗粒度求和即净费用之和
      （E 可加）。（符号语义 = 应付 − 应收；**裁9 客户已回签 2026-10-13**。）
      粒度 = 账套 × 审核日 × 门店 × 项目。
    expression: 'sum(fct_branch_expense.e_net)'
    grain: [system_book, bizday, branch_num, expense_type]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/branch_expense/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:expense:client_payable'
    label: 客户应付费用
    definition: >-
      客户费用应付合计（EP）：审核客户费用单（state_code=3）按 other_inout_flag=false（应付，
      真样本实证）的 other_inout_money 合计，按费用项目（other_inout_kind）与客户、日分列。
      client_fid 前导零按字符串保留。粒度 = 账套 × 审核日 × 客户 × 项目。
    expression: 'sum(fct_client_expense.ep_payable)'
    grain: [system_book, bizday, client_fid, other_inout_kind]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/client_expense/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:expense:client_receivable'
    label: 客户应收费用
    definition: >-
      客户费用应收合计（ER）：同上基面按 other_inout_flag=true（应收）合计。
      粒度 = 账套 × 审核日 × 客户 × 项目。
    expression: 'sum(fct_client_expense.er_receivable)'
    grain: [system_book, bizday, client_fid, other_inout_kind]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/client_expense/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:expense:client_net'
    label: 客户净费用
    definition: >-
      客户净费用（E 构件）= 应付合计 − 应收合计。可加。符号语义待裁9 → experimental。
      粒度 = 账套 × 审核日 × 客户 × 项目。
    expression: 'sum(fct_client_expense.e_net)'
    grain: [system_book, bizday, client_fid, other_inout_kind]
    owner: data-platform
    tier: certified
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/client_expense/system_book=<账套>/bizday=<日期>/all.parquet'

  # ── W3（2026-10-13）：库存快照 2 条 ─────────────────────────────────────────────────
  # 构件落点：fct_inventory_snapshot。全 experimental——D17 T-1 日结不可回溯（漏采即丢）；
  # coverage_days 需销售分母（D07 上卷）→ W4 另声明。

  - name: 'lemeng:inventory:quantity'
    label: 库存数量
    definition: >-
      库存快照数量合计（基本单位）。T-1 日结（每天凌晨生成前一日快照，不可回溯——
      错过采集窗口即永久缺失该日快照）。含 0 库存行（接口返回有 0 行）。
      粒度 = 账套 × 快照日 × 门店 × 仓库 × 商品。
      ⚠️ 上滚语义：跨日不可比（快照是时点数不是流量数）——同日多仓可加，跨日只取最新。
    # 存量（stock）：形状可加（sum(列)）、**语义不可加**（跨时间无业务含义）⇒ 不自动附合计。
    # 2026-10-17 §12.3 实证：原先按 expression 形状推导成 totalable=true，问「近 7 天库存合计」
    # 会把 7 个日快照相加。正确语义（取范围末日）是第二步，等真实问法再加。
    additivity: stock
    expression: 'sum(fct_inventory_snapshot.inventory_quantity)'
    grain: [system_book, bizday, branch_num, storehouse_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
      - 's3://<bucket>/lemeng/inventory_snapshot/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:inventory:money'
    label: 库存金额
    definition: >-
      库存快照金额合计（元）。**不可加边界**：同上（时点数）。粒度 = 账套 × 快照日 × 门店 × 仓库 × 商品。
      ⚠️ experimental：裁4/裁5 未回签 + D17 可回溯深度待长期观察。
    # 存量（stock）：同 inventory:quantity——跨时间不可加，见 §12.3。
    additivity: stock
    expression: 'sum(fct_inventory_snapshot.inventory_money)'
    grain: [system_book, bizday, branch_num, storehouse_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 2
    sources:
      - 's3://<bucket>/lemeng/inventory_snapshot/system_book=<账套>/bizday=<日期>/all.parquet'

  # ── 采购族（W3 余项 2026-10-13，D11 itempurchase / fct_purchase / #640）──────────────
  # ⚠️ 全 experimental：① 采购**收货**口径（≠采购订单，客户文档边界）；② 采集范围 = 管理中心
  #  （branch_nums=[99] 固定，3120 门店配送制不采购）⇒ 指标是**采购侧口径，不代表门店**；
  #  ③ 不同 summary 维度查询结果不可重复相加（客户文档边界）。

  - name: 'lemeng:purchase:amount'
    label: 采购金额
    definition: >-
      采购收货金额合计（元，`purchase_item_money` 行级求和）。粒度 = 账套 × 采购审核日 × 供应商 × 商品。
      ⚠️ 仅管理中心采购（见族头注）；不含赠品、不含退货（那两项另有指标）。
    expression: 'sum(fct_purchase.purchase_item_money)'
    grain: [system_book, bizday, supplier_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:purchase:present_amount'
    label: 采购赠品金额
    definition: >-
      采购赠品金额合计（元，`purchase_present_money`）。采购随货赠品，独立于购入金额。
    expression: 'sum(fct_purchase.purchase_present_money)'
    grain: [system_book, bizday, supplier_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:purchase:return_amount'
    label: 采购退货金额
    definition: >-
      采购退货金额合计（元，`purchase_item_return_money`）。**不从采购金额里自动扣**——
      净额见 `net_amount`。
    expression: 'sum(fct_purchase.purchase_item_return_money)'
    grain: [system_book, bizday, supplier_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:purchase:net_amount'
    label: 净采购额
    definition: >-
      采购金额 − 采购退货金额（元）。**赠品不计入**（赠品金额独立，见 present_amount）。
      ⚠️ 与 `money_total` 的勾稽关系待客户确认（客户文档边界：money_total 与购入/赠品/退货分量先勾稽）。
    expression: 'sum(fct_purchase.purchase_item_money) - sum(fct_purchase.purchase_item_return_money)'
    grain: [system_book, bizday, supplier_num, item_num]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:purchase:supplier_count'
    label: 采购供应商数
    definition: >-
      该窗口内有采购收货的供应商**去重数**（01-07 供应商集中度 的分子侧基础）。
      ⚠️ 非可加：跨日/跨商品行不可直接相加，须按窗口重算 distinct。
    expression: 'count(distinct fct_purchase.supplier_num)'
    grain: [system_book, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
    sources:
      - 's3://<bucket>/lemeng/item_purchase/system_book=<账套>/bizday=<日期>/all.parquet'

  - name: 'lemeng:purchase:item_count'
    label: 采购商品数
    definition: >-
      该窗口内有采购收货的商品**去重数**。⚠️ 非可加：同 supplier_count。
    expression: 'count(distinct fct_purchase.item_num)'
    grain: [system_book, bizday]
    owner: data-platform
    tier: experimental
    source: lemeng
    freshness_sla_days: 1
