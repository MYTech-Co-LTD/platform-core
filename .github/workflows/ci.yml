# ci.yml — 全门禁接入（M0 计划 Task 21；测试门禁 C1/C3 的持续执行面）
#
# 四个 job 的分工（都不重叠、都必绿）：
#   unit  —— 单元/集成测试：`pnpm test`（各包 vitest + 仓根 scripts 的守卫单测）。
#            【必须挂 PG】apps/server 有 5 个测试文件用 `describe.skipIf(!dbUrl)` 整体跳过
#            （loader / routes/auth-wecom / migrate / routes/auth / tenant，共 50 条）。
#            不给 DATABASE_URL 时它们是**静默跳过**的——「全绿」会绿在一个休眠基线上：
#            会话/登录/登出/租户解析/seed/迁移/装载器/企微登录这半边一条都不执行。
#   gates —— 静态门禁：typecheck（全 workspace 包 + scripts/）+ 四个守卫脚本对真实仓跑。
#            typecheck 与守卫单测（跑在 unit 的 test:guard 里）是两件事：单测拿 fixture 验
#            守卫逻辑，本 job 拿真仓验守卫结论，且 typecheck 只在 CI 真跑才有意义。
#   web   —— 前端单测 + 构建（构建内含 `tsc -b`，即 apps/web 的 strict typecheck）。
#   smoke —— 装载冒烟（scripts/smoke-load.mjs）：真进程 + 真端口 + 真 HTTP 跑双形态。
#            与 unit 的差别是「进程内直调 app」覆盖不到的那一层（启动期装配、Host 语义、
#            静态托管）。**必须先构建 web**：冒烟要断言 /assets/* 吐的是构建产物本体，
#            dist 不存在时该断言无从谈起（见 smoke job 内注释）。
#
# 冒烟的环境变量由 scripts/smoke-load.mjs 自持（端口/PUBLIC_ORIGIN/会话密钥/Casdoor 管理员
# 凭据/SEED_DEMO 全是脚本内常量，见该文件头注②）——CI 只注入 DATABASE_URL（service 地址，
# 环境相关、无法内联）。单一事实源在脚本里，改端口不需要动本文件，杜绝两边各写各的漂移。
#
# 第五个 job `deploy` 是 CD 触发面，**默认惰性**（未 adopt 前连跑都不跑，见该 job 的注释）；
# 接入方式与前置决策在 deploy/openship-adopt.md。
#
# 第六个 job `main-guard` 是提交纪律的**事后绊线，不是门禁**：本仓是私有仓 + org plan=free，
# GitHub 的 branch protection / rulesets 在该 tier 上不存在（见 deploy/branch-protection-runbook.md），
# 服务端拦不住直推，只能靠本地 pre-push 钩子 + 这个事后检查。它跑在 push 到 main **之后**，
# 此时 main 已经被改了——价值不在"阻止"而在"让绕过流程的推送可见、可追溯"。别把它当闸门用。
name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ['5432:5432']
        # health-cmd 是必需的：没有它 job 会在 PG 就绪前开跑，测试拿到连接失败而非断言失败
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgres://platform:platform@127.0.0.1:5432/platform'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # 版本读 package.json 的 packageManager（pnpm@11.22.0，与 lockfile 对齐）；不能再传 version 入参，否则 action 报 Multiple versions
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 是下面两条纪律守卫的**前置**，不是可选优化：两条都拿
      # `origin/<base>` 做 diff/log 的范围端点，浅克隆（默认 depth=1）下该 ref 不存在 ⇒
      # `git log origin/main..HEAD` 直接失败 ⇒ 脚本走「无提交需要检查」而 **exit 0 静默通过**
      # ——守卫看着绿，实则一次都没跑。宁可慢一点，也不要一个会空转的门禁。
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 聚合 typecheck：`pnpm -r --if-present typecheck`（5 个 workspace 包）+ 仓根
      # tsconfig.json（scripts/ 的 .mjs/.ts；根不是 workspace 包，-r 扫不到，故必须单独跑）
      - run: pnpm typecheck
      # 守卫脚本对真实仓跑：干净必须 exit 0（单测里的 fixture 用例不能替代这一步）
      - run: pnpm exec tsx scripts/check-manifests.mjs
      - run: pnpm exec tsx scripts/lint-architecture.mjs
      - run: pnpm exec tsx scripts/check-compose.mjs
      - run: pnpm exec tsx scripts/check-env-example.mjs
      # 提交纪律装置校验（"守卫守卫本身"）：层①的钩子是本地文件、层②的自动安装是 package.json
      # 配置，两者任一被改掉，本地直推防线就静默失效——不会有任何报错，只会"从此刻起拦不住"。
      # 所以在 CI 里把它们钉死。（钩子的**行为**由 scripts/git-hooks.test.ts 覆盖，跑在 unit job）
      - name: 校验提交纪律装置完好
        run: |
          set -euo pipefail
          # git 只在钩子带执行位时才运行它——丢了执行位等于没有钩子
          if [ ! -x .githooks/pre-push ]; then
            echo "::error::.githooks/pre-push 缺失或不可执行（直推 main 将无人拦下）"
            exit 1
          fi
          node -e "
            const s = (require('./package.json').scripts || {}).prepare || '';
            if (!/install-git-hooks\.mjs/.test(s)) {
              console.error('::error::根 package.json 的 prepare 未指向 scripts/install-git-hooks.mjs（同事 clone 后不会自动装钩子）');
              process.exit(1);
            }
          "
      # 公司纪律守卫（push 事件的那半边；标准 templates/discipline/README.md「附：让 push 守卫也跑」）。
      #
      # 与上一条的关系：上一条「装置校验」守的是**层①**（本地 pre-push 钩子在不在），管的是
      # "直推拦不拦得住"；这两条守的是**层②**（提交本身合不合纪律），管的是"已经进来的东西讲没讲规矩"。
      # 补的正是纪律栈里唯一空着的一环——薄壳 discipline.yml 只在 PR 事件上跑，因此
      # `check-dev-discipline.sh`（commit 格式 / CHANGELOG 手改）在补这两条之前**全仓无人调用**。
      #
      # 注意 base 用 `github.base_ref || 'main'` 而非硬编码 origin/main：push 事件下 base_ref 为空，
      # 回落到 main；PR 事件下取真实基线分支（叠栈 PR 时基线不是 main）。
      - run: bash scripts/check-dev-discipline.sh "origin/${{ github.base_ref || 'main' }}" HEAD
      - run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" REPO="${{ github.repository }}" \
          EVENT="${{ github.event_name }}" PR="${{ github.event.pull_request.number }}" \
          BEFORE="${{ github.event.before }}" \
          node scripts/check-pr-discipline.mjs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/web test
      - run: pnpm --filter @platform/web build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgres://platform:platform@127.0.0.1:5432/platform'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 先构建 web：冒烟要断言 GET /assets/<hash>.<js|css> 返回的是构建产物本体（与磁盘
      # 产物逐字节相同）而非 SPA 兜底的 index.html——Task 19 的白屏事故正是 serveStatic
      # 被摘掉后 /assets/* 落进 SPA 兜底、curl 一样 200 却整页白屏。dist 缺失时该断言
      # 无从谈起，故构建是冒烟的前置而非可选步骤（也是「curl 200 ≠ 页面可用」的机检化）
      - run: pnpm --filter @platform/web build
      - run: pnpm exec tsx scripts/smoke-load.mjs

  # CD 触发：四个门禁 job 全绿后，让 openship 按本次 commit 部署（部署本身归 openship）。
  #
  # 惰性闸门为什么是 repo variable，而不是「配了 secret 就跑」：
  #   GitHub 的 job 级 `if` 只放行 github / needs / vars / inputs 四个上下文，**secrets 不在其列**
  #   （在 if 里引用 secrets 会直接报错）——「有没有配 secret」这个闸门在 job 级根本写不出来。
  #   vars 在 job 级 if 里可用，而 OPENSHIP_PROJECT_ID 本来就是 adopt 完成后必须人工回填的
  #   **必填参数**（POST /api/deployments 的 projectId），让它兼任开关就没有「开关开了但参数
  #   没填」的中间态。未设置该变量时 job 的 if 为假 → 显示为 skipped（工作流整体仍 success），
  #   不产生任何对控制面的请求，也就不会「每次推 main 都刷一条失败」。
  # 启用方式（adopt 之后）：gh variable set OPENSHIP_PROJECT_ID --body proj_xxx
  #                        gh secret  set OPENSHIP_TOKEN
  deploy:
    needs: [unit, gates, web, smoke]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.OPENSHIP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # secret 不能在 job 级 if 里判，但可以在 step 里判：变量配了而 secret 没配属于配置错误，
      # 应当**响亮失败**（而不是静默跳过——静默跳过会让人以为「已经部署了」）
      - name: 校验凭据齐备
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
        run: |
          if [ -z "${OPENSHIP_TOKEN}" ]; then
            echo "::error::repo variable OPENSHIP_PROJECT_ID 已设置，但 secret OPENSHIP_TOKEN 缺失。"
            echo "adopt 之后需一并配置：gh secret set OPENSHIP_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
      - name: 触发 openship 部署（按本 commit 锚定）
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
          PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
          # 控制面地址做成变量是为了换环境不改工作流；缺省即公司控制面
          OPENSHIP_URL: ${{ vars.OPENSHIP_URL || 'https://deploy.hookflow.cn' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "openship: project=$PROJECT_ID commit=$COMMIT_SHA"
          # commitSha 是幂等键：同一个 sha 重复触发不会部署出两份不同的东西。
          # 只发触发、不在 CI 里轮询到 live——构建状态归 openship（deploy/openship-adopt.md 第 7 节）
          #
          # 部署互斥（2026-09-14 实测，PR #55/#56 连续合并踩到）：同项目已有部署在跑时，
          # API 回 403 body "A deployment is already in progress"——这不是错误，等待重试即可
          # （curl 不用 -f：-f 会把 403 的 body 丢掉，无法区分「互斥等待」与「真失败」）。
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /tmp/openship-deploy.json -w '%{http_code}' -X POST "${OPENSHIP_URL%/}/api/deployments" \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"projectId\":\"${PROJECT_ID}\",\"branch\":\"main\",\"commitSha\":\"${COMMIT_SHA}\",\"environment\":\"production\"}")
            if [ "${CODE:0:1}" = "2" ]; then
              echo "openship 响应（HTTP ${CODE}）："
              cat /tmp/openship-deploy.json
              exit 0
            fi
            BODY=$(cat /tmp/openship-deploy.json 2>/dev/null || true)
            echo "第 ${i}/10 次触发：HTTP ${CODE} ${BODY:0:200}"
            # 仅对「部署互斥」重试；其他错误（401/403 授权、4xx 参数）立即失败
            if ! grep -q 'already in progress' /tmp/openship-deploy.json 2>/dev/null; then
              echo "::error::部署触发失败（非互斥错误，不重试）"
              exit 1
            fi
            echo "既有部署在跑，30s 后重试"
            sleep 30
          done
          echo "::error::等待既有部署完成超时（约 5 分钟）——去控制面看卡住的部署"
          exit 1

  # 提交纪律的**事后绊线**（不是门禁，理由见文件头注）。触发面：push 到 main。
  #
  # 判据用 `GET /repos/{owner}/{repo}/commits/{sha}/pulls`，而**不是"数父提交有几个"**：
  # squash / rebase 合并产生的新提交同样是单父的，数父会把正常的 squash 合并误判成直推。
  # associated-pulls 接口对 squash/rebase 合并返回的正是那个 PR，这才是我们要的语义。
  #
  # 已知边界（照实记，别当它滴水不漏）：
  #   ① push 事件的 `commits` 数组上限 20 条，一次推 20+ 条时只查前 20；
  #   ② **只删提交的 force push**（"把我那次直推抹掉"最自然的动作）其 `commits` 为空 ——
  #      无对象可判。此时本 job 必须打印"无法判定"，**绝不能**在空集上报"均经由 PR"：
  #      空集上给出肯定结论比不说话更糟（那是主动作伪证，不是沉默）；
  #   ③ 直推一条**已经有开着的 PR** 的分支到 main（`git push origin mybranch:main`），
  #      关联 API 会照常返回那个 PR ⇒ 判不出来。这是判据的语义边界，不是本 job 的 bug。
  # 要精确覆盖 ②③ 须改用 compare API 并处理"force push 时 before 不是祖先"，不划算。
  main-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # 不需要 checkout：只查 API，不碰工作树
      - name: 检查本次推送的提交是否经由 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          set -euo pipefail
          # 首次推送（新仓）before 是全 0，没有可比对的历史 —— 不判直推
          if printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            # 变量必须写成 ${VAR}：紧跟其后的是全角括号「）」，而 bash 3.2（macOS 自带
            # /bin/bash，本仓开发机就是）在 UTF-8 locale 下会把 0x80 以上的字节也当成变量名
            # 的合法字符 —— `$BEFORE）` 会被解析成变量 `BEFORE）`，在 set -u 下直接
            # "unbound variable" 退出 1。也就是说：**这条本意是「安全跳过」的分支，会在
            # bash 3.2 上把 job 弄挂**。CI 用的是 bash 5（解析正确，实测 5.2.37 无此问题），
            # 所以只坑本地复跑；加花括号在两种 bash 上都正确，故一律用 ${}。
            echo "首次推送（before=${BEFORE}），跳过本次判定。"
            exit 0
          fi

          offenders=''
          checked=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            checked=$((checked + 1))
            # PR 关联查询带**重试退避**（issue #22）：GitHub 对 squash 提交与其 PR 的关联是
            # **异步索引**的 —— job 跑得越快，越容易在索引可见之前发问，拿到 0 而误判「直推」。
            # 实测（2026-09-12 合并 #21）：push 后 4 秒查得 0；同一 SHA 数分钟后查得 1；
            # 同一 job 重跑即绿。**不是偶发** —— 该 job 此前 12 次合并都在 ~4s 内就查到了关联，
            # 说明这是**尾部竞态**而非常态延迟，故 0 **不立即判罪**，退避重试足以覆盖。
            # 预算 5 次 × 12s ≈ 60s（job 的 timeout-minutes: 5 余量充足）。重试**逐次打印**，
            # 让等待可见 —— 别把红绿的区别藏进静默重试。
            #
            # **刻意不加「subject 以 (#N) 结尾即放行」的快路径**（issue #22 曾提议）：那会把本
            # 守卫从「用 API 实证」降级为「信提交消息文本」，任何人给直推提交尾巴补一个 (#N)
            # 即可绕过 —— 而这条绊线存在的意义正是拦住那个动作（见 runbook 第三节）。
            # API 关联无法伪造：不带真 PR 就查不到。
            tries=0
            count=0
            while :; do
              tries=$((tries + 1))
              count=$(gh api "repos/$REPO/commits/$sha/pulls" --jq 'length')
              [ "$count" != '0' ] && break
              [ "$tries" -ge 5 ] && break
              echo "  · $sha 暂时查不到 PR 关联（第 $tries/5 次）——可能是索引延迟，12s 后重试"
              sleep 12
            done
            if [ "$count" = '0' ]; then
              echo "  · $sha 退避重试 $tries 次后仍无 PR 关联 ⇒ 判为直推"
              offenders="$offenders $sha"
            fi
          done < <(printf '%s' "$COMMITS" | jq -r '.[].id')

          if [ -n "$offenders" ]; then
            echo "::error::检测到未经 PR 直接进入 main 的提交：$offenders"
            echo "本仓约定走 PR（背景见 deploy/branch-protection-runbook.md）："
            echo "    git switch -c <分支名> && git push -u origin <分支名> && gh pr create --fill"
            echo "确属有意直推（bootstrap / 紧急热修）时，请在 issue 或 PR 里补一条说明，"
            echo "以免事后无从追溯 —— 这条绊线要的是'可见'，不是'禁止'。"
            exit 1
          fi

          # 空集必须说"判不了"，不许说"干净"：只删提交的 force push 会走到这里，
          # 在空集上打印"均经由 PR"是主动作伪证（见文件头注的边界②）。
          if [ "$checked" -eq 0 ]; then
            echo "本次推送没有可供检查的提交（commits 为空，常见于仅删除提交的 force push）——"
            echo "**无法判定**本次是否绕过了 PR，故不报绿、也不报警。若确有过直推并被抹掉，"
            echo "请以 \`git log origin/main --first-parent\` 人工对一次。"
            exit 0
          fi

          echo "本次推送的 $checked 条提交均经由 PR。"
