# ci.yml — 全门禁接入（M0 计划 Task 21；测试门禁 C1/C3 的持续执行面）
#
# 四个 job 的分工（都不重叠、都必绿）：
#   unit  —— 单元/集成测试：`pnpm test`（各包 vitest + 仓根 scripts 的守卫单测）。
#            【必须挂 PG】apps/server 有 11 个测试文件里的**真库分组**在无 DATABASE_URL 时整体跳过。
#            两种写法并存，枚举时别只 grep 一种：`describe.skipIf(!dbUrl)(...)` 与
#            `const describePg = dbUrl ? describe : describe.skip`。
#            清单：loader / app / tenant / migrate / demo-tenant-isolation / storage-injection /
#            data-query.e2e + routes/{auth, auth-wecom, auth-wechat-oa, admin}，共 156 条
#            （2026-09-30 实测：`env -u DATABASE_URL pnpm --filter @platform/server test`
#            → 73 passed | 156 skipped；加真库测试后请重跑这条命令把数字与清单改准）。
#            不给 DATABASE_URL 时它们是**静默跳过**的——「全绿」会绿在一个休眠基线上：
#            会话/登录/登出/租户解析/seed/迁移/装载器/企微登录/公众号访客/存储注入/数据问数
#            这半边一条都不执行。
#   gates —— 门禁：typecheck（全 workspace 包 + scripts/）+ 十个守卫脚本对真实仓跑。
#            typecheck 与守卫单测（跑在 unit 的 test:guard 里）是两件事：单测拿 fixture 验
#            守卫逻辑，本 job 拿真仓验守卫结论，且 typecheck 只在 CI 真跑才有意义。
#            十个守卫里 check-tenant-isolation 与 check-data-dependencies 要真库（一次性库真库对账，
#            issue #77 与数据宪法 §9-2），故本 job 也挂了
#            postgres service——为什么不是挂在 unit / smoke，见那条 step 的注释；
#            只有 check-duckle-catalog 要 Python（真跑 duckle 引擎），见那条 step 的注释。
#   web   —— 前端单测 + 构建（构建内含 `tsc -b`，即 apps/web 的 strict typecheck）。
#   smoke —— 装载冒烟（scripts/smoke-load.mjs）：真进程 + 真端口 + 真 HTTP 跑双形态。
#            与 unit 的差别是「进程内直调 app」覆盖不到的那一层（启动期装配、Host 语义、
#            静态托管）。**必须先构建 web**：冒烟要断言 /assets/* 吐的是构建产物本体，
#            dist 不存在时该断言无从谈起（见 smoke job 内注释）。
#
# 冒烟的环境变量由 scripts/smoke-load.mjs 自持（端口/PUBLIC_ORIGIN/会话密钥/Casdoor 管理员
# 凭据/SEED_DEMO 全是脚本内常量，见该文件头注②）——CI 只注入 DATABASE_URL（service 地址，
# 环境相关、无法内联）。单一事实源在脚本里，改端口不需要动本文件，杜绝两边各写各的漂移。
#
# 第五个 job `deploy` 是 CD 触发面，**默认惰性**（未 adopt 前连跑都不跑，见该 job 的注释）；
# 接入方式与前置决策在 deploy/openship-adopt.md。
#
# 第六个 job `main-guard` 是提交纪律的**事后绊线，不是门禁**：本仓是私有仓 + org plan=free，
# GitHub 的 branch protection / rulesets 在该 tier 上不存在（见 deploy/branch-protection-runbook.md），
# 服务端拦不住直推，只能靠本地 pre-push 钩子 + 这个事后检查。它跑在 push 到 main **之后**，
# 此时 main 已经被改了——价值不在"阻止"而在"让绕过流程的推送可见、可追溯"。别把它当闸门用。
name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ['5432:5432']
        # health-cmd 是必需的：没有它 job 会在 PG 就绪前开跑，测试拿到连接失败而非断言失败
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgres://platform:platform@127.0.0.1:5432/platform'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # 版本读 package.json 的 packageManager（pnpm@11.22.0，与 lockfile 对齐）；不能再传 version 入参，否则 action 报 Multiple versions
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 本 job 里唯一的非静态守卫是 check-tenant-isolation（下面那条 step）：它按 issue #77 的
    # 决定**拿真库当真值**，故这里挂 postgres service。与 unit / smoke 的两个 service 块同形。
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgres://platform:platform@127.0.0.1:5432/platform'
    steps:
      # fetch-depth: 0 是下面两条纪律守卫的**前置**，不是可选优化：两条都拿
      # `origin/<base>` 做 diff/log 的范围端点，浅克隆（默认 depth=1）下该 ref 不存在 ⇒
      # `git log origin/main..HEAD` 直接失败 ⇒ 脚本走「无提交需要检查」而 **exit 0 静默通过**
      # ——守卫看着绿，实则一次都没跑。宁可慢一点，也不要一个会空转的门禁。
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 聚合 typecheck：`pnpm -r --if-present typecheck`（5 个 workspace 包）+ 仓根
      # tsconfig.json（scripts/ 的 .mjs/.ts；根不是 workspace 包，-r 扫不到，故必须单独跑）
      - run: pnpm typecheck
      # 守卫脚本对真实仓跑：干净必须 exit 0（单测里的 fixture 用例不能替代这一步）
      - run: pnpm exec tsx scripts/check-manifests.mjs
      - run: pnpm exec tsx scripts/lint-architecture.mjs
      - run: pnpm exec tsx scripts/check-compose.mjs
      - run: pnpm exec tsx scripts/check-env-example.mjs
      # 集成判据门禁（spec 2026-10-31 §2.5「声明即判据」）：新增 notify 通道 provider
      # 或新出站集成，必须在 deploy/integration-registry.json 登记活性判据（或带理由豁免），
      # 否则这里红——否则探针永远只盯老的那几个集成，「装完就忘」照旧。
      - run: pnpm exec tsx scripts/check-integrations.mjs
      # 开源边界门禁（正典 docs/architecture.md §4.1 **B12**；2026-10-20 人决策：platform-core 公开、
      # case-engine 私有）。本仓是**公开仓**，不变量是「外部 clone 即可独立构建与运行」——一旦依赖
      # 私有件，外部构建必失败而**本仓 CI 全绿**（加一行 dependency / 一个 submodule 都是静默的），
      # 故机械锁死。四条判据：① 无 `.gitmodules`；② `publishConfig.registry` 与任何 `.npmrc` 的
      # registry 声明都指向**公开**主机（白名单在脚本里）；③ 依赖名不命中私有件名单（含
      # `pnpm.overrides`）；④ 源码无私有包 import/require。
      # ⚠️ 判据 ③④ 是**名单式**：新增私有件必须往脚本的 `PRIVATE_PACKAGE_PATTERNS` 加名字，否则认不出。
      # 纯静态：只读仓内文本，不连库、不取网络，秒级。
      - run: pnpm exec tsx scripts/check-no-private-deps.mjs
      # dbt 工件静态门禁（issue #150 / T4；正典 docs/architecture.md §5.1）：staging 的 `r['列名']`
      # 取列模式 / 禁 `::double` / 禁 `union_by_name` / staging 一对一双向 / 语义声明必填字段 /
      # 指标命名空间与同名唯一 / 每个声明指标一条对账 test。纯静态：不连库、不读 parquet。
      # ⚠️ 它的扫描面只有 `dbt/`（dbt 工件）——**不含** env 键（那归上面的 check-env-example，
      #    而 B9 不扫 dbt/）；`contracts/` 与 `duckle/` 的**列集**由下面那条 check-data-contract 管
      #    （2026-10-05 起，issue #430；正典 docs/architecture.md §5.2）。
      - run: pnpm exec tsx scripts/check-data-models.mjs
      # 数据新鲜度双车道的静态门禁（路线图 2026-11-24 §4 的 A4/A5）：
      #   A4 每个 incremental 模型恰好属于一个车道（10m / 1h / daily）；漏归属/重复/越界即红；
      #   A5 1h 起点必须紧随最后一个小时级采集偏移，10m 物化偏移必须与采集 tick 对齐。
      # 纯静态：读 dbt 模型、console 排班、registry 与 scripts/lemeng/data-lanes.json，不连库。
      - run: pnpm exec tsx scripts/check-data-lanes.mjs
      # W4 语义完备门禁（#1447）：实体必填四字段 + 指标 entity 引用闭合 + 维度层级可校验列。
      # 纯静态（只读 dbt/semantics 与 contracts/），不连库。
      - run: pnpm exec tsx scripts/check-semantics.mjs
      # 不变量生成的 dbt test 必须与声明同步（改了 invariants.yml 忘了重生成 ⇒ 红）。
      - run: pnpm exec tsx scripts/gen-invariant-tests.mjs --check
      # 数据契约注册门禁（正典 docs/architecture.md §5.2 ① / 不变量 B10；案例 = order_total_money
      # 补采 #430/#432）。判据三条：① 契约必须有 `schemaVersion`；② 凡**文本里写着该契约
      # `layout.prefix`** 的管线都算它的生产者（机械推导、不靠手登记），每个生产者文件里必须
      # **恰好一个** `code.sql` 节点的输出列与契约**逐列同序**；③ 对应 staging 模型的投影
      # （去掉 dbt 注入的 `org`）同样逐列同序。
      # 它防的是「加一列要改 5 处、漏改一处没人拦」——在它之前 `contracts/` 与 `duckle/` 无任何机检。
      # 纯静态：不连库、不读 parquet。
      - run: pnpm exec tsx scripts/check-data-contract.mjs
      # 血缘单调门（issue #780；spec 2026-10-17 §4.3；正典 docs/architecture.md §4.2）。判据：源列
      # `sensitivity != none` 且被某指标的 `reads` 申报 ⇒ 该指标必须有 `required_scope`；另，`reads`
      # 指向契约里不存在的列也报（打错的名字会让门**以为**没读它而放行）。
      # ⚠️ **只查「申报的单调性」，查不到「漏申报」**——完整性要 contract→staging→marts 的列级血缘，
      #    仓内**不存在**（无 dbt manifest / 无 parser）。少写一条 reads 就绕过本门，**这是已知弱点**。
      #    别为此加「按名字在 expression 里模糊匹配」的启发式：假阳性会淹掉真违规。
      # 纯静态：只读 contracts/** 与 dbt/semantics/l1_metrics.yml，不连库、不取网络，秒级。
      - run: pnpm exec tsx scripts/check-column-scope-monotonicity.mjs
      # 生成物 == committed：契约一处改，投影由 scripts/gen-data-projection.mjs 生成。
      # 手改投影/漏跑生成器 ⇒ 这里红（B10 已降级为保险丝）。
      # ⚠️ 契约未回填 `expr` 时生成器**跳过**该契约（打印一行提示，不是红）——存量回填后此闸才覆盖其产出。
      - run: pnpm exec tsx scripts/gen-data-projection.mjs --check
      # 件① 表单字段级通路（#2706）：dataPlane 表单的字段契约与摊平模型同样「生成物 == committed」。
      # 无 DATABASE_URL / forms 迁移未跑（CI 的裸 service 库）时打一行跳过并 exit 0——本闸的牙齿
      # 在有真 forms 库的环境（本地 / ops 机）。
      - run: node scripts/gen-forms-data-projection.mjs --check
      # 件② 目标件（#2708）：goals.yml + l1_metrics.yml + 表单契约 → 两段生成关系同样「生成物 == committed」。
      # 纯静态（不连库）⇒ CI 每次真跑；它也核对每条 goal×metric 的 L1 声明引用生成列（生成器 ↔ 手写指标咬合）。
      - run: node scripts/gen-goal-achievement.mjs --check
      # fct 度量列生成区（P3.0 聚合面组件化 / issue #1012；P3.2 起为正式列 #1020）：
      # `fct_retail_sale.sql` 里 `-- BEGIN/END GENERATED MEASURES` 之间由 `l1_metrics.yml` 的
      # measure 生成（基面 where 来自具名行域、两阶段编译）。判据 = **标记区逐字节 == 生成物**：
      # 手改区内 ⇒ 这里红（生成区是声明的唯一投影，手改它就会让线上列与 `l1_metrics.yml` 悄悄
      # 漂移；值级漂移由 audit_* 独立复算（直打 parquet、不读生成物）在 fct 粒度上守）。区外改动不受影响。
      # 纯静态：只读仓内文本，不连库、不跑 dbt。**怎么修**：跑
      # `pnpm exec tsx scripts/gen-fct-measures.mjs` 重新生成后一并提交。
      - run: pnpm exec tsx scripts/gen-fct-measures.mjs --check
      # 数据面投递门禁（issue #199；正典 deploy/data-plane-deploy-sop.md §E.3）：判据三条——
      # ① lock 首行自校验（截断/被改必对不上）；② lock ↔ 工作区逐文件 sha256/落地路径/模式一致
      # （**改了清单覆盖的任一文件却忘了重跑生成器，这里红**——S1 之前 dbt/ 有 5 个文件静默漂在
      # d2de3b1 就是这么漏的）；③ 消费面覆盖：脚本里每个 `$REPO/<路径>` 引用都要被清单的落地路径
      # 集合覆盖（防「新引一个路径、清单忘登记」复发——SOP 原先自述消费面「唯一一例」，实测 7 条）。
      # 纯静态：不连库、不取网络。**怎么修**：跑 `pnpm exec tsx scripts/lemeng/data-plane-lock.mjs`
      # 重新生成 deploy/data-plane.lock（失败信息里会复述这条命令）。
      - run: pnpm exec tsx scripts/check-data-plane-lock.mjs
      # 增量 lookback / 审计窗口 / 重述窗口三者咬合（#2428）：模型 incremental_cutoff(N) 必须
      # 与 materialize.sh 的审计窗口一致、≥ recon-restate 最深日 + 1；偏离默认档的模型要登记理由。
      # 2026-11-17 实测过 lookback=7 而 restate 深度 9 ⇒ T-8/T-9 静默漏检 + 全史审计必红。
      # 纯静态：不连库、秒级。怎么修：同步三处数字（见失败信息）。
      - run: pnpm exec tsx scripts/check-lookback-consistency.mjs
      # console 排班↔能力完整性（issue #531）。盯的是**今天没有任何门禁盯的那条耦合**：
      # `schedules/<账套>.json` 的 `pipeline_id` 与管线文件集的事实源关系——① 引用了不存在的管线
      # （拼写错/漏生成）② enabled 引用**他账套**后缀管线 = SOP §F.1 的危害形态（一账套一 console
      # 的本体是凭据/env 隔离，错账套排班会**静默采错数据**）。纯静态：只读仓内 JSON，秒级。
      - run: pnpm exec tsx scripts/check-console-schedules.mjs
      # 平台调度脚本必须容器内可跑（#2728）。盯的是「业务 job 被建到 openship」的**唯一借口**：
      # 脚本依赖宿主路径（/opt/...）或 docker CLI ⇒ 它在 worker 容器里跑不了，于是只能留在 openship，
      # 违背「业务定时进平台」（Wave 6/8）。纯静态：解析 registry.ts 的 script 字段，只扫**代码行**
      # （头注里的历史说明不算），命中即红。怎么修：改脚本走 DSN/服务名 HTTP，或在
      # scripts/check-job-scripts-portable.mjs 的 HOST_ONLY_ALLOW 登记（基建 job 才允许）。
      - run: node scripts/check-job-scripts-portable.mjs
      # 排班分配（2026-11-08，P0）：小时档按实测耗时排 1 分钟槽，同账套不重叠；
      # 长管线（dim.item 525s）放 :02，允许跨一个 tick（最多 1 采集 + 1 tick）。
      # 改耗时表/新增管线后重跑 `pnpm exec tsx scripts/gen-schedules.mjs`。
      - run: pnpm exec tsx scripts/gen-schedules.mjs --check
      - run: pnpm exec tsx scripts/check-schedule-conflicts.mjs
      # 源清单（manifest）↔ 生成物一致性（P1，2026-11-07）：deploy/duckle/manifests/*.json
      # 必须合法，且与 pipelines/<id>.json（已晋级）或 manifests/generated/<id>.json（试点）逐字一致；
      # 改 manifest 不重生成 / 手改生成物 ⇒ 这里红。纯静态：只读仓内 JSON。
      - run: pnpm exec tsx scripts/check-source-manifests.mjs
      # 库存快照变体生成物 == committed（#1079）。catchup / backfill 两个变体由主管线
      # `lemeng.inventory.snapshot.l0.3120` 机械派生（只差窗口 token / 管线名 / 空集文案）——
      # 改了主管线（加页、改契约、改窗口）却没重跑生成器 ⇒ 这里红。纯静态：只读仓内 JSON。
      # **怎么修**：node scripts/lemeng/gen-inventory-snapshot-variants.mjs 后一并提交。
      - run: node scripts/lemeng/gen-inventory-snapshot-variants.mjs --check
      # console 告警覆盖门禁（issue #565）。盯的是**今天没有任何门禁盯的那条耦合**：
      # `schedules/<账套>.json` 里**被调度**的管线 ↔ `alerts.<源>.json` 里**含 failure 的规则集**。
      # 案例（2026-10-10；PR #562 实证）：`lemeng.dim.item_price.l0.3120` 定时 429 失败、群里一声不响——
      # 引擎侧完全正常（**没有规则命中就不发**），缝在规则集与排班之间：规则只按**形态末段**分组
      # （`lemeng.dim.*.l0`），覆盖不到带**账套号后缀**的 id。判据：① 规则完整性（缺 `channel` 会让
      # **整个文件作废**、所有告警一起死）② 被调度管线必须有同源且含 `failure` 的规则覆盖
      # ③ 死规则（`match` 拼错/写窄 ⇒ 等于没写）。glob `*` **跨 `.`** 按引擎台账实测钉住。
      # 纯静态：只读仓内 JSON，不连库、不取网络，秒级。**怎么修**：补 `alerts.<源>.json` 的规则
      # （失败信息会点名缺覆盖的管线 id）；确需豁免的写进脚本 `EXEMPT` 并附理由。
      - run: pnpm exec tsx scripts/check-console-alerts.mjs
      # 只读诊断工具静态门禁（P7；正典 `docs/superpowers/specs/2026-09-29-diagnostic-tool-replacement.md`
      # §5.1 P7）。它盯的是**今天没有任何门禁盯的那条耦合**：`recon` 的容量闸 `RECON_PAGES` /
      # `RECON_PAGE_SIZE` 与网关调用形状的事实源（🔴 2026-09-29 改向：**在用的** L1 子管线
      # `deploy/duckle/console/pipelines/lemeng.retail_order_line.window.json` 的 12 个 `src.rest` 节点；原指已退役的 `duckle/common/lemeng.retail_order_line.json`）必须同源。管线分了 13 页、工具还按 12 页翻 ⇒ 末页守卫永不触发 ⇒
      # 网关侧**悄悄少算一页**，而 `RECON bizday=… lake_rows=… gateway_rows=…` 看着一切正常 ——
      # 这是**静默错**（退出码、字面量、人眼全绿，只有数字错了）。
      # 六条判据：① 工具在场 + 可执行位 ② 清单落地条目 0755 ③ E6 退出码契约字面量在场
      # ④ 湖侧 SQL 点名单文件 / 写 s3:// / 不带 hive_partitioning ⑤ 容量闸同源 ⑥ 网关 body 键集合同源。
      # 纯静态：不连库、不取网络、不起容器（读两份文本 + 一次 stat）。
      - run: pnpm exec tsx scripts/check-diagnostic-tool.mjs

      # MCP 工具面门禁（spec 2026-10-21 §8）：分析师面工具数 ≤14 / tools/list ≤10KB /
      # 命名 [A-Za-z0-9_.-] / mutating 工具必须带注解与 scope。
      # 事实源 = toolbox/registry.ts 的 ANALYST_TOOLS（显式 .ts import；registry 是纯的，
      # 这条 import 链不拉运行时依赖——registry 头注有约束）。判据单测在 test:guard（unit）。
      - run: pnpm exec tsx scripts/check-mcp-toolface.mjs
      # openclaw 插件工具契约回归（#989）：插件目录不在 pnpm workspace（deploy/ 不进 -r 递归），
      # pnpm test 扫不到 ⇒ 显式跑 node --test（发现 *.test.js：lib/scope/contracts 三份）。
      # contracts.test.js 钉「生成物工具名 ⊆ openclaw.plugin.json contracts.tools」——
      # 网关按声明放行工具，漏登即真机拒载（Wave 2 三新工具在 shanhai 实锤过）。
      - run: node --test
        working-directory: deploy/openclaw/data-query-plugin
      # wecom-app 插件（#1238）同律：contracts 钉「注册名 ⊆ contracts.tools」+ fail-closed 顺序锚。
      - run: node --test
        working-directory: deploy/openclaw/wecom-app-plugin
      # 回填工具链的行为测试（issue #387；判据正典 spec `2026-09-29-read-side-migration.md` §4 Phase 0/1）。
      #
      # 为什么它该进 CI（而别的 `.test.sh` 没进）：本工具的判据是**数字与顺序**——Phase 0 探针必须
      # =19 行（18 列）、批后必须 =25 行（24 列）、批次表必须「bizday 降序 + 3120/09-23 最后」。
      # 这些一旦漂移，回填会以**看起来一切正常**的方式把混代湖写坏（最老分区先变 24 列 ⇒ 整湖混读
      # 以 `schema mismatch in glob` 整挂，spec §4.0/B-3），而**静态守卫看不见数字**。
      # 它是纯 sh（从脚本里抽真函数测，不复制实现）：不连库、不取网络、不起容器，秒级。
      - run: sh scripts/lemeng/backfill-retail-order-line.test.sh
      # 闭环驱动（`recon-day-heal.sh`）的**判别逻辑**测试（issue #426；正典 §1.4.1 定稿线的失败动作）。
      #
      # 为什么它该进 CI：本工具的判据是「**该不该往生产写**」——把「我们的通道/身份坏了」（cross/
      # lake/gateway/assert）**误判成「数据缺了」**，它就会在错误状态下触发**整日回填写生产分区**。
      # 这类漂移没有任何静态守卫看得见（脚本语法对、字面量对、退出码对，只有**判别面**错了）。
      # 同为纯 sh（抽真函数测，不复制实现）：不连库、不取网络、不起容器，秒级。
      - run: sh scripts/lemeng/recon-day-heal.test.sh
      # 封版判定（`seal-lake.sh` 的 `seal_verdict`）的测试。放行错了，读者的 fail-closed 断言就会
      # 拿一个**半写的湖**当完整的用 —— 那正是实测踩过的静默错（392 行 vs 完整 796 行，rc=0）。
      - run: sh scripts/lemeng/seal-lake.test.sh
      # 独立通道对账（`recon-preagg.sh`）比较块的测试：平 / 漏店 / 超阈值 / **未定稿只报数** / 端点坏。
      # 「未定稿不判红」那条尤其要钉住——退货可能晚于定稿日到，判早了就是噪声。
      - run: sh scripts/lemeng/recon-preagg.test.sh
      # 「业务规则只定义一次」门禁（architecture §4.1 **B11**；issue #831 → #917 → #920）。判据四条：
      #   ① dbt 三份副本（构件 + 两个复算）里该带的赠品判别式逐字在场；
      #   ② **反向断言**：对账链路（脚本 `SQL_PLATFORM` + 所有 `lemeng.recon.preagg*.json` 的 `code.sql`）
      #      **不得出现口径原子**——对账是消费者，自带一份等价算式即红；
      #   ③ 消费者必须指向 `fct_retail_sale`（只断言「没口径」不够：也可能悄悄读别的表）；
      #   ④ 容差地板与 `dbt/seeds/recon_tolerances.csv` 同源。
      # 它盯的是 `deploy/data-plane.lock` **管不到**的那条耦合：lock 只保文件哈希、不保语义等价。
      # **已真实发生两次**，两次都是「同一业务规则出现两个并列实现、靠人手同步」：
      #   · #813：脚本净额容差地板 200.00、管线 1.00 ⇒ 一侧判 DRIFT、一侧判死 ⇒ 排班面天天假红；
      #   · #917：退货侧赠品判别式只改了构件与复算，两份对账副本没跟 ⇒ 净额系统性偏大（3120/10-17 差 130.79）。
      # 纯静态：不连库、不取网络、不起容器、不读 parquet，秒级。
      - run: pnpm exec tsx scripts/check-recon-caliber.mjs
      # 物化命令真身（`materialize.sh`，issue #679）的判别面测试。三条判据都在防**静默错**：
      # ① `--select` 名单悄悄长回命令里 ⇒ #677 假绿结构性复发（解析数涨、执行集不变、run 照绿）；
      # ② env 从「-e VAR 只透传键名」退化成「-e VAR=value」⇒ 密码进 ps（静默，被 ps 的那一刻才泄漏）；
      # ③ 缺值 fail-fast 守卫被拆 ⇒ 跑到 dbt 连库才炸，晚失败难定位。
      # 纯 sh（从脚本里抽真函数测，不复制实现）：不连库、不取网络、不起容器，秒级。
      - run: sh scripts/lemeng/materialize.test.sh
      # 回归 verdict 的**可见性投递**（`emit-probe.py`，#1583）。判据三态：dry-run 只出 JSON、
      # env 缺键 ⇒ 2、投递失败 ⇒ 1。放行错了的后果是「红了但没人知道」——2026-11-07 实测
      # openship job 通知不进站内 deliveries，数据面只能靠 OO `data_plane_probes` → 企微。
      # 纯 Python（不连真 OO、不发网络；投递失败用本机拒绝端口模拟），秒级。
      - run: sh scripts/lemeng/emit-probe.test.sh
      # 检出清点/清理（`sync-data-plane.sh`，issue #683）的「**该不该删**」判别面测试。四条都在防静默错：
      # ① 清点基准 = lock 落地路径列（不是「磁盘上有即有罪」）+ **作用域只到 manifest 目录型条目的
      #    子树**（用例 R/S）⇒ 退化成全树判死会把整检出连 384 个引导残留一起错杀；
      # ② 机器本地物 allowlist 存活 ⇒ 漏一项就把 deploy/.env 这类真机配置 prune 掉（数据面当场断）；
      # ③ 两类崩溃残留（`..data-plane-revision.tmp.*` / `.sync-tmp.*`）必须清 ⇒ 漏了孤儿继续积；
      # ④ `--check` 只读且退出码只看 DRIFT ⇒ 变了就把现有探活/审计调用方原地翻红。
      # 纯 sh（假 curl + 真 sha256）：不连库、不取网络、不起容器，秒级。
      - run: sh scripts/lemeng/sync-data-plane.test.sh
      # 清点/清理**作用域**与清单的一致性门禁（issue #683）。上面那条钉的是「该不该删」的**判别面**，
      # 这条钉的是**作用域本身的事实源**：`PRUNE_ROOTS`（写死脚本内）= 清单里目录型条目的落地前缀，
      # 两处漂移都不自己叫 —— ① 清单新增目录条目而脚本那行没跟 ⇒ 新树里的孤儿**静默漏清**（正是
      # #683 实证的形态：`x01_branch_region.csv` 退役后在检出里永生、被 dbt 每天当僵尸 seed 加载）；
      # ② 脚本多写一个清单不覆盖的根 ⇒ 作用域超出授权、prune 会删清单没登记的件。
      # 第三条判据防作用域**退化**：某条目录条目的落地路径写成检出根本身 ⇒ 作用域变回「整个检出」。
      # 纯静态：只读清单文本 + 脚本文本，不连库、不取网络，秒级。
      - run: pnpm exec tsx scripts/check-prune-roots.mjs
      - run: pnpm exec tsx scripts/check-shell-cjk-vars.mjs
      # 租户隔离门禁（issue #77；正典 docs/module-protocol.md「租户数据隔离」）：真库对账——
      # 真跑各模块的 migrations（跑进脚本自建的**一次性库** platform_tenant_isolation_check），
      # 再查 information_schema 要 org 列。判据按「全部 migrations 的累积终态」，不按文件判
      # （demo 的 org 是 003 才补的，按文件判会误报模板文件——issue #77 §三）。
      #
      # **为什么挂在 gates，而不是 unit / smoke**：
      #   · gates 是「守卫脚本对真实仓跑」这一族；本脚本是第五条，与上面四条同址 ⇒ 找门禁的人
      #     只需看一处，不必按「要不要真库」把守卫族拆到两个 job 里。
      #   · unit 的语义是「跑测试」（本门禁的 fixture 单测就在那儿，走 pnpm run test:guard 的
      #     `vitest run --dir scripts`）——真仓判定也塞进 unit，「测试红了」与「守卫判定仓库
      #     有违规」就同色了，排障要靠读日志而不是读 job 名。
      #   · smoke 的语义是「真进程 + 真端口 + 真 HTTP」，且它必须先构建 web（分钟级）又最易
      #     flaky：把一条确定性的 schema 门禁挂上去，会让 flaky 冒烟与租户隔离违规同色，
      #     且违规反馈被 web 构建延迟。issue #77 那句「复用 smoke job 已有的 postgres service」
      #     是**服务复用**的省事建议（少写十行 service 块），不是「挂 smoke job」的决定；
      #     本 job 自己挂一个同形状的 service，代价是并行 job 各起一个 PG 容器。
      # 权限：CI 的 platform 角色是 POSTGRES_USER（超级用户）⇒ 有 CREATEDB；脚本权限不足时
      # **响亮失败**（不静默跳过）。
      - run: pnpm exec tsx scripts/check-tenant-isolation.mjs
      # 数据依赖门禁（正典 docs/module-protocol.md「跨模块只读数据依赖」判据 2；数据宪法
      # 2026-11-23 §4/§9-2）：真库对账三方——manifest `dataDependencies` 声明集 ↔ 库实际列集
      # （宿主 + 全部模块迁移跑完后查 information_schema）↔ scripts/data-dependencies.lock.json
      # 登记。提供方对已声明发布物（稳定视图/带版本快照表）改列集 ⇒ 红，先 --write-lock 显式
      # 登记（同 PR 提交，登记即变更记录）；lock 陈条目、声明对象在库缺席同红。
      # 跨面声明（schema 不在本装配，如数据面 staging.*）结构性跳过——其列集契约归所属面纪律
      # （staging 归 B10），跳过数印在 OK 行不静默。
      # 与 check-tenant-isolation 同族（tsx + 一次性库 + 生产迁移执行器），共用本 job 的 postgres service。
      - run: pnpm exec tsx scripts/check-data-dependencies.mjs
      # 租户隔离第二道防线（B14；数据宪法 2026-11-23 §8「隔离纵深」）：纯静态——对**租户表**
      # （模块 migrations 里带 org 列的 create table / alter add column；global-table 标记的表除
      # 外）的 select/update/delete，SQL 字面量必须带 org。要么加 `org = $n`，要么写
      # `-- org-exempt: <理由>`（跨租户运维语句：保留策略清理、健康统计——有意的跨租户要可见）。
      # 边界：`where ${…}` 整体插值放行（静态不可判，计数印 OK 行）；插值在 SET 片段而 WHERE
      # 静态的**不放行**（否则 `update t set x=${片段} where id=$1` 整条漏网）。
      # 第一道（每表 org 列）由 check-tenant-isolation 管；本步补代码面那半。
      - run: pnpm exec tsx scripts/check-org-scope.mjs
      # 文档引用门禁（issue #771）。判据**只有一条**：**变更中的**文档里，能唯一解析到仓内文件的
      # `file:line` 引用，行号必须在范围内。
      #
      # ⚠️ **为什么不判「文件不存在」**——2026-10-17 全量实测（135 份文档 / 4658 处引用）：
      #    行号越界 4 处（**全是真错**，近零噪声）；文件不存在 538 处（收窄到仓内相对路径仍有 114 处
      #    / 39 份文档），其中绝大多数是**合法**引用（仓外 `explore 仓 docs/adr/…`、数据面
      #    `owners.json`、已迁移退役的 `duckle/common/*.json`、**计划里待建的文件**）⇒ 判了就是噪声，
      #    真违规会被淹掉。文件名歧义 337 处同理不判。**别好心把这两条加回来**。
      #
      # ⚠️ **为什么只查变更中的文档**：那 4 处越界全在两份**历史快照**里，而本仓纪律是
      #    「specs/plans 正文一律不改」（docs/architecture.md §6.1）⇒ 全量门会红 4 处而这 4 处不许改。
      #
      # ⚠️ base ref 解析不到时脚本**响亮失败**（不是静默 exit 0）——浅克隆会让 `git diff` 失败，
      #    当成「没有变更」就变成一次都没跑的假绿。本 job 的 checkout 已带 fetch-depth: 0。
      - run: pnpm exec tsx scripts/check-doc-citations.mjs "origin/${{ github.base_ref || 'main' }}"
      # 提交纪律装置校验（"守卫守卫本身"）：层①的钩子是本地文件、层②的自动安装是 package.json
      # 配置，两者任一被改掉，本地直推防线就静默失效——不会有任何报错，只会"从此刻起拦不住"。
      # 所以在 CI 里把它们钉死。（钩子的**行为**由 scripts/git-hooks.test.ts 覆盖，跑在 unit job）
      - name: 校验提交纪律装置完好
        run: |
          set -euo pipefail
          # git 只在钩子带执行位时才运行它——丢了执行位等于没有钩子
          if [ ! -x .githooks/pre-push ]; then
            echo "::error::.githooks/pre-push 缺失或不可执行（直推 main 将无人拦下）"
            exit 1
          fi
          node -e "
            const s = (require('./package.json').scripts || {}).prepare || '';
            if (!/install-git-hooks\.mjs/.test(s)) {
              console.error('::error::根 package.json 的 prepare 未指向 scripts/install-git-hooks.mjs（同事 clone 后不会自动装钩子）');
              process.exit(1);
            }
          "
      # 公司纪律守卫（push 事件的那半边；标准 templates/discipline/README.md「附：让 push 守卫也跑」）。
      #
      # 与上一条的关系：上一条「装置校验」守的是**层①**（本地 pre-push 钩子在不在），管的是
      # "直推拦不拦得住"；这两条守的是**层②**（提交本身合不合纪律），管的是"已经进来的东西讲没讲规矩"。
      # 补的正是纪律栈里唯一空着的一环——薄壳 discipline.yml 只在 PR 事件上跑，因此
      # `check-dev-discipline.sh`（commit 格式 / CHANGELOG 手改）在补这两条之前**全仓无人调用**。
      #
      # 注意 base 用 `github.base_ref || 'main'` 而非硬编码 origin/main：push 事件下 base_ref 为空，
      # 回落到 main；PR 事件下取真实基线分支（叠栈 PR 时基线不是 main）。
      - run: bash scripts/check-dev-discipline.sh "origin/${{ github.base_ref || 'main' }}" HEAD
      - run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" REPO="${{ github.repository }}" \
          EVENT="${{ github.event_name }}" PR="${{ github.event.pull_request.number }}" \
          BEFORE="${{ github.event.before }}" \
          node scripts/check-pr-discipline.mjs
      # 观测面命名门禁（issue #337；缺陷案例 #334）：**真跑 duckle 引擎**的 catalog build/lint。
      #
      # 为什么必须真跑引擎、不做静态检查：判据是「引擎能不能给节点**命名**」，而命名规则住在
      # 引擎里（哪些字段 required、连接字段合不合并…）—— 静态脚本要复刻这套规则，等于把
      # 引擎的实现抄一份进仓，**抄错就会静默放行**（正是本门禁要防的那种假绿）。
      # 代价实测可接受：pip install duckle==0.7.4 拉 31.6MB(duckle) + 21.3MB(duckdb-cli)，
      # 本机实测 16s；引擎只扫两份 JSON，秒级。
      #
      # 为什么放在 gates 的**末尾**：它是「守卫脚本对真实仓跑」这一族（上面六条同址 ⇒
      # 找门禁的人只看一处），但 Python 装配是本 job 最重的一步（~30s），显式放最后，
      # 让前面那些秒级守卫先失败先反馈。
      #
      # 引擎版本**从 Dockerfile 读**，本文件不写第二个版本号：CI 判的引擎必须与运行镜像同版，
      # 否则会出现「CI 绿 / 生产红」这类最难查的漂移。deploy/duckle/Dockerfile 的
      # ARG DUCKLE_VERSION 是唯一事实源（该文件也是本仓唯一的引擎版本落点）。
      # 不照抄 Dockerfile 的 `-i 清华源`：镜像在境内构建才需要，GitHub runner 直连 PyPI 更快，
      # 且镜像源同步有滞后（Dockerfile 里记着 aliyun 未同步 0.7.4 那件事）。
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 安装 duckle（版本取自 Dockerfile，与运行镜像同源）
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ARG DUCKLE_VERSION=//p' deploy/duckle/Dockerfile | head -1 | tr -d '[:space:]')
          if [ -z "${VERSION}" ]; then
            echo "::error::deploy/duckle/Dockerfile 里读不到 ARG DUCKLE_VERSION —— 版本事实源丢了，门禁拒绝跑"
            exit 1
          fi
          echo "duckle 版本（取自 Dockerfile）：${VERSION}"
          pip install --no-cache-dir "duckle==${VERSION}"
      - run: pnpm exec tsx scripts/check-duckle-catalog.mjs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/web test
      - run: pnpm --filter @platform/web build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: platform, POSTGRES_PASSWORD: platform, POSTGRES_DB: platform }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgres://platform:platform@127.0.0.1:5432/platform'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 先构建 web：冒烟要断言 GET /assets/<hash>.<js|css> 返回的是构建产物本体（与磁盘
      # 产物逐字节相同）而非 SPA 兜底的 index.html——Task 19 的白屏事故正是 serveStatic
      # 被摘掉后 /assets/* 落进 SPA 兜底、curl 一样 200 却整页白屏。dist 缺失时该断言
      # 无从谈起，故构建是冒烟的前置而非可选步骤（也是「curl 200 ≠ 页面可用」的机检化）
      - run: pnpm --filter @platform/web build
      # 再构建移动端（M3b-2）：H6 要断言 userApp 挂载点回的是移动端壳本体，
      # 而 loader 在 dist 不存在时**静默跳过挂载** ⇒ 不构建就等于让 H6 永远没得断。
      # @data/mobile 同理（spec 2026-11-01 §10.2 移动指标页）。
      - run: pnpm --filter @aftersales/mobile build
      - run: pnpm --filter @data/mobile build
      - run: pnpm exec tsx scripts/smoke-load.mjs

  # CD 触发：四个门禁 job 全绿后，让 openship 按本次 commit 部署（部署本身归 openship）。
  #
  # 惰性闸门为什么是 repo variable，而不是「配了 secret 就跑」：
  #   GitHub 的 job 级 `if` 只放行 github / needs / vars / inputs 四个上下文，**secrets 不在其列**
  #   （在 if 里引用 secrets 会直接报错）——「有没有配 secret」这个闸门在 job 级根本写不出来。
  #   vars 在 job 级 if 里可用，而 OPENSHIP_PROJECT_ID 本来就是 adopt 完成后必须人工回填的
  #   **必填参数**（POST /api/deployments 的 projectId），让它兼任开关就没有「开关开了但参数
  #   没填」的中间态。未设置该变量时 job 的 if 为假 → 显示为 skipped（工作流整体仍 success），
  #   不产生任何对控制面的请求，也就不会「每次推 main 都刷一条失败」。
  # 启用方式（adopt 之后）：gh variable set OPENSHIP_PROJECT_ID --body proj_xxx
  #                        gh secret  set OPENSHIP_TOKEN
  deploy:
    needs: [unit, gates, web, smoke]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.OPENSHIP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # 60 分钟：这个 job 现在会**等到部署终态**（构建 9–25 分钟 + 等待 30 分钟窗口 + 余量）。
    # 原来的 30 分钟是「只触发不等待」时代的预算，别照着它缩。
    timeout-minutes: 60
    # 并行 agent 同时合并时，部署必须**排队**而不是互相抢：
    #   - group 用仓库级（不是 github.ref），所有合并进同一条队列；
    #   - cancel-in-progress: false → 不取消正在跑的部署（取消会留下半部署状态）；
    #   - GitHub 每个 group 只保留一个 running + 一个 pending，新到的替换旧 pending
    #     → 连续合并只跑最新那次。
    # 本 job 会等到部署终态，排队后时间窗是叠加的，但 timeout-minutes 仍按单次预算即可。
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # release 工作流会把 `chore(release)` 提交推回 main ⇒ 会被本工作流再触发一次。
      # 那条只改 CHANGELOG/版本号，部署它没有意义，而且每发一版多一次完整重建 + 一次切流窗口
      # （2026-11-19 实测：一次 release 提交触发了整整一轮部署，切流期间 edge 路由短暂空窗）。
      # 用事件载荷判（本 job 不 checkout，没有 git 上下文）。
      # 同一个步骤判三件事（只取一次变更文件清单）：
      #   skip=1    —— `chore(release)` 提交（release 工作流推回来的，只改 CHANGELOG/版本号）
      #   runtime=0 —— 本次改动**全部**是文档/工作流/.claude/CHANGELOG ⇒ 部署它没有意义，
      #                只会多一次重建 + 一个切流窗口（2026-11-19 实测：docs-only 合并同样触发了
      #                整轮部署，切流期间站点短暂 502）
      #   bot=1     —— 本次改动触及 openclaw（见下）
      #
      # runtime 判据是**白名单跳过、其它一律部署**（fail-safe）：只有「每个文件都命中
      # docs/ .github/ .claude/ CHANGELOG 或以 .md 结尾」才判 0；取不到清单也判 1。
      # 宁可多部署一次，也不能因为路径判据漏了而让线上停在旧代码。
      - name: 判定本次是否部署（release / 仅文档 / 带 openclaw）
        id: guard
        env:
          MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          first=$(printf '%s' "${MSG}" | head -1)
          if [[ "$first" == chore\(release\)* ]]; then
            echo "release commit, skip deploy"
            { echo "skip=1"; echo "runtime=0"; echo "bot=0"; echo "app-compose=0"; echo "data-compose=0"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

          files=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}" \
            | jq -r '.files[]?.filename' 2>/dev/null || true)

          runtime=1
          if [ -z "${files}" ]; then
            echo "取不到变更清单 ⇒ 按需要部署处理"
          elif ! printf '%s\n' "${files}" | grep -vqE '(^docs/|^\.github/|^\.claude/|^CHANGELOG|\.md$)'; then
            runtime=0
            echo "本次改动全部是文档/工作流/CHANGELOG ⇒ 跳过部署："
            printf '  - %s\n' ${files}
          fi
          echo "runtime=${runtime}" >> "$GITHUB_OUTPUT"

          # bot 的触发面：它自己的插件/镜像定义 + compose 本身
          if printf '%s\n' "${files}" | grep -qE '^(deploy/openclaw/|deploy/Dockerfile\.openclaw$|deploy/docker-compose\.yml$)'; then
            echo "bot=1" >> "$GITHUB_OUTPUT"
            echo "本次变更触及 openclaw，将一并部署"
          else
            echo "bot=0" >> "$GITHUB_OUTPUT"
          fi

          # compose 变更 ⇒ 退回全量（可能有新增/删除服务，子集选择会漏）
          if printf '%s\n' "${files}" | grep -qE '^deploy/docker-compose\.yml$'; then
            echo "app-compose=1" >> "$GITHUB_OUTPUT"
          else
            echo "app-compose=0" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "${files}" | grep -qE '^deploy/data-compose\.yml$'; then
            echo "data-compose=1" >> "$GITHUB_OUTPUT"
          else
            echo "data-compose=0" >> "$GITHUB_OUTPUT"
          fi
      # secret 不能在 job 级 if 里判，但可以在 step 里判：变量配了而 secret 没配属于配置错误，
      # 应当**响亮失败**（而不是静默跳过——静默跳过会让人以为「已经部署了」）
      - name: 校验凭据齐备
        if: steps.guard.outputs.skip != '1' && steps.guard.outputs.runtime == '1'
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
        run: |
          if [ -z "${OPENSHIP_TOKEN}" ]; then
            echo "::error::repo variable OPENSHIP_PROJECT_ID 已设置，但 secret OPENSHIP_TOKEN 缺失。"
            echo "adopt 之后需一并配置：gh secret set OPENSHIP_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
      # 本次要不要顺带重建 openclaw（问数 bot）。
      #
      # 为什么单列：bot 与应用单元同宿主同 project，但**生命周期应当解耦**——平台每次发版都
      # 重建它，企微长连接就会跟着断一次（2026-11-19 观测到两次 1 分钟级断连）；反过来它起得慢
      # 会让整次部署带「部分服务未健康」告警，污染平台自己的部署结论。
      #
      # 为什么不是拆成独立 project（2026-11-19 实测结论，别再试）：
      #   ① `advanced.networkMode` 只接受 `none` / `service:<本栈内服务>`，跨 project 复用网络
      #      直接被 VALIDATION_ERROR 拒；
      #   ② 新 project 必须指向整份 `deploy/docker-compose.yml`，而 compose 闸门按**整份文件**
      #      比对 ⇒ 它要求把 postgres/server/notify-worker/mb-proxy/sandbox-console 一起作为
      #      「新增服务」拉起来（等于同机再起一套平台）。平台没有「服务子集视图」。
      #   ⇒ 物理拆分需要第三份 compose（违 B7），属架构议题；这里用**定向部署**取得同样的
      #     「平台发版不重启 bot」效果。
      - name: 触发 openship 部署（按本 commit 锚定）
        if: steps.guard.outputs.skip != '1' && steps.guard.outputs.runtime == '1'
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
          PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
          # 控制面地址做成变量是为了换环境不改工作流；缺省即公司控制面
          OPENSHIP_URL: ${{ vars.OPENSHIP_URL || 'https://deploy.hookflow.cn' }}
          COMMIT_SHA: ${{ github.sha }}
          INCLUDE_BOT: ${{ steps.guard.outputs.bot }}
          APP_COMPOSE: ${{ steps.guard.outputs.app-compose }}
        run: |
          set -euo pipefail
          echo "openship: project=$PROJECT_ID commit=$COMMIT_SHA"
          # 服务清单现查（不写死 id：服务行重建后 id 会变，写死等于埋定时炸弹）。
          # 查失败就**退回全量部署**——宁可多重启一次 bot，也不能因为查不到而部署不了。
          # 定向部署的排除集（生命周期分层，见 deploy/deployment-units.md §5）：
          #   · postgres 是**状态容器**——常规代码变更重建它会让数据单元的调度台账断连，
          #     作业跑完却写不进库 ⇒ 被 reapStale 收成假 timeout（2026-11-19 实测）。
          #     只有 compose 变更（可能有配置/新增服务）才重建它。
          #   · openclaw 只在 bot 路径变更时重建（已有逻辑）。
          EXCLUDES=''
          if [ "${APP_COMPOSE}" != "1" ]; then EXCLUDES='postgres'; fi
          if [ "${INCLUDE_BOT}" != "1" ]; then EXCLUDES="${EXCLUDES} openclaw"; fi
          SERVICE_IDS='null'
          if [ -n "${EXCLUDES// /}" ]; then
            SERVICE_IDS=$(curl -sS -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
              "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services" \
              | jq -c --arg ex "${EXCLUDES}" \
                '[.services[]? | select(.enabled != false) | . as $s
                  | select((($ex | split(" ")) | index($s.name)) | not) | .id]' 2>/dev/null || echo 'null')
            if [ "${SERVICE_IDS}" = "[]" ] || [ "${SERVICE_IDS}" = "null" ]; then
              echo "服务清单不可用 ⇒ 退回全量部署"
              SERVICE_IDS='null'
            else
              echo "定向部署（排除：${EXCLUDES# }）：${SERVICE_IDS}"
            fi
          fi
          # commitSha 是幂等键：同一个 sha 重复触发不会部署出两份不同的东西。
          # 只发触发、不在 CI 里轮询到 live——构建状态归 openship（deploy/openship-adopt.md 第 7 节）
          #
          # 部署互斥（2026-09-14 实测，PR #55/#56 连续合并踩到）：同项目已有部署在跑时，
          # API 回 403 body "A deployment is already in progress"——这不是错误，等待重试即可
          # （curl 不用 -f：-f 会把 403 的 body 丢掉，无法区分「互斥等待」与「真失败」）。
          #
          # ⚠️ **等待窗口必须 > 一次完整构建**（2026-11-12 实测订正）：mytech 单次部署
          # `buildDurationMs` ≈ 500–580s（9–10 分钟）；原窗口 10×30s ≈ 5 分钟，**只要 main 上
          # 短时间内合两个 PR，后一个的 deploy 必然红**（#2009、#2018 两次实证）。改为 24×30s
          # ≈ 12 分钟，覆盖一次构建 + 切流余量。别凭直觉把它调回 5 分钟。
          # serviceIds 为空时不要传这个键（null ≠ []：空数组会被当成「什么都不部署」）
          PAYLOAD=$(jq -c -n --arg pid "${PROJECT_ID}" --arg sha "${COMMIT_SHA}" --argjson ids "${SERVICE_IDS}" \
            '{projectId:$pid, branch:"main", commitSha:$sha, environment:"production"}
             + (if $ids != null and ($ids|length) > 0 then {serviceIds:$ids} else {} end)')
          echo "payload: ${PAYLOAD}"
          DEP_ID=""
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/openship-deploy.json -w '%{http_code}' -X POST "${OPENSHIP_URL%/}/api/deployments" \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "${PAYLOAD}")
            if [ "${CODE:0:1}" = "2" ]; then
              echo "openship 响应（HTTP ${CODE}）："
              cat /tmp/openship-deploy.json
              DEP_ID=$(jq -r '.data.deployment_id // empty' /tmp/openship-deploy.json)
              break
            fi
            BODY=$(cat /tmp/openship-deploy.json 2>/dev/null || true)
            echo "第 ${i}/24 次触发：HTTP ${CODE} ${BODY:0:200}"
            # compose 闸门：把「哪几个服务变了」打出来，并给出可执行的处置（不带它就只能人工救）
            if grep -q 'COMPOSE_REVIEW_REQUIRED' /tmp/openship-deploy.json 2>/dev/null; then
              echo "::error::compose 有未接受的变更（COMPOSE_REVIEW_REQUIRED）"
              jq -r '.composeChanges | to_entries[] | "  \(.key): \(.value | join(", "))"' /tmp/openship-deploy.json 2>/dev/null || true
              echo "::notice::处置：人工触发一次带 acceptComposeChanges:true 的部署，或对漂移服务 drift_keep（deploy/openship-adopt.md 坑 6）"
              exit 1
            fi
            # 仅对「部署互斥」重试；其他错误（401/403 授权、4xx 参数）立即失败
            if ! grep -q 'already in progress' /tmp/openship-deploy.json 2>/dev/null; then
              echo "::error::部署触发失败（非互斥错误，不重试）"
              exit 1
            fi
            echo "既有部署在跑，30s 后重试"
            sleep 30
          done
          if [ -z "${DEP_ID}" ]; then
            echo "::error::等待既有部署完成超时（约 12 分钟）——去控制面看卡住的部署"
            exit 1
          fi

          # ── 等终态：**绿 = 线上就是这个 commit**（2026-11-19 补）─────────────────────────
          # 此前这里拿到 2xx 就 exit 0，于是「CI 绿」只代表「控制面受理了」：PR #2522 合并后
          # 实际部署挂在 `git clone ... exit 128`，而 CI 全绿、线上没变。发布系统的核心不变量
          # 是「绿灯 ⇒ 线上跑的就是这个 commit」，缺了它，后面所有判断都建在沙上。
          # 构建 9–25 分钟量级 ⇒ 90×20s = 30 分钟窗口，job timeout 同步放到 60 分钟。
          echo "等待部署 ${DEP_ID} 走到终态…"
          for i in $(seq 1 90); do
            curl -sS -o /tmp/openship-status.json \
              "${OPENSHIP_URL%/}/api/deployments/${DEP_ID}" \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" || true
            ST=$(jq -r '.data.status // empty' /tmp/openship-status.json 2>/dev/null || true)
            case "${ST}" in
              ready)
                DEP_SHA=$(jq -r '.data.commitSha // empty' /tmp/openship-status.json)
                if [ "${DEP_SHA}" != "${COMMIT_SHA}" ]; then
                  echo "::error::部署 ${DEP_ID} 的 commitSha=${DEP_SHA} 与本次 ${COMMIT_SHA} 不一致"
                  exit 1
                fi
                echo "✅ 部署完成：${DEP_ID}（commit ${COMMIT_SHA}）"
                exit 0
                ;;
              failed|cancelled|rolled_back)
                msg=$(jq -r '.data.errorMessage // "(无 errorMessage)"' /tmp/openship-status.json 2>/dev/null | head -c 800)
                echo "::error::部署 ${DEP_ID} 失败：${ST} — ${msg}"
                exit 1
                ;;
              "")
                echo "状态读取失败，重试（${i}/90）"
                ;;
              *)
                if [ $((i % 15)) -eq 0 ]; then echo "部署中… ${ST}（${i}/90，约 $((i * 20 / 60)) 分钟）"; fi
                ;;
            esac
            sleep 20
          done
          echo "::error::等待部署终态超时（30 分钟）——${DEP_ID} 仍未结束，去控制面看卡住的部署"
          exit 1

  # 数据单元（部署单元 B）的自动部署：**只在数据面相关路径变更时触发**。
  #
  # 为什么不跟应用单元一起每次都发：数据单元跑的是采集/物化（scheduler、pg_duckdb、
  # lemeng console、artifacts），发一次＝重建这几个容器并中断正在跑的作业。平台侧改个页面
  # 不该动它。
  # 判据取「路径」而不是「服务变了没有」：dbt 模型/管线这些是**数据面代码**，不在这份 compose
  # 的字段里，但合并后必须落地。
  deploy-data:
    needs: [unit, gates, web, smoke]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.OPENSHIP_DATA_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 判定本次变更是否触及数据面
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}" \
            | jq -r '.files[]?.filename' 2>/dev/null || true)
          # 数据单元镜像面：compose/duckle/artifacts 与数据面脚本（原列表）+ **调度器自身**。
          # 调度器跑在数据单元（deploy/data-compose.yml 的 scheduler 服务），但它的代码在
          # apps/server/src/scheduler/、执行的脚本在 scripts/*.mjs。只改这两处而不触发数据部署
          # ⇒ 新 JobDef/新脚本永远进不了调度器容器（改了等于没改，2026-11-20 加 data.demand_mining 时发现）。
          DATA_PATH_RE='^(deploy/data-compose\.yml$|deploy/Dockerfile\.|deploy/duckle/|deploy/artifacts/|deploy/data-plane\.lock$|scripts/lemeng/|scripts/ops/|dbt/|duckle/|pipelines/|apps/server/src/scheduler/)'
          hit=0
          if printf '%s\n' "$files" | grep -qE "${DATA_PATH_RE}"; then
            hit=1
            echo "触及数据面：$(printf '%s\n' "$files" | grep -cE "${DATA_PATH_RE}") 个文件"
          fi
          # registry 里登记的系统 job 脚本：改了就必然要换调度器镜像（逐个精确比对，不靠前缀猜）。
          # 读不到 registry（网络/解析失败）⇒ **按命中处理**（fail-safe：宁可多部署一次，不可跑旧代码）。
          script_files=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/apps/server/src/scheduler/registry.ts?ref=${COMMIT_SHA}" \
            | jq -r '.content // empty' 2>/dev/null | base64 -d 2>/dev/null \
            | grep -oE "script: '[^']+'" | sed -E "s/script: '//; s/'$//" | sort -u || true)
          if [ -z "${script_files}" ]; then
            echo "::warning::读不到 registry 脚本清单 ⇒ 按「触及数据面」处理（fail-safe）"
            hit=1
          else
            touched=$(printf '%s\n' "$files" | grep -xFf <(printf '%s\n' "${script_files}") || true)
            if [ -n "${touched}" ]; then
              hit=1
              echo "触及调度器 job 脚本：$(printf '%s\n' "${touched}" | tr '\n' ' ')"
            fi
          fi
          if [ "${hit}" = "1" ]; then
            echo "hit=1" >> "$GITHUB_OUTPUT"
          else
            echo "hit=0" >> "$GITHUB_OUTPUT"
            echo "本次变更与数据面无关，跳过数据单元部署"
          fi
          # 执行器要不要重建？（#2574）——**它跑的东西变了就必须重建**，否则新脚本/新模型永远进不了执行器镜像。
          # ⚠️ 2026-11-20 实测教训：先前只有下游的 `--argjson ex "${EXECUTOR:-0}"`，**没有任何地方产出这个 flag**
          #    ⇒ `EXECUTOR` 恒为 0 ⇒ CI 从未重建过执行器（新脚本进不去）。这次把判据写全。
          # 覆盖面 = 执行器真正读的东西：镜像（Dockerfile）/ compose / 全部 scripts / dbt / 契约 /
          # 调度器模块 / notify（事件入队）。持续排空保证：重建前 running=0（§5.6）。
          if printf '%s\n' "$files" | grep -qE '^(deploy/Dockerfile\.|deploy/data-compose\.yml$|scripts/|dbt/|contracts/|apps/server/src/scheduler/|modules/)'; then
            echo "executor=1" >> "$GITHUB_OUTPUT"
          else
            echo "executor=0" >> "$GITHUB_OUTPUT"
          fi
          # 三段必须同时在场（产出 executor= / 透传 EXECUTOR: / 消费 ${EXECUTOR}），
          # 少一段就等于没接——2026-11-20 为此连踩两次（先漏产出，再漏透传）。
          # 子集选择用的三个标志（生命周期分层，见 deploy/deployment-units.md §5）
          if printf '%s\n' "$files" | grep -qE '^deploy/data-compose\.yml$'; then echo "data_compose=1" >> "$GITHUB_OUTPUT"; else echo "data_compose=0" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$files" | grep -qE '^(deploy/duckle/|duckle/|pipelines/)'; then echo "duckle=1" >> "$GITHUB_OUTPUT"; else echo "duckle=0" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$files" | grep -qE '^deploy/artifacts/'; then echo "artifacts=1" >> "$GITHUB_OUTPUT"; else echo "artifacts=0" >> "$GITHUB_OUTPUT"; fi
      - name: 触发数据单元部署
        if: steps.plan.outputs.hit == '1'
        env:
          OPENSHIP_TOKEN: ${{ secrets.OPENSHIP_TOKEN }}
          PROJECT_ID: ${{ vars.OPENSHIP_DATA_PROJECT_ID }}
          OPENSHIP_URL: ${{ vars.OPENSHIP_URL || 'https://deploy.hookflow.cn' }}
          COMMIT_SHA: ${{ github.sha }}
          DATA_COMPOSE: ${{ steps.plan.outputs.data_compose }}
          DUCKLE: ${{ steps.plan.outputs.duckle }}
          ARTIFACTS: ${{ steps.plan.outputs.artifacts }}
          # ⚠️ 必须透传：plan 步骤产出的 `executor` 输出不接到这里，下面 `${EXECUTOR:-0}` 恒为 0
          #    ⇒ 执行器永不重建（2026-11-20 实测：只补了产出、漏了透传，等于没修）。
          EXECUTOR: ${{ steps.plan.outputs.executor }}
        run: |
          set -euo pipefail
          echo "openship(data): project=$PROJECT_ID commit=$COMMIT_SHA"

          # ── 运行中作业闸门（#2548）──────────────────────────────────────────────────
          # 数据单元部署会重启 scheduler ⇒ 正在跑的 hourly/audits（20–90 分钟）被连坐杀掉，
          # 台账上变成 timeout（2026-11-19 实测：a2a 11:30、publish_dims 11:43）。
          # 闸门语义（三层，别简化）：
          #   · 查到 running=0     → 放行部署；
          #   · 查到 running>0     → 每 60s 复查，最长 ~35 分钟；到点仍在跑 ⇒ **红掉**
          #     （fail-fast：杀掉 90 分钟的审计比红一次部署贵得多；重跑 gh run rerun 即可）；
          #   · 闸门自身查不到状态（token 无 exec 权限 / API 5xx / 输出解析失败）
          #     → **响亮告警后放行**——闸门故障不能演变成「永远部不了署」（fail-safe 方向
          #     与服务清单一致：宁可冒险，不可漏部署）。
          GATE_MAX_WAIT=35   # 分钟
          GATE_INTERVAL=60   # 秒
          GATE_QUERY='psql "$DATABASE_URL" -Atc "select coalesce(count(*),0) from platform.job_run where status = '"'"'running'"'"'"'
          # 排空信号（#2567）：闸门只保证「触发那一刻没作业」，挡不住「构建那 5–10 分钟里新起的作业」。
          # 触发部署前先落一行 `drain`，worker 每拍看到它就**不再 claim**；构建期间自然不会有新作业，
          # 重启时也就没有可砍的。新容器启动即清除（见 scripts/notify-worker.mjs）；部署没落地则由
          # `until_ms`（45 分钟）兜底，不会永久停摆。
          DRAIN_SET_QUERY='psql "$DATABASE_URL" -Atc "insert into platform.scheduler_control(key,value) values ('"'"'drain'"'"', jsonb_build_object('"'"'until_ms'"'"', (extract(epoch from now() + interval '"'"'45 minutes'"'"') * 1000)::bigint)) on conflict (key) do update set value = excluded.value, updated_at = now()"'
          DRAIN_DEL_QUERY='psql "$DATABASE_URL" -Atc "delete from platform.scheduler_control where key = '"'"'drain'"'"'"'
          DRAIN_SET=0
          # 只有「信号落了但部署没触发」才回滚信号——否则会让数据单元白等 45 分钟。
          # 部署已触发时**不清**：信号要活到新容器起来（构建期间正是最容易起新作业的窗口）。
          cleanup_drain() {
            if [ "${DRAIN_SET}" = "1" ] && [ -z "${DEP_ID:-}" ]; then
              CLEAR_BODY=$(jq -nc --arg cmd "$DRAIN_DEL_QUERY" '{command:$cmd, timeoutMs: 15000}')
              curl -sS -X POST \
                -H "Authorization: Bearer ${OPENSHIP_TOKEN}" -H 'Content-Type: application/json' \
                -d "${CLEAR_BODY}" \
                "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services/${SCHEDULER_SVC_ID}/exec" >/dev/null 2>&1 || true
              echo "部署未触发 ⇒ 已清除排空信号（否则数据单元会白等 45 分钟）"
            fi
          }
          trap cleanup_drain EXIT
          SCHEDULER_SVC_ID=$(curl -sS -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
            "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services" \
            | jq -r '.services[]? | select(.name == "scheduler") | .id' 2>/dev/null || true)
          # ── 维护锁（#2585）─────────────────────────────────────────────────────────
          # 闸门查的是 `job_run.status='running'`，而**长 exec 任务**（历史回填、数据迁移）不在台账里
          # ⇒ 闸门看不见它们，照常部署就会把跑了几小时的回填写到一半砍掉（2026-11-20 的风险点）。
          # 有锁就不部署（fail-fast，worker 的红灯语义一致）；窗口结束 `gh run rerun` 即可。
          MAINT_QUERY='psql "$DATABASE_URL" -Atc "select coalesce(value->>'"'"'reason'"'"','"'"'maintenance'"'"') from platform.scheduler_control where key='"'"'maintenance'"'"' and (value->>'"'"'until_ms'"'"')::bigint > extract(epoch from now())*1000"'
          if [ -n "${SCHEDULER_SVC_ID}" ]; then
            MAINT_BODY=$(jq -nc --arg cmd "$MAINT_QUERY" '{command:$cmd, timeoutMs: 15000}')
            MAINT_JSON=$(curl -sS -X POST \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" -H 'Content-Type: application/json' \
              -d "${MAINT_BODY}" \
              "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services/${SCHEDULER_SVC_ID}/exec" 2>/dev/null || true)
            MAINT_REASON=$(printf '%s' "${MAINT_JSON}" | jq -r '.data.output // .output // ""' 2>/dev/null | tr -d '\r\n' || true)
            if [ -n "${MAINT_REASON}" ]; then
              echo "::error::维护锁在（${MAINT_REASON}）——维护窗口内不部署数据单元，避免砍掉长任务。"
              echo "处置：窗口结束后 gh run rerun 本 run（drain.sh status 可看 until_ms）。"
              exit 1
            fi
          fi
          GATE_BODY=$(jq -nc --arg cmd "$GATE_QUERY" '{command:$cmd, timeoutMs: 15000}')
          gate_waited=0
          if [ -n "${SCHEDULER_SVC_ID}" ]; then
            while :; do
              GATE_JSON=$(curl -sS -X POST \
                -H "Authorization: Bearer ${OPENSHIP_TOKEN}" -H 'Content-Type: application/json' \
                -d "${GATE_BODY}" \
                "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services/${SCHEDULER_SVC_ID}/exec" 2>/dev/null || true)
              GATE_EXIT=$(printf '%s' "${GATE_JSON}" | jq -r '.data.exitCode // .exitCode // "x"' 2>/dev/null || echo x)
              RUNNING=$(printf '%s' "${GATE_JSON}" | jq -r '.data.output // .output // ""' 2>/dev/null | tr -dc '0-9' || true)
              if [ "${GATE_EXIT}" != "0" ] || [ -z "${RUNNING}" ]; then
                echo "::warning::运行中作业闸门查不到状态（exit=${GATE_EXIT}）⇒ 放行部署。"
                echo "  闸门输出（前 300 字）：${GATE_JSON:0:300}"
                break
              fi
              if [ "${RUNNING}" = "0" ]; then
                echo "闸门：无运行中作业 ⇒ 放行部署"
                # 同一通道写排空信号（与闸门同一条 exec 通路，权限一致）。
                DRAIN_BODY=$(jq -nc --arg cmd "$DRAIN_SET_QUERY" '{command:$cmd, timeoutMs: 15000}')
                DRAIN_JSON=$(curl -sS -X POST \
                  -H "Authorization: Bearer ${OPENSHIP_TOKEN}" -H 'Content-Type: application/json' \
                  -d "${DRAIN_BODY}" \
                  "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services/${SCHEDULER_SVC_ID}/exec" 2>/dev/null || true)
                if [ "$(printf '%s' "${DRAIN_JSON}" | jq -r '.data.exitCode // .exitCode // "x"' 2>/dev/null)" = "0" ]; then
                  DRAIN_SET=1
                  echo "排空信号已落：构建期间 worker 不再 claim 新作业"
                else
                  echo "::warning::排空信号写入失败（不阻断部署）：${DRAIN_JSON:0:200}"
                fi
                break
              fi
              if [ "${gate_waited}" -ge $((GATE_MAX_WAIT * 60)) ]; then
                echo "::error::数据单元仍有 ${RUNNING} 个作业在跑（已等 ${GATE_MAX_WAIT} 分钟）——部署会杀掉它们，宁可不部署。"
                echo "处置：等作业结束后 gh run rerun 本 run，或下一次合并会自动重试。"
                exit 1
              fi
              echo "闸门：${RUNNING} 个作业在跑，${GATE_INTERVAL}s 后复查（已等 ${gate_waited}s / 上限 ${GATE_MAX_WAIT}min）"
              sleep "${GATE_INTERVAL}"
              gate_waited=$((gate_waited + GATE_INTERVAL))
            done
          else
            echo "::warning::查不到 scheduler 服务 id ⇒ 闸门未生效，直接部署（可接受，与旧行为一致）"
          fi
          # ── 定向部署（生命周期分层，见 deploy/deployment-units.md §5）───────────────
          # 默认只重启 scheduler（执行器）。pg_duckdb / console 是状态容器：
          # 每次 dbt 变更都重建它们会让正在跑的作业与连接一起断（2026-11-19 实测）。
          # compose 变更 ⇒ 退回全量（可能有新增/删除服务，子集选择会漏）。
          SERVICE_IDS='null'
          if [ "${DATA_COMPOSE}" != "1" ]; then
            SERVICE_IDS=$(curl -sS -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
              "${OPENSHIP_URL%/}/api/projects/${PROJECT_ID}/services" \
              | jq -c --argjson du "${DUCKLE}" --argjson ar "${ARTIFACTS}" --argjson ex "${EXECUTOR:-0}" \
                '[.services[]? | select(.enabled != false) | . as $s
                  | select($s.name == "scheduler"
                           or ($s.name == "executor" and $ex == 1)
                           or (($s.name | startswith("lemeng-console")) and $du == 1)
                           or ($s.name == "forms-console" and $du == 1)
                           or ($s.name == "artifacts" and $ar == 1)) | .id]' 2>/dev/null || echo 'null')
            if [ "${SERVICE_IDS}" = "[]" ] || [ "${SERVICE_IDS}" = "null" ]; then
              echo "服务清单不可用 ⇒ 退回全量部署"
              SERVICE_IDS='null'
            else
              echo "定向部署（数据单元）：${SERVICE_IDS}"
            fi
          fi
          PAYLOAD=$(jq -c -n --arg pid "${PROJECT_ID}" --arg sha "${COMMIT_SHA}" --argjson ids "${SERVICE_IDS}" \
            '{projectId:$pid, branch:"main", commitSha:$sha, environment:"production"}
             + (if $ids != null and ($ids|length) > 0 then {serviceIds:$ids} else {} end)')
          # 与主单元同样的互斥重试口径 + **等终态**（理由见 deploy job 的注释）
          DEP_ID=""
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/openship-deploy-data.json -w '%{http_code}' -X POST "${OPENSHIP_URL%/}/api/deployments" \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "${PAYLOAD}")
            if [ "${CODE:0:1}" = "2" ]; then
              echo "openship 响应（HTTP ${CODE}）："
              cat /tmp/openship-deploy-data.json
              DEP_ID=$(jq -r '.data.deployment_id // empty' /tmp/openship-deploy-data.json)
              break
            fi
            BODY=$(cat /tmp/openship-deploy-data.json 2>/dev/null || true)
            echo "第 ${i}/24 次触发：HTTP ${CODE} ${BODY:0:200}"
            if grep -q 'COMPOSE_REVIEW_REQUIRED' /tmp/openship-deploy-data.json 2>/dev/null; then
              echo "::error::数据单元 compose 有未接受的变更（COMPOSE_REVIEW_REQUIRED）"
              jq -r '.composeChanges | to_entries[] | "  \(.key): \(.value | join(", "))"' /tmp/openship-deploy-data.json 2>/dev/null || true
              echo "::notice::处置：人工触发一次带 acceptComposeChanges:true 的部署，或对漂移服务 drift_keep（deploy/openship-adopt.md 坑 6）"
              exit 1
            fi
            if ! grep -q 'already in progress' /tmp/openship-deploy-data.json 2>/dev/null; then
              echo "::error::数据单元部署触发失败（非互斥错误，不重试）"
              exit 1
            fi
            echo "既有部署在跑，30s 后重试"
            sleep 30
          done
          if [ -z "${DEP_ID}" ]; then
            echo "::error::等待既有部署完成超时（约 12 分钟）——去控制面看卡住的部署"
            exit 1
          fi

          echo "等待数据单元部署 ${DEP_ID} 走到终态…"
          for i in $(seq 1 90); do
            curl -sS -o /tmp/openship-status-data.json \
              "${OPENSHIP_URL%/}/api/deployments/${DEP_ID}" \
              -H "Authorization: Bearer ${OPENSHIP_TOKEN}" || true
            ST=$(jq -r '.data.status // empty' /tmp/openship-status-data.json 2>/dev/null || true)
            case "${ST}" in
              ready)
                echo "✅ 数据单元部署完成：${DEP_ID}"
                exit 0
                ;;
              failed|cancelled|rolled_back)
                msg=$(jq -r '.data.errorMessage // "(无 errorMessage)"' /tmp/openship-status-data.json 2>/dev/null | head -c 800)
                echo "::error::数据单元部署 ${DEP_ID} 失败：${ST} — ${msg}"
                exit 1
                ;;
              "")
                echo "状态读取失败，重试（${i}/90）"
                ;;
              *)
                if [ $((i % 15)) -eq 0 ]; then echo "部署中… ${ST}（${i}/90）"; fi
                ;;
            esac
            sleep 20
          done
          echo "::error::等待数据单元部署终态超时（30 分钟）——${DEP_ID} 仍未结束"
          exit 1

  # 提交纪律的**事后绊线**（不是门禁，理由见文件头注）。触发面：push 到 main。
  #
  # 判据用 `GET /repos/{owner}/{repo}/commits/{sha}/pulls`，而**不是"数父提交有几个"**：
  # squash / rebase 合并产生的新提交同样是单父的，数父会把正常的 squash 合并误判成直推。
  # associated-pulls 接口对 squash/rebase 合并返回的正是那个 PR，这才是我们要的语义。
  #
  # 已知边界（照实记，别当它滴水不漏）：
  #   ① push 事件的 `commits` 数组上限 20 条，一次推 20+ 条时只查前 20；
  #   ② **只删提交的 force push**（"把我那次直推抹掉"最自然的动作）其 `commits` 为空 ——
  #      无对象可判。此时本 job 必须打印"无法判定"，**绝不能**在空集上报"均经由 PR"：
  #      空集上给出肯定结论比不说话更糟（那是主动作伪证，不是沉默）；
  #   ③ 直推一条**已经有开着的 PR** 的分支到 main（`git push origin mybranch:main`），
  #      关联 API 会照常返回那个 PR ⇒ 判不出来。这是判据的语义边界，不是本 job 的 bug。
  # 要精确覆盖 ②③ 须改用 compare API 并处理"force push 时 before 不是祖先"，不划算。
  main-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # 不需要 checkout：只查 API，不碰工作树
      - name: 检查本次推送的提交是否经由 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          set -euo pipefail
          # 首次推送（新仓）before 是全 0，没有可比对的历史 —— 不判直推
          if printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            # 变量必须写成 ${VAR}：紧跟其后的是全角括号「）」，而 bash 3.2（macOS 自带
            # /bin/bash，本仓开发机就是）在 UTF-8 locale 下会把 0x80 以上的字节也当成变量名
            # 的合法字符 —— `$BEFORE）` 会被解析成变量 `BEFORE）`，在 set -u 下直接
            # "unbound variable" 退出 1。也就是说：**这条本意是「安全跳过」的分支，会在
            # bash 3.2 上把 job 弄挂**。CI 用的是 bash 5（解析正确，实测 5.2.37 无此问题），
            # 所以只坑本地复跑；加花括号在两种 bash 上都正确，故一律用 ${}。
            echo "首次推送（before=${BEFORE}），跳过本次判定。"
            exit 0
          fi

          offenders=''
          checked=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            checked=$((checked + 1))
            # PR 关联查询带**重试退避**（issue #22）：GitHub 对 squash 提交与其 PR 的关联是
            # **异步索引**的 —— job 跑得越快，越容易在索引可见之前发问，拿到 0 而误判「直推」。
            # 实测（2026-09-12 合并 #21）：push 后 4 秒查得 0；同一 SHA 数分钟后查得 1；
            # 同一 job 重跑即绿。**不是偶发** —— 该 job 此前 12 次合并都在 ~4s 内就查到了关联，
            # 说明这是**尾部竞态**而非常态延迟，故 0 **不立即判罪**，退避重试足以覆盖。
            # 预算 5 次 × 12s ≈ 60s（job 的 timeout-minutes: 5 余量充足）。重试**逐次打印**，
            # 让等待可见 —— 别把红绿的区别藏进静默重试。
            #
            # **刻意不加「subject 以 (#N) 结尾即放行」的快路径**（issue #22 曾提议）：那会把本
            # 守卫从「用 API 实证」降级为「信提交消息文本」，任何人给直推提交尾巴补一个 (#N)
            # 即可绕过 —— 而这条绊线存在的意义正是拦住那个动作（见 runbook 第三节）。
            # API 关联无法伪造：不带真 PR 就查不到。
            tries=0
            count=0
            while :; do
              tries=$((tries + 1))
              count=$(gh api "repos/$REPO/commits/$sha/pulls" --jq 'length')
              [ "$count" != '0' ] && break
              [ "$tries" -ge 5 ] && break
              echo "  · $sha 暂时查不到 PR 关联（第 $tries/5 次）——可能是索引延迟，12s 后重试"
              sleep 12
            done
            if [ "$count" = '0' ]; then
              echo "  · $sha 退避重试 $tries 次后仍无 PR 关联 ⇒ 判为直推"
              offenders="$offenders $sha"
            fi
          done < <(printf '%s' "$COMMITS" | jq -r '.[].id')

          if [ -n "$offenders" ]; then
            echo "::error::检测到未经 PR 直接进入 main 的提交：$offenders"
            echo "本仓约定走 PR（背景见 deploy/branch-protection-runbook.md）："
            echo "    git switch -c <分支名> && git push -u origin <分支名> && gh pr create --fill"
            echo "确属有意直推（bootstrap / 紧急热修）时，请在 issue 或 PR 里补一条说明，"
            echo "以免事后无从追溯 —— 这条绊线要的是'可见'，不是'禁止'。"
            exit 1
          fi

          # 空集必须说"判不了"，不许说"干净"：只删提交的 force push 会走到这里，
          # 在空集上打印"均经由 PR"是主动作伪证（见文件头注的边界②）。
          if [ "$checked" -eq 0 ]; then
            echo "本次推送没有可供检查的提交（commits 为空，常见于仅删除提交的 force push）——"
            echo "**无法判定**本次是否绕过了 PR，故不报绿、也不报警。若确有过直推并被抹掉，"
            echo "请以 \`git log origin/main --first-parent\` 人工对一次。"
            exit 0
          fi

